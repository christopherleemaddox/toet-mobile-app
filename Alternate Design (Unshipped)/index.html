    prayer:'Lord, help me discipline myself, keeping my life consistent with what I say I believe. Amen.' },
  { id:331, topic:'Self-Control', cat:'faith', ref:'2 Peter 1:5-6',
    verse:'And beside this, giving all diligence, add to your faith virtue; and to virtue knowledge; And to knowledge temperance; and to temperance patience; and to patience godliness.',
    truth:'Self-control is one link in a chain that builds toward godliness — it’s not the whole goal, but it’s a necessary step.',
    prayer:'Father, help me build self-control as part of growing in godliness, one step at a time. Amen.' },
  { id:332, topic:'Self-Control', cat:'faith', ref:'Proverbs 16:32',
    verse:'He that is slow to anger is better than the mighty; and he that ruleth his spirit than he that taketh a city.',
    truth:'Ruling my own spirit is actually a greater feat than conquering something external — the hardest battles are often internal.',
    prayer:'Lord, help me rule my own spirit today, even when it’s harder than any outward battle. Amen.' },
  { id:333, topic:'Self-Control', cat:'faith', ref:'1 Thessalonians 5:6',
    verse:'Therefore let us not sleep, as do others; but let us watch and be sober.',
    truth:'Self-control requires staying alert — it’s easier to lose when I’ve stopped paying attention to what’s happening in me.',
    prayer:'Father, help me stay watchful and sober-minded, not drifting into carelessness. Amen.' },
  { id:68, topic:'Perseverance', cat:'faith', ref:'Galatians 6:9',
    verse:'And let us not be weary in well doing: for in due season we shall reap, if we faint not.',
    truth:'The harvest comes to those who don\u2019t quit \u2014 even when the season feels endless.',
    prayer:'Lord, help me keep going and not grow weary in doing good. I trust the harvest will come. Amen.' },
  { id:334, topic:'Perseverance', cat:'faith', ref:'Philippians 3:14',
    verse:'I press toward the mark for the prize of the high calling of God in Christ Jesus.',
    truth:'Perseverance means keeping my eyes on the prize ahead, not the distance already covered or the ground still left to go.',
    prayer:'Lord, help me press toward the mark, keeping my eyes on the prize You’ve called me to. Amen.' },
  { id:335, topic:'Perseverance', cat:'faith', ref:'2 Timothy 4:7',
    verse:'I have fought a good fight, I have finished my course, I have kept the faith.',
    truth:'Finishing well matters as much as starting well — perseverance is what turns a good beginning into a good ending.',
    prayer:'Father, help me finish well, keeping the faith all the way to the end. Amen.' },
  { id:336, topic:'Perseverance', cat:'faith', ref:'Luke 18:1',
    verse:'And he spake a parable unto them to this end, that men ought always to pray, and not to faint.',
    truth:'Prayer and perseverance are linked — persistent prayer is itself a form of not giving up.',
    prayer:'Lord, teach me to keep praying and not faint, even when answers take longer than I’d like. Amen.' },
  { id:337, topic:'Perseverance', cat:'faith', ref:'Hebrews 10:23',
    verse:'Let us hold fast the profession of our faith without wavering; for he is faithful that promised.',
    truth:'I can hold on without wavering not because I’m strong enough, but because the One who promised is faithful enough.',
    prayer:'Lord, help me hold fast without wavering, trusting Your faithfulness more than my own strength. Amen.' },
  { id:69, topic:'Integrity', cat:'faith', ref:'Proverbs 11:3',
    verse:'The integrity of the upright shall guide them: but the perverseness of transgressors shall destroy them.',
    truth:'Integrity isn\u2019t about being watched \u2014 it\u2019s about being the same person no matter who\u2019s looking.',
    prayer:'Lord, guide me with integrity. Let my life line up the same whether anyone\u2019s watching or not. Amen.' },
  { id:338, topic:'Integrity', cat:'faith', ref:'Psalm 15:1-2',
    verse:'LORD, who shall abide in thy tabernacle? who shall dwell in thy holy hill? He that walketh uprightly, and worketh righteousness, and speaketh the truth in his heart.',
    truth:'Integrity isn’t just about my outward actions — it starts with speaking truth even in the quiet of my own heart.',
    prayer:'Lord, help me walk uprightly and speak truth even in my own heart, not just in front of others. Amen.' },
  { id:339, topic:'Integrity', cat:'faith', ref:'Proverbs 10:9',
    verse:'He that walketh uprightly walketh surely: but he that perverteth his ways shall be known.',
    truth:'Walking with integrity gives me a kind of steadiness — I don’t have to remember which version of my story I told to which person.',
    prayer:'Father, let me walk uprightly and surely, with nothing hidden that I need to keep track of. Amen.' },
  { id:340, topic:'Integrity', cat:'faith', ref:'Job 27:5',
    verse:'God forbid that I should justify you: till I die I will not remove mine integrity from me.',
    truth:'Job held onto his integrity even under enormous pressure to compromise — it’s worth guarding that fiercely too.',
    prayer:'Lord, help me guard my integrity the way Job did, even under pressure to let it go. Amen.' },
  { id:341, topic:'Integrity', cat:'faith', ref:'Proverbs 20:7',
    verse:'The just man walketh in his integrity: his children are blessed after him.',
    truth:'The integrity I hold onto now doesn’t just shape my own life — it leaves something behind for the people who come after me.',
    prayer:'Father, let my integrity today be a blessing to those who come after me. Amen.' },
  { id:70, topic:'Faithfulness', cat:'faith', ref:'1 Thessalonians 5:24',
    verse:'Faithful is he that calleth you, who also will do it.',
    truth:'God doesn\u2019t just call me \u2014 He follows through on everything He starts in me.',
    prayer:'Lord, thank You for being faithful. Help me trust that You\u2019ll finish what You\u2019ve started in me. Amen.' },
  { id:342, topic:'Faithfulness', cat:'faith', ref:'Luke 16:10',
    verse:'He that is faithful in that which is least is faithful also in much: and he that is unjust in the least is unjust also in much.',
    truth:'Faithfulness in the small, unnoticed things is actually training ground for the bigger things I hope God will trust me with.',
    prayer:'Lord, help me be faithful in small things, trusting You are preparing me for more. Amen.' },
  { id:343, topic:'Faithfulness', cat:'faith', ref:'1 Corinthians 4:2',
    verse:'Moreover it is required in stewards, that a man be found faithful.',
    truth:'What God asks of me isn’t perfection — it’s faithfulness, showing up consistently with what I’ve been given.',
    prayer:'Father, help me be found faithful with what You’ve entrusted to me, not perfect, just faithful. Amen.' },
  { id:344, topic:'Faithfulness', cat:'faith', ref:'Psalm 89:1',
    verse:'I will sing of the mercies of the LORD for ever: with my mouth will I make known thy faithfulness to all generations.',
    truth:'God’s faithfulness isn’t just something I benefit from privately — it’s something worth telling, generation after generation.',
    prayer:'Lord, let me make Your faithfulness known, not keep it to myself. Amen.' },
  { id:345, topic:'Faithfulness', cat:'faith', ref:'Deuteronomy 7:9',
    verse:'Know therefore that the LORD thy God, he is God, the faithful God, which keepeth covenant and mercy with them that love him to a thousand generations.',
    truth:'God’s faithfulness isn’t a short-term promise — it stretches across generations, far beyond what I’ll see in my own lifetime.',
    prayer:'Father, thank You for being faithful across generations. Let me trust that faithfulness for my own life today. Amen.' },
  { id:71, topic:'Boldness', cat:'faith', ref:'Proverbs 28:1',
    verse:'The wicked flee when no man pursueth: but the righteous are bold as a lion.',
    truth:'I don\u2019t have to live afraid \u2014 righteousness gives me a boldness fear can\u2019t touch.',
    prayer:'Lord, give me boldness today. Help me stand confident instead of running from what I fear. Amen.' },
  { id:346, topic:'Boldness', cat:'faith', ref:'Acts 4:29',
    verse:'And now, Lord, behold their threatenings: and grant unto thy servants, that with all boldness they may speak thy word.',
    truth:'Boldness isn’t something I have to generate on my own — it’s something I can actually ask God to grant me.',
    prayer:'Lord, grant me boldness to speak Your word, the way the early church asked for it. Amen.' },
  { id:347, topic:'Boldness', cat:'faith', ref:'Hebrews 10:19',
    verse:'Having therefore, brethren, boldness to enter into the holiest by the blood of Jesus.',
    truth:'My boldness before God isn’t based on my own confidence — it’s based entirely on what Jesus already did to give me access.',
    prayer:'Jesus, thank You for giving me boldness to enter God’s presence through Your blood, not my own worthiness. Amen.' },
  { id:348, topic:'Boldness', cat:'faith', ref:'2 Corinthians 3:12',
    verse:'Seeing then that we have such hope, we use great plainness of speech.',
    truth:'The hope I have in Christ is meant to show up as plainness and boldness in how I speak, not hedging and hiding.',
    prayer:'Father, let the hope I have in You show up as boldness in how I speak today. Amen.' },
  { id:349, topic:'Boldness', cat:'faith', ref:'Philippians 1:14',
    verse:'And many of the brethren in the Lord, waxing confident by my bonds, are much more bold to speak the word without fear.',
    truth:'Boldness can be contagious — watching someone else stay faithful under pressure can actually give me courage to be bold too.',
    prayer:'Lord, let my boldness encourage boldness in someone else, the way Paul’s did. Amen.' },
  { id:72, topic:'Gentleness', cat:'heart', ref:'Ephesians 4:2',
    verse:'With all lowliness and meekness, with longsuffering, forbearing one another in love.',
    truth:'Strength and gentleness aren\u2019t opposites \u2014 real strength knows how to be gentle.',
    prayer:'Lord, teach me gentleness. Help me bear with others in love instead of impatience. Amen.' },
  { id:190, topic:'Gentleness', cat:'heart', ref:'Galatians 5:22-23',
    verse:'But the fruit of the Spirit is love, joy, peace, longsuffering, gentleness, goodness, faith, Meekness, temperance: against such there is no law.',
    truth:'Gentleness isn’t weakness — it’s fruit the Holy Spirit grows in me, and there’s no law standing against it.',
    prayer:'Lord, grow the fruit of gentleness in me through Your Spirit today. Amen.' },
  { id:191, topic:'Gentleness', cat:'heart', ref:'Philippians 4:5',
    verse:'Let your moderation be known unto all men. The Lord is at hand.',
    truth:'My gentleness toward others isn’t hidden — it’s something people notice, and it matters because the Lord is near.',
    prayer:'Father, let my gentleness be evident to everyone I meet today, remembering You are near. Amen.' },
  { id:192, topic:'Gentleness', cat:'heart', ref:'2 Timothy 2:24-25',
    verse:'And the servant of the Lord must not strive; but be gentle unto all men, apt to teach, patient, In meekness instructing those that oppose themselves; if God peradventure will give them repentance to the acknowledging of the truth.',
    truth:'Even when I disagree with someone, gentleness — not striving — is what God calls me to lead with.',
    prayer:'Lord, when I disagree with someone, help me lead with gentleness instead of striving to win. Amen.' },
  { id:193, topic:'Gentleness', cat:'heart', ref:'Isaiah 40:11',
    verse:'He shall feed his flock like a shepherd: he shall gather the lambs with his arm, and carry them in his bosom, and shall gently lead those that are with young.',
    truth:'God’s own gentleness toward me — carrying and gently leading — is the model for how I’m meant to treat others.',
    prayer:'Father, thank You for gently leading me. Help me lead others the same way You lead me. Amen.' },
  { id:73, topic:'Compassion', cat:'heart', ref:'Lamentations 3:22',
    verse:'It is of the LORD\u2019s mercies that we are not consumed, because his compassions fail not.',
    truth:'I\u2019m not consumed by my failures because God\u2019s compassion never runs dry.',
    prayer:'Lord, thank You for compassion that never fails. Help me extend that same compassion to others. Amen.' },
  { id:194, topic:'Compassion', cat:'heart', ref:'Matthew 9:36',
    verse:'But when he saw the multitudes, he was moved with compassion on them, because they fainted, and were scattered abroad, as sheep having no shepherd.',
    truth:'Jesus’ compassion wasn’t distant pity — it moved Him to actually act. Real compassion in me should move me too, not just make me feel something.',
    prayer:'Lord, let me see people the way You saw the multitudes — moved with compassion, not indifference. Amen.' },
  { id:195, topic:'Compassion', cat:'heart', ref:'Colossians 3:12',
    verse:'Put on therefore, as the elect of God, holy and beloved, bowels of mercies, kindness, humbleness of mind, meekness, longsuffering.',
    truth:'Compassion is something I get to put on deliberately, like clothing — a choice I make, not just a feeling I wait to have.',
    prayer:'Father, help me put on compassion and kindness today, even when I don’t naturally feel it. Amen.' },
  { id:196, topic:'Compassion', cat:'heart', ref:'Luke 10:33',
    verse:'But a certain Samaritan, as he journeyed, came where he was: and when he saw him, he had compassion on him.',
    truth:'The Good Samaritan didn’t wait to see if the hurting man deserved help — compassion saw the need and simply responded.',
    prayer:'Lord, help me respond to needs around me the way the Samaritan did, without stopping to ask if someone deserves it. Amen.' },
  { id:197, topic:'Compassion', cat:'heart', ref:'Psalm 145:9',
    verse:'The LORD is good to all: and his tender mercies are over all his works.',
    truth:'God’s compassion doesn’t play favorites — it reaches over all He’s made, and mine is meant to reflect that same wideness.',
    prayer:'Lord, let Your tender mercy over all things shape how wide my own compassion reaches. Amen.' },
  { id:74, topic:'Service', cat:'purpose', ref:'Joshua 24:15',
    verse:'But as for me and my house, we will serve the LORD.',
    truth:'Serving God isn\u2019t one option among many \u2014 it\u2019s the choice that shapes everything else.',
    prayer:'Lord, as for me, I choose to serve You today. Help my life reflect that choice. Amen.' },
  { id:446, topic:'Service', cat:'purpose', ref:'Mark 10:45',
    verse:'For even the Son of man came not to be ministered unto, but to minister, and to give his life a ransom for many.',
    truth:'Jesus, who had every right to be served, chose to serve instead — that’s the pattern I’m meant to follow, not the exception.',
    prayer:'Jesus, help me follow Your example of serving rather than expecting to be served. Amen.' },
  { id:447, topic:'Service', cat:'purpose', ref:'Galatians 5:13',
    verse:'For, brethren, ye have been called unto liberty; only use not liberty for an occasion to the flesh, but by love serve one another.',
    truth:'My freedom in Christ isn’t meant to be used purely for myself — it’s meant to free me up to actually serve others.',
    prayer:'Lord, help me use my freedom to serve others in love, not just to please myself. Amen.' },
  { id:448, topic:'Service', cat:'purpose', ref:'Colossians 3:23-24',
    verse:'And whatsoever ye do, do it heartily, as to the Lord, and not unto men; Knowing that of the Lord ye shall receive the reward of the inheritance: for ye serve the Lord Christ.',
    truth:'Whatever task I’m doing, even the ordinary and unnoticed ones, is ultimately service to Christ, not just to the people in front of me.',
    prayer:'Lord, help me serve wholeheartedly, remembering I ultimately serve You, not just people. Amen.' },
  { id:449, topic:'Service', cat:'purpose', ref:'Matthew 25:40',
    verse:'And the King shall answer and say unto them, Verily I say unto you, Inasmuch as ye have done it unto one of the least of these my brethren, ye have done it unto me.',
    truth:'Serving the overlooked and the least isn’t a lesser form of service — Jesus says it’s the same as serving Him directly.',
    prayer:'Lord, help me see You in the least of these, and serve them as I would serve You. Amen.' },
  { id:75, topic:'Sacrifice', cat:'faith', ref:'Romans 12:1',
    verse:'I beseech you therefore, brethren, by the mercies of God, that ye present your bodies a living sacrifice, holy, acceptable unto God, which is your reasonable service.',
    truth:'Giving God my life isn\u2019t a loss \u2014 it\u2019s the most reasonable response to everything He\u2019s given me.',
    prayer:'Lord, I offer myself to You today. Help me live as a living sacrifice, not just in words. Amen.' },
  { id:350, topic:'Sacrifice', cat:'faith', ref:'Hebrews 13:15-16',
    verse:'By him therefore let us offer the sacrifice of praise to God continually. But to do good and to communicate forget not: for with such sacrifices God is well pleased.',
    truth:'Sacrifice isn’t only about giving something up — praise and doing good for others count as sacrifices God is genuinely pleased with.',
    prayer:'Lord, let my praise and my care for others be sacrifices that please You today. Amen.' },
  { id:351, topic:'Sacrifice', cat:'faith', ref:'Mark 12:43-44',
    verse:'And he called unto him his disciples, and saith unto them, Verily I say unto you, That this poor widow hath cast more in, than all they which have cast into the treasury: For all they did cast in of their abundance; but she of her want did cast in all that she had, even all her living.',
    truth:'God doesn’t measure sacrifice by the size of the gift — He measures it by how much of myself it actually costs me to give it.',
    prayer:'Lord, help me give sacrificially, like the widow, not measuring by size but by what it costs me. Amen.' },
  { id:352, topic:'Sacrifice', cat:'faith', ref:'John 15:13',
    verse:'Greater love hath no man than this, that a man lay down his life for his friends.',
    truth:'The greatest measure of love Jesus names isn’t a feeling — it’s a willingness to lay something real down for someone else.',
    prayer:'Jesus, thank You for laying down Your life for me. Teach me to love others the same sacrificial way. Amen.' },
  { id:353, topic:'Sacrifice', cat:'faith', ref:'Philippians 2:17',
    verse:'Yea, and if I be offered upon the sacrifice and service of your faith, I joy, and rejoice with you all.',
    truth:'Paul could find joy even in personal sacrifice, because he saw it connected to something bigger than himself.',
    prayer:'Father, help me find joy in sacrifice, seeing it connected to something bigger than my own comfort. Amen.' },
  { id:76, topic:'Stewardship', cat:'purpose', ref:'1 Peter 4:10',
    verse:'As every man hath received the gift, even so minister the same one to another, as good stewards of the manifold grace of God.',
    truth:'What I\u2019ve been given isn\u2019t fully mine \u2014 I\u2019m just managing it well for the One who gave it.',
    prayer:'Lord, help me be a good steward of what You\u2019ve given me. Show me how to manage it faithfully. Amen.' },
  { id:450, topic:'Stewardship', cat:'purpose', ref:'Matthew 25:21',
    verse:'His lord said unto him, Well done, thou good and faithful servant: thou hast been faithful over a few things, I will make thee ruler over many things: enter thou into the joy of thy lord.',
    truth:'Faithfulness with what I’ve been given now, even if it feels small, is what prepares me for more later.',
    prayer:'Lord, help me be faithful with what You’ve entrusted to me now, trusting You with what comes next. Amen.' },
  { id:451, topic:'Stewardship', cat:'purpose', ref:'Luke 12:48',
    verse:'For unto whomsoever much is given, of him shall be much required: and to whom men have committed much, of him they will ask the more.',
    truth:'What I’ve been given isn’t just for my enjoyment — it comes with real responsibility proportional to how much I’ve received.',
    prayer:'Father, help me steward well what You’ve given me, knowing more is required of those given much. Amen.' },
  { id:452, topic:'Stewardship', cat:'purpose', ref:'Proverbs 3:9',
    verse:'Honour the LORD with thy substance, and with the firstfruits of all thine increase.',
    truth:'Stewardship starts with putting God first in what I have, not giving Him whatever happens to be left over.',
    prayer:'Lord, help me honor You with the first of what I have, not just the leftovers. Amen.' },
  { id:453, topic:'Stewardship', cat:'purpose', ref:'Genesis 2:15',
    verse:'And the LORD God took the man, and put him into the garden of Eden to dress it and to keep it.',
    truth:'Stewardship isn’t a New Testament add-on — it goes back to the very beginning, part of what I was made to do from the start.',
    prayer:'Lord, help me tend and keep what You’ve given me, the way You designed from the beginning. Amen.' },
  { id:77, topic:'Betrayal', cat:'sorrow', ref:'Psalm 41:9',
    verse:'Yea, mine own familiar friend, in whom I trusted, which did eat of my bread, hath lifted up his heel against me.',
    truth:'Even those closest to me can turn away \u2014 but that pain doesn\u2019t surprise God, and it doesn\u2019t disqualify me.',
    prayer:'Lord, heal the hurt of being betrayed. Help me trust You even when people fail me. Amen.' },
  { id:274, topic:'Betrayal', cat:'sorrow', ref:'Psalm 55:12-14',
    verse:'For it was not an enemy that reproached me; then I could have borne it: but it was thou, a man mine equal, my guide, and mine acquaintance. We took sweet counsel together, and walked unto the house of God in company.',
    truth:'David named exactly how much worse betrayal hurts when it comes from someone close — my pain over that isn’t overreacting, it’s honest.',
    prayer:'Lord, You understand how much betrayal from someone close hurts. Meet me in that specific pain today. Amen.' },
  { id:275, topic:'Betrayal', cat:'sorrow', ref:'Genesis 50:20',
    verse:'But as for you, ye thought evil against me; but God meant it unto good, to bring to pass, as it is this day, to save much people alive.',
    truth:'What someone else meant for harm doesn’t get the final word — God can still work good out of betrayal, even when I can’t see how yet.',
    prayer:'Lord, what was meant to harm me, You can still turn to good. I trust You with what I can’t yet understand. Amen.' },
  { id:276, topic:'Betrayal', cat:'sorrow', ref:'Job 19:19',
    verse:'All my inward friends abhorred me: and they whom I loved are turned against me.',
    truth:'Job named the specific pain of people he loved turning against him — God’s word makes room for that exact kind of grief.',
    prayer:'Lord, You made room in Your word for the pain of betrayal. I bring You mine honestly today. Amen.' },
  { id:277, topic:'Betrayal', cat:'sorrow', ref:'1 Peter 2:23',
    verse:'Who, when he was reviled, reviled not again; when he suffered, he threatened not; but committed himself to him that judgeth righteously.',
    truth:'Jesus responded to betrayal not by returning it but by trusting the One who judges righteously — that’s the model I can follow, even slowly.',
    prayer:'Jesus, help me respond to betrayal the way You did — entrusting myself to the One who judges righteously. Amen.' },
  { id:78, topic:'Abandonment', cat:'sorrow', ref:'Psalm 27:10',
    verse:'When my father and my mother forsake me, then the LORD will take me up.',
    truth:'Even if everyone else walks away, God is the One who never will.',
    prayer:'Lord, thank You for never forsaking me. When I feel abandoned, remind me You\u2019re holding on. Amen.' },
  { id:278, topic:'Abandonment', cat:'sorrow', ref:'Isaiah 41:17',
    verse:'When the poor and needy seek water, and there is none, and their tongue faileth for thirst, I the LORD will hear them, I the God of Israel will not forsake them.',
    truth:'God specifically names the poor and needy as people He will not forsake — feeling abandoned doesn’t put me outside His attention.',
    prayer:'Lord, thank You for promising not to forsake the needy. I come to You needy today. Amen.' },
  { id:279, topic:'Abandonment', cat:'sorrow', ref:'Joshua 1:5',
    verse:'There shall not any man be able to stand before thee all the days of thy life: as I was with Moses, so I will be with thee: I will not fail thee, nor forsake thee.',
    truth:'God’s presence with Joshua wasn’t a one-time gift for a special leader — the same promise not to fail or forsake belongs to me too.',
    prayer:'Lord, the same promise You gave Joshua, You give me. Thank You for not failing or forsaking me. Amen.' },
  { id:280, topic:'Abandonment', cat:'sorrow', ref:'Psalm 94:14',
    verse:'For the LORD will not cast off his people, neither will he forsake his inheritance.',
    truth:'I’m not just someone God happens to tolerate — I’m His inheritance, and He has committed not to cast that off.',
    prayer:'Father, thank You for calling me Your inheritance. Help me trust You will not cast me off. Amen.' },
  { id:281, topic:'Abandonment', cat:'sorrow', ref:'Isaiah 62:4',
    verse:'Thou shalt no more be termed Forsaken; neither shall thy land any more be termed Desolate: but thou shalt be called Hephzibah: for the LORD delighteth in thee.',
    truth:'God doesn’t just remove the label of forsaken — He replaces it with delight, an entirely different way of being seen.',
    prayer:'Lord, thank You for replacing ‘forsaken’ with delight over my life. Help me believe You delight in me. Amen.' },
  { id:79, topic:'Reconciliation', cat:'heart', ref:'2 Corinthians 5:18',
    verse:'And all things are of God, who hath reconciled us to himself by Jesus Christ, and hath given to us the ministry of reconciliation.',
    truth:'God didn\u2019t just forgive me from a distance \u2014 He gave me the actual work of bringing peace to others too.',
    prayer:'Lord, thank You for reconciling me to Yourself. Help me be a peacemaker in my relationships too. Amen.' },
  { id:198, topic:'Reconciliation', cat:'heart', ref:'Matthew 5:23-24',
    verse:'Therefore if thou bring thy gift to the altar, and there rememberest that thy brother hath ought against thee; Leave there thy gift before the altar, and go thy way; first be reconciled to thy brother, and then come and offer thy gift.',
    truth:'God cares more about my reconciled relationships than my religious performance — He’d rather I make peace first.',
    prayer:'Lord, show me any relationship I need to reconcile before I bring You my worship. Amen.' },
  { id:199, topic:'Reconciliation', cat:'heart', ref:'Romans 5:10',
    verse:'For if, when we were enemies, we were reconciled to God by the death of his Son, much more, being reconciled, we shall be saved by his life.',
    truth:'God reconciled with me while I was still His enemy — that’s the model for how far I’m meant to go to reconcile with others.',
    prayer:'Father, thank You for reconciling with me while I was still Your enemy. Help me extend that same grace to others. Amen.' },
  { id:200, topic:'Reconciliation', cat:'heart', ref:'Genesis 45:4-5',
    verse:'And Joseph said unto his brethren, Come near to me, I pray you. And they came near. And he said, I am Joseph your brother, whom ye sold into Egypt. Now therefore be not grieved, nor angry with yourselves, that ye sold me hither: for God did send me before you to preserve life.',
    truth:'Joseph could have used his power for revenge, but he chose reconciliation instead — seeing God’s hand even in what hurt him.',
    prayer:'Lord, help me choose reconciliation over revenge, and help me see Your hand even in what hurt me. Amen.' },
  { id:201, topic:'Reconciliation', cat:'heart', ref:'Colossians 1:20',
    verse:'And, having made peace through the blood of his cross, by him to reconcile all things unto himself; by him, I say, whether they be things in earth, or things in heaven.',
    truth:'The peace Christ made through the cross reaches further than I usually imagine — it’s the foundation for every reconciliation I attempt.',
    prayer:'Lord, let the peace You made through the cross be the foundation for the reconciliation I need in my own life. Amen.' },
  { id:80, topic:'Spiritual Dryness', cat:'mind', ref:'Psalm 42:1',
    verse:'As the hart panteth after the water brooks, so panteth my soul after thee, O God.',
    truth:'Feeling distant from God doesn\u2019t mean He\u2019s gone \u2014 it means my soul is thirsty for more of Him.',
    prayer:'Lord, my soul longs for You. Meet me in this dry season and draw me close again. Amen.' },
  { id:138, topic:'Spiritual Dryness', cat:'mind', ref:'John 7:37-38',
    verse:'In the last day, that great day of the feast, Jesus stood and cried, saying, If any man thirst, let him come unto me, and drink. He that believeth on me, as the scripture hath said, out of his belly shall flow rivers of living water.',
    truth:'Jesus doesn’t just meet my thirst — He turns me into a source of living water that overflows to others, even after a dry season.',
    prayer:'Jesus, I come to You thirsty. Fill me again and let living water flow out of this dry place. Amen.' },
  { id:139, topic:'Spiritual Dryness', cat:'mind', ref:'Isaiah 44:3',
    verse:'For I will pour water upon him that is thirsty, and floods upon the dry ground: I will pour my spirit upon thy seed, and my blessing upon thine offspring.',
    truth:'Dry ground isn’t a place God avoids — it’s exactly where He promises to pour out His Spirit.',
    prayer:'Lord, pour out Your Spirit on this dry ground in me. Turn my dryness into a place You water. Amen.' },
  { id:140, topic:'Spiritual Dryness', cat:'mind', ref:'Psalm 63:1',
    verse:'O God, thou art my God; early will I seek thee: my soul thirsteth for thee, my flesh longeth for thee in a dry and thirsty land, where no water is.',
    truth:'David named his spiritual dryness honestly and still kept seeking God in it — I can do the same instead of pretending I’m not dry.',
    prayer:'O God, my soul thirsts for You in this dry season. Early will I seek You, even when I don’t feel close to You. Amen.' },
  { id:141, topic:'Spiritual Dryness', cat:'mind', ref:'Jeremiah 17:7-8',
    verse:'Blessed is the man that trusteth in the LORD, and whose hope the LORD is. For he shall be as a tree planted by the waters, and that spreadeth out her roots by the river, and shall not see when heat cometh, but her leaf shall be green; and shall not be careful in the year of drought, neither shall cease from yielding fruit.',
    truth:'A tree planted by the river doesn’t stop being green just because a drought comes — my roots in God can keep me steady through a dry season too.',
    prayer:'Lord, plant my roots deep by Your living water so that even in a dry season, I don’t stop bearing fruit. Amen.' },
  { id:81, topic:'Waiting on God', cat:'purpose', ref:'Psalm 27:14',
    verse:'Wait on the LORD: be of good courage, and he shall strengthen thine heart: wait, I say, on the LORD.',
    truth:'Waiting isn\u2019t wasted time \u2014 it\u2019s where God strengthens my heart for what\u2019s next.',
    prayer:'Lord, help me wait on You with courage, not impatience. Strengthen my heart as I wait. Amen.' },
  { id:454, topic:'Waiting on God', cat:'purpose', ref:'Lamentations 3:25-26',
    verse:'The LORD is good unto them that wait for him, to the soul that seeketh him. It is good that a man should both hope and quietly wait for the salvation of the LORD.',
    truth:'Waiting quietly isn’t wasted time — scripture actually calls it good, a posture God honors, not something to rush past.',
    prayer:'Lord, help me wait quietly for You, trusting that this waiting itself is good. Amen.' },
  { id:455, topic:'Waiting on God', cat:'purpose', ref:'Psalm 130:5-6',
    verse:'I wait for the LORD, my soul doth wait, and in his word do I hope. My soul waiteth for the Lord more than they that watch for the morning.',
    truth:'Waiting for God can actually be an eager kind of hope, like watching for the sunrise, not just passive endurance.',
    prayer:'Lord, let me wait for You eagerly, like watching for the morning, not just enduring the wait. Amen.' },
  { id:456, topic:'Waiting on God', cat:'purpose', ref:'Micah 7:7',
    verse:'Therefore I will look unto the LORD; I will wait for the God of my salvation: my God will hear me.',
    truth:'Waiting isn’t the same as being ignored — I can wait with confidence that God actually hears me while I do.',
    prayer:'Lord, I look to You and wait for You, trusting You hear me even now. Amen.' },
  { id:457, topic:'Waiting on God', cat:'purpose', ref:'Psalm 40:1',
    verse:'I waited patiently for the LORD; and he inclined unto me, and heard my cry.',
    truth:'David’s patient waiting wasn’t met with silence — God actually leaned in and heard him, and He does the same for me.',
    prayer:'Lord, thank You for inclining toward me and hearing my cry, even in the waiting. Amen.' },
  { id:82, topic:'Complaining', cat:'heart', ref:'Philippians 2:14',
    verse:'Do all things without murmurings and disputings.',
    truth:'Complaining keeps my eyes on the problem \u2014 gratitude keeps my eyes on God.',
    prayer:'Lord, help me let go of complaining. Replace my grumbling with a grateful heart. Amen.' },
  { id:202, topic:'Complaining', cat:'heart', ref:'1 Corinthians 10:10',
    verse:'Neither murmur ye, as some of them also murmured, and were destroyed of the destroyer.',
    truth:'Complaining feels small in the moment, but scripture takes it seriously — it’s worth noticing instead of dismissing.',
    prayer:'Lord, help me take my complaining seriously instead of dismissing it as harmless. Amen.' },
  { id:203, topic:'Complaining', cat:'heart', ref:'Numbers 11:1',
    verse:'And when the people complained, it displeased the LORD: and the LORD heard it; and his anger was kindled.',
    truth:'Israel’s complaining in the wilderness wasn’t just venting — it revealed a heart that had stopped trusting God’s provision.',
    prayer:'Father, when I want to complain, show me if it’s really about a heart that’s stopped trusting Your provision. Amen.' },
  { id:204, topic:'Complaining', cat:'heart', ref:'Philippians 4:11-12',
    verse:'Not that I speak in respect of want: for I have learned, in whatsoever state I am, therewith to be content. I know both how to be abased, and I know how to abound: every where and in all things I am instructed both to be full and to be hungry, both to abound and to suffer need.',
    truth:'Contentment is something Paul learned, not something he was simply born with — I can learn it too, even in what tempts me to complain.',
    prayer:'Lord, teach me contentment the way You taught Paul, in whatever state I find myself. Amen.' },
  { id:205, topic:'Complaining', cat:'heart', ref:'James 5:9',
    verse:'Grudge not one against another, brethren, lest ye be condemned: behold, the judge standeth before the door.',
    truth:'The grudges and complaints I hold against other people carry more weight than I usually treat them with.',
    prayer:'Father, remove any grudge I’m holding against someone else. Help me let it go before it takes root. Amen.' },
  { id:83, topic:'Idolatry', cat:'faith', ref:'1 John 5:21',
    verse:'Little children, keep yourselves from idols. Amen.',
    truth:'Anything I put above God, even good things, quietly steals the place only He should hold.',
    prayer:'Lord, show me anything I\u2019ve placed above You. Help me keep my heart fully Yours. Amen.' },
  { id:354, topic:'Idolatry', cat:'faith', ref:'Exodus 20:3',
    verse:'Thou shalt have no other gods before me.',
    truth:'This isn’t just an ancient command about statues — anything I put ahead of God, even good things, can quietly become an idol.',
    prayer:'Lord, show me anything I’ve placed ahead of You. I want nothing before You. Amen.' },
  { id:355, topic:'Idolatry', cat:'faith', ref:'Colossians 3:5',
    verse:'Mortify therefore your members which are upon the earth; fornication, uncleanness, inordinate affection, evil concupiscence, and covetousness, which is idolatry.',
    truth:'Idolatry doesn’t always look like a statue — sometimes it looks like covetousness, wanting something so much it takes God’s place.',
    prayer:'Father, reveal any covetousness in me that has quietly become idolatry. Amen.' },
  { id:356, topic:'Idolatry', cat:'faith', ref:'Isaiah 44:9-10',
    verse:'They that make a graven image are all of them vanity; and their delectable things shall not profit. Who hath formed a god, or molten a graven image that is profitable for nothing?',

/* ============================================================
   STATE
   ============================================================ */
const state = {
  page: 'onboarding',
  onboarded: JSON.parse(localStorage.getItem('cd-onboarded') || 'false'),
  chosenTopics: JSON.parse(localStorage.getItem('cd-topics') || '[]'),
  homeTopicFilter: null,
  cardIndex: 0,
  flipped: false,
  savedIds: JSON.parse(localStorage.getItem('cd-saved') || '[]'),
  prayerLog: JSON.parse(localStorage.getItem('cd-prayerlog') || '[]'),
  theme: localStorage.getItem('cd-theme') || 'light',
  textSize: localStorage.getItem('cd-textsize') || 'base',
  browseQuery: '',
  browseCatFilter: 'all',
  onbPicks: JSON.parse(localStorage.getItem('cd-topics') || '[]'),
};
if(state.onboarded) state.page = 'home';

function persist(){
  localStorage.setItem('cd-onboarded', JSON.stringify(state.onboarded));
  localStorage.setItem('cd-topics', JSON.stringify(state.chosenTopics));
  localStorage.setItem('cd-saved', JSON.stringify(state.savedIds));
  localStorage.setItem('cd-prayerlog', JSON.stringify(state.prayerLog));
  localStorage.setItem('cd-theme', state.theme);
  localStorage.setItem('cd-textsize', state.textSize);
}

function applyTheme(){
  document.body.setAttribute('data-theme', state.theme);
  document.body.setAttribute('data-onboarded', String(state.onboarded));
  document.body.setAttribute('data-text', state.textSize);
}

/* ============================================================
   HELPERS
   ============================================================ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function catLabel(key){ const c = CATEGORIES.find(c=>c.key===key); return c ? c.label : key; }
function topicsForCat(catKey){ return [...new Set(CARDS.filter(c=>c.cat===catKey).map(c=>c.topic))]; }
function cardsForTopic(topic){ return CARDS.filter(c=>c.topic===topic); }
function allTopics(){ return [...new Set(CARDS.map(c=>c.topic))]; }
function topicCat(topic){ const c = CARDS.find(c=>c.topic===topic); return c ? c.cat : 'mind'; }
function currentCardPool(){
  if(state.homeTopicFilter) return cardsForTopic(state.homeTopicFilter);
  const pool = state.chosenTopics.length ? state.chosenTopics : allTopics();
  return CARDS.filter(c => pool.includes(c.topic));
}
function dayIndex(len){
  const d = new Date(); const seed = d.getFullYear()*1000 + Math.floor((d - new Date(d.getFullYear(),0,0)) / 86400000);
  return len ? seed % len : 0;
}

/* ============================================================
   RENDER: ONBOARDING
   ============================================================ */
function renderOnboarding(){
  const topics = allTopics();
  return `
  <div class="onb">
    <div>
      <p class="mark">Truth Over Every Thought</p>
      <h1>Pick a few places<br>to start.</h1>
      <p class="sub">Choose the topics on your mind right now. You can always add more later — every topic stays unlocked.</p>
    </div>
    <div class="onb-grid">
      ${topics.map(t => {
        const cat = topicCat(t);
        const checked = state.onbPicks.includes(t);
        return `<div class="onb-topic ${checked?'checked':''}" data-onb-topic="${esc(t)}">
          <span class="tn">${esc(t)}</span>
          <span class="tc cat-${cat}" style="color:var(--c-${cat});">${esc(catLabel(cat))}</span>
        </div>`;
      }).join('')}
    </div>
    <button class="onb-cta" id="onbCta" ${state.onbPicks.length?'':'disabled'}>Start with ${state.onbPicks.length} topic${state.onbPicks.length===1?'':'s'}</button>
    <button class="onb-skip" id="onbSkip">Skip — show me everything</button>
  </div>`;
}

/* ============================================================
   RENDER: HOME
   ============================================================ */
function renderHome(){
  const pool = currentCardPool();
  const idx = Math.min(state.cardIndex, Math.max(0, pool.length-1));
  const card = pool[idx];
  const cat = card ? card.cat : 'mind';
  const isSaved = card && state.savedIds.includes(card.id);
  const topicChips = (state.chosenTopics.length ? state.chosenTopics : allTopics().slice(0,10));
  return `
  <div class="topbar">
    <span class="brand">Truth Over Every Thought</span>
    <button class="icon-btn" id="goSettings" aria-label="Settings">${ICONS.settings}</button>
  </div>
  <div class="home-head">
    <h1>Today's Truth</h1>
    <p>${pool.length} card${pool.length===1?'':'s'} in view${state.homeTopicFilter ? ' · '+esc(state.homeTopicFilter) : ''}</p>
  </div>
  <div class="topic-pill-row">
    <button class="topic-pill ${!state.homeTopicFilter?'active':''}" data-home-topic="" style="${!state.homeTopicFilter?`background:var(--ink);`:''}">All</button>
    ${topicChips.map(t=>`<button class="topic-pill ${state.homeTopicFilter===t?'active':''}" data-home-topic="${esc(t)}" style="${state.homeTopicFilter===t?`background:var(--c-${topicCat(t)});`:''}">${esc(t)}</button>`).join('')}
  </div>
  <div class="card-wrap">
    <div class="card-stage">
      ${card ? renderCard(card, cat, isSaved) : `<div class="empty-state">${ICONS.book}<p>No cards match this filter yet.</p></div>`}
    </div>
    ${card ? `
    <div class="card-nav">
      <button id="prevCard" ${idx<=0?'disabled':''}>${ICONS.chevL}</button>
      <div class="card-dots">${pool.map((_,i)=>`<span class="${i===idx?'on':''}"></span>`).join('')}</div>
      <button id="nextCard" ${idx>=pool.length-1?'disabled':''}>${ICONS.chevR}</button>
    </div>` : ''}
  </div>`;
}

function renderCard(card, cat, isSaved){
  return `
  <div class="truth-card ${state.flipped?'is-prayer':''}" id="flipCard" style="border-top:3px solid var(--c-${cat});">
    <div class="truth-side">
      <p class="ref">${esc(card.ref)}</p>
      <p class="verse">${esc(card.verse)}</p>
      <div class="divider" style="background:var(--c-${cat});"></div>
      <p class="truth">${esc(card.truth)}</p>
    </div>
    <div class="prayer-side">
      <p class="side-label">Prayer</p>
      <p class="prayer">${esc(card.prayer)}</p>
    </div>
  </div>
  <div class="card-flip-hint" id="flipHint">${state.flipped?'Back to truth':'Turn to prayer'} ${ICONS.chevDown}</div>
  <div class="card-actions">
    <button id="saveCardBtn" class="${isSaved?'saved':''}" style="${isSaved?`background:var(--c-${cat});border-color:var(--c-${cat});`:''}">${ICONS.star} ${isSaved?'Saved':'Save'}</button>
    <button id="prayThisBtn">${ICONS.pray} Pray this</button>
  </div>`;
}

/* ============================================================
   RENDER: BROWSE
   ============================================================ */
function renderBrowse(){
  const q = state.browseQuery.trim().toLowerCase();
  let cats = CATEGORIES;
  if(state.browseCatFilter !== 'all') cats = cats.filter(c=>c.key===state.browseCatFilter);
  const sections = cats.map(cat=>{
    let topics = topicsForCat(cat.key);
    if(q) topics = topics.filter(t=>t.toLowerCase().includes(q));
    if(!topics.length) return '';
    return `
    <div class="cat-group-label cat-${cat.key}" style="color:var(--c-${cat.key});">${esc(cat.label)}</div>
    ${topics.map(t=>`
      <div class="topic-row" data-open-topic="${esc(t)}">
        <div class="tleft"><span class="tdot" style="background:var(--c-${cat.key});"></span><span class="tname">${esc(t)}</span></div>
        <span class="tcount">${cardsForTopic(t).length} cards</span>
      </div>`).join('')}`;
  }).join('');
  return `
  <div class="list-head"><h1>Browse</h1><p>All 92 topics, always unlocked</p></div>
  <div class="search-wrap">${ICONS.search}<input id="browseSearch" placeholder="Search topics…" value="${esc(state.browseQuery)}"></div>
  <div class="cat-filter-row">
    <button class="cat-chip ${state.browseCatFilter==='all'?'active':''}" data-cat-filter="all" style="${state.browseCatFilter==='all'?'background:var(--ink);':''}">All</button>
    ${CATEGORIES.map(c=>`<button class="cat-chip ${state.browseCatFilter===c.key?'active':''}" data-cat-filter="${c.key}" style="${state.browseCatFilter===c.key?`background:var(--c-${c.key});`:''}">${esc(c.label)}</button>`).join('')}
  </div>
  ${sections || `<div class="empty-state">${ICONS.search}<p>No topics match "${esc(state.browseQuery)}".</p></div>`}`;
}

/* ============================================================
   RENDER: SAVED
   ============================================================ */
function renderSaved(){
  const cards = CARDS.filter(c=>state.savedIds.includes(c.id));
  return `
  <div class="list-head"><h1>Saved</h1><p>${cards.length} card${cards.length===1?'':'s'}</p></div>
  ${cards.length ? cards.map(c=>`
    <div class="entry-row" style="border-left:3px solid var(--c-${c.cat});">
      <div class="eref">${esc(c.ref)} · ${esc(c.topic)}</div>
      <p class="etruth">${esc(c.truth)}</p>
      <div class="erow-actions"><button data-open-card="${c.id}">Open</button><button data-unsave="${c.id}">Remove</button></div>
    </div>`).join('') : `<div class="empty-state">${ICONS.star}<p>Nothing saved yet — tap Save on any card.</p></div>`}`;
}

/* ============================================================
   RENDER: PRAYER LOG
   ============================================================ */
function renderPrayer(){
  const log = state.prayerLog;
  return `
  <div class="list-head"><h1>Prayer Log</h1><p>${log.length} prayer${log.length===1?'':'s'} added</p></div>
  ${log.length ? log.slice().reverse().map(entry=>{
    const c = CARDS.find(c=>c.id===entry.cardId) || {};
    return `<div class="entry-row" style="border-left:3px solid var(--c-${c.cat||'mind'});">
      <div class="eref">${esc(entry.date)} · ${esc(entry.topic)}</div>
      <p class="eprayer">${esc(entry.prayer)}</p>
      <div class="erow-actions"><button data-remove-prayer="${entry.entryId}">Remove</button></div>
    </div>`;
  }).join('') : `<div class="empty-state">${ICONS.pray}<p>Tap "Pray this" on a card to start your log.</p></div>`}`;
}

/* ============================================================
   RENDER: SETTINGS
   ============================================================ */
function renderSettings(){
  return `
  <div class="list-head"><h1>Settings</h1><p>Claude Design — comparison build</p></div>
  <div class="settings-section">
    <h3>Appearance</h3>
    <div class="seg-row" style="margin-bottom:12px;">
      <button data-theme-set="light" class="${state.theme==='light'?'active':''}">Light</button>
      <button data-theme-set="dark" class="${state.theme==='dark'?'active':''}">Dark</button>
    </div>
    <div class="seg-row">
      <button data-text-set="base" class="${state.textSize==='base'?'active':''}">A</button>
      <button data-text-set="lg" class="${state.textSize==='lg'?'active':''}">A+</button>
      <button data-text-set="xl" class="${state.textSize==='xl'?'active':''}">A++</button>
    </div>
  </div>
  <div class="settings-section">
    <h3>Category colors</h3>
    <div class="cat-swatch-grid">
      ${CATEGORIES.map(c=>`<div class="cat-swatch"><span class="dot" style="background:var(--c-${c.key});"></span>${esc(c.label)}</div>`).join('')}
    </div>
  </div>
  <div class="settings-section">
    <h3>Your topics</h3>
    <p style="font-size:13px; color:var(--ink-dim); margin:0 0 10px;">${state.chosenTopics.length ? state.chosenTopics.length+' selected on Home' : 'Showing all 92 topics on Home'}</p>
    <button class="onb-skip" id="editTopicsBtn" style="padding:0;">Edit selection →</button>
  </div>
  <div class="settings-section">
    <h3>Not in this build yet</h3>
    <p class="roadmap-item">Sharing &amp; invite flow</p>
    <p class="roadmap-item">Apple Watch companion screen</p>
    <p class="roadmap-item">PIN / pattern app lock</p>
    <p class="roadmap-item">Scheduled reminders</p>
    <p class="roadmap-item">Background art styles (Neo Deco, Splash Truth, Street Truth, Photos)</p>
  </div>`;
}

/* ============================================================
   ICONS (inline, stroke=currentColor)
   ============================================================ */
const ICONS = {
  home: '<svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M9.5 20v-6h5v6"/></svg>',
  browse: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="14" height="16" rx="2.5"/><path d="M7 9.5h7M7 13h7M7 16.5h4"/></svg>',
  saved: '<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-3.6L6 21Z"/></svg>',
  prayer: '<svg viewBox="0 0 24 24"><path d="M3 16c3.5-1.4 6.5-.8 9 1.8 2.5-2.6 5.5-3.2 9-1.8V21c-3.5-1.2-6.5-.5-9 2-2.5-2.5-5.5-3.2-9-2Z"/><path d="M12 17.3V4"/></svg>',
  settings: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2"/></svg>',
  star: '<svg viewBox="0 0 24 24"><path d="m12 3 2.6 5.9 6.4.6-4.8 4.3 1.4 6.3L12 17l-5.6 3.1 1.4-6.3-4.8-4.3 6.4-.6Z"/></svg>',
  pray: '<svg viewBox="0 0 24 24"><path d="M12 21c-4-3-8-6-8-11a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 5-4 8-8 11Z"/></svg>',
  chevL: '<svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg>',
  chevR: '<svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg>',
  chevDown: '<svg viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></svg>',
  search: '<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.3-4.3"/></svg>',
  book: '<svg viewBox="0 0 24 24"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H12v20H6.5A2.5 2.5 0 0 1 4 19.5Z"/><path d="M20 4.5A2.5 2.5 0 0 0 17.5 2H12v20h5.5a2.5 2.5 0 0 0 2.5-2.5Z"/></svg>',
};

/* ============================================================
   TAB BAR
   ============================================================ */
function renderTabbar(){
  const tabs = [
    {key:'home', label:'Home', icon:ICONS.home},
    {key:'browse', label:'Browse', icon:ICONS.browse},
    {key:'saved', label:'Saved', icon:ICONS.saved},
    {key:'prayer', label:'Prayer', icon:ICONS.prayer},
    {key:'settings', label:'Settings', icon:ICONS.settings},
  ];
  return `<nav class="tabbar"><div class="tabbar-inner">
    ${tabs.map(t=>`<button class="tab ${state.page===t.key?'active':''}" data-goto="${t.key}">${t.icon}<span>${t.label}</span></button>`).join('')}
  </div></nav>`;
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render(){
  applyTheme();
  const $app = document.getElementById('app');
  if(!state.onboarded){
    $app.innerHTML = renderOnboarding();
    bindOnboarding();
    return;
  }
  let html = '';
  if(state.page === 'home') html = renderHome();
  else if(state.page === 'browse') html = renderBrowse();
  else if(state.page === 'saved') html = renderSaved();
  else if(state.page === 'prayer') html = renderPrayer();
  else if(state.page === 'settings') html = renderSettings();
  $app.innerHTML = html + renderTabbar();
  bindApp();
  persist();
}

/* ============================================================
   BINDINGS
   ============================================================ */
function bindOnboarding(){
  document.querySelectorAll('[data-onb-topic]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const t = el.dataset.onbTopic;
      const i = state.onbPicks.indexOf(t);
      if(i>-1) state.onbPicks.splice(i,1); else state.onbPicks.push(t);
      render();
    });
  });
  const cta = document.getElementById('onbCta');
  if(cta) cta.addEventListener('click', ()=>{
    state.chosenTopics = state.onbPicks.slice();
    state.onboarded = true; state.page='home';
    render();
  });
  const skip = document.getElementById('onbSkip');
  if(skip) skip.addEventListener('click', ()=>{
    state.chosenTopics = []; state.onboarded = true; state.page='home';
    render();
  });
}

function bindApp(){
  document.querySelectorAll('[data-goto]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.page = el.dataset.goto; state.flipped=false; render(); });
  });

  const goSettings = document.getElementById('goSettings');
  if(goSettings) goSettings.addEventListener('click', ()=>{ state.page='settings'; render(); });

  document.querySelectorAll('[data-home-topic]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.homeTopicFilter = el.dataset.homeTopic || null;
      state.cardIndex = 0; state.flipped = false; render();
    });
  });

  const flipCard = document.getElementById('flipCard');
  const flipHint = document.getElementById('flipHint');
  const doFlip = ()=>{ state.flipped = !state.flipped; render(); };
  if(flipCard) flipCard.addEventListener('click', doFlip);
  if(flipHint) flipHint.addEventListener('click', doFlip);

  const prevBtn = document.getElementById('prevCard');
  const nextBtn = document.getElementById('nextCard');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ if(state.cardIndex>0){ state.cardIndex--; state.flipped=false; render(); } });
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ const pool=currentCardPool(); if(state.cardIndex<pool.length-1){ state.cardIndex++; state.flipped=false; render(); } });

  const saveBtn = document.getElementById('saveCardBtn');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{
    const pool = currentCardPool(); const card = pool[state.cardIndex];
    if(!card) return;
    const i = state.savedIds.indexOf(card.id);
    if(i>-1) state.savedIds.splice(i,1); else state.savedIds.push(card.id);
    render();
  });

  const prayBtn = document.getElementById('prayThisBtn');
  if(prayBtn) prayBtn.addEventListener('click', ()=>{
    const pool = currentCardPool(); const card = pool[state.cardIndex];
    if(!card) return;
    state.prayerLog.push({ entryId: Date.now(), cardId:card.id, topic:card.topic, prayer:card.prayer, date:new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'}) });
    render();
  });

  const browseSearch = document.getElementById('browseSearch');
  if(browseSearch){
    browseSearch.addEventListener('input', ()=>{ state.browseQuery = browseSearch.value; render(); browseSearch.focus(); browseSearch.setSelectionRange(browseSearch.value.length, browseSearch.value.length); });
  }
  document.querySelectorAll('[data-cat-filter]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.browseCatFilter = el.dataset.catFilter; render(); });
  });
  document.querySelectorAll('[data-open-topic]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.homeTopicFilter = el.dataset.openTopic; state.cardIndex = 0; state.flipped=false;
      state.page = 'home'; render();
    });
  });

  document.querySelectorAll('[data-open-card]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = Number(el.dataset.openCard);
      const card = CARDS.find(c=>c.id===id);
      if(!card) return;
      state.homeTopicFilter = card.topic;
      state.cardIndex = cardsForTopic(card.topic).findIndex(c=>c.id===id);
      state.flipped=false; state.page='home'; render();
    });
  });
  document.querySelectorAll('[data-unsave]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); const id=Number(el.dataset.unsave); state.savedIds = state.savedIds.filter(x=>x!==id); render(); });
  });
  document.querySelectorAll('[data-remove-prayer]').forEach(el=>{
    el.addEventListener('click', ()=>{ const id=Number(el.dataset.removePrayer); state.prayerLog = state.prayerLog.filter(x=>x.entryId!==id); render(); });
  });

  const themeBtns = document.querySelectorAll('[data-theme-set]');
  themeBtns.forEach(el=> el.addEventListener('click', ()=>{ state.theme = el.dataset.themeSet; render(); }));
  const textBtns = document.querySelectorAll('[data-text-set]');
  textBtns.forEach(el=> el.addEventListener('click', ()=>{ state.textSize = el.dataset.textSet; render(); }));

  const editTopicsBtn = document.getElementById('editTopicsBtn');
  if(editTopicsBtn) editTopicsBtn.addEventListener('click', ()=>{
    state.onboarded = false; state.onbPicks = state.chosenTopics.slice(); render();
  });
}

/* ============================================================
   BOOT
   ============================================================ */
if(state.homeTopicFilter === undefined) state.homeTopicFilter = null;
state.cardIndex = dayIndex(currentCardPool().length || 1);
render();
</script>
</body>
</html>
