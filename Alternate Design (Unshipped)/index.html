<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Truth Cards">
<meta name="theme-color" content="#F6F1E7">
<title>Truth Over Every Thought — Claude Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,500;1,9..144,600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CLAUDE DESIGN — design tokens
   Warm "paper" light / deep "ink" dark. Typography-led, no photos.
   ============================================================ */
:root{
  --serif:'Fraunces',Georgia,serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;

  /* paper (light) */
  --bg:#F6F1E7; --bg-2:#EFE8D8;
  --surface:#FFFDF7; --surface-line:rgba(30,26,20,0.10);
  --ink:#211C15; --ink-dim:rgba(33,28,21,0.62); --ink-faint:rgba(33,28,21,0.38);
  --shadow-c: rgba(60,45,20,0.14);

  /* category accents */
  --c-mind:#5B7FBF; --c-heart:#D46A6A; --c-worth:#9B72CF; --c-sorrow:#4A7A8C;
  --c-faith:#C79A3E; --c-joy:#4FA876; --c-purpose:#D98A4A;

  --radius-lg:28px; --radius-md:18px; --radius-sm:12px;
  --ease: cubic-bezier(.22,.9,.32,1);
}
body[data-theme="dark"]{
  --bg:#15171C; --bg-2:#1B1E24;
  --surface:#1E2128; --surface-line:rgba(255,255,255,0.08);
  --ink:#F1EEE6; --ink-dim:rgba(241,238,230,0.66); --ink-faint:rgba(241,238,230,0.4);
  --shadow-c: rgba(0,0,0,0.45);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  min-height:100vh; min-height:100dvh; overflow-x:hidden;
  transition: background .3s var(--ease), color .3s var(--ease);
}
body[data-text="lg"]{ font-size:1.06em; }
body[data-text="xl"]{ font-size:1.16em; }
button{ font-family:inherit; }
.app{ max-width:480px; margin:0 auto; min-height:100vh; min-height:100dvh; padding:0 0 96px; position:relative; }

/* ---------- Topbar ---------- */
.topbar{ display:flex; align-items:center; justify-content:space-between; padding:22px 22px 6px; }
.topbar .brand{ font-family:var(--serif); font-weight:600; font-size:14px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-dim); }
.icon-btn{ width:38px; height:38px; border-radius:50%; border:1px solid var(--surface-line); background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); }
.icon-btn svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

/* ---------- Category chip / tag ---------- */
.cat-tag{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:5px 12px 5px 9px; border-radius:999px; }
.cat-tag .dot{ width:7px; height:7px; border-radius:50%; }
.cat-mind{ color:var(--c-mind); background:color-mix(in srgb, var(--c-mind) 14%, transparent); } .cat-mind .dot{ background:var(--c-mind); }
.cat-heart{ color:var(--c-heart); background:color-mix(in srgb, var(--c-heart) 14%, transparent); } .cat-heart .dot{ background:var(--c-heart); }
.cat-worth{ color:var(--c-worth); background:color-mix(in srgb, var(--c-worth) 14%, transparent); } .cat-worth .dot{ background:var(--c-worth); }
.cat-sorrow{ color:var(--c-sorrow); background:color-mix(in srgb, var(--c-sorrow) 14%, transparent); } .cat-sorrow .dot{ background:var(--c-sorrow); }
.cat-faith{ color:var(--c-faith); background:color-mix(in srgb, var(--c-faith) 14%, transparent); } .cat-faith .dot{ background:var(--c-faith); }
.cat-joy{ color:var(--c-joy); background:color-mix(in srgb, var(--c-joy) 14%, transparent); } .cat-joy .dot{ background:var(--c-joy); }
.cat-purpose{ color:var(--c-purpose); background:color-mix(in srgb, var(--c-purpose) 14%, transparent); } .cat-purpose .dot{ background:var(--c-purpose); }

/* ---------- Card (home) ---------- */
.card-wrap{ padding:10px 22px 4px; }
.card-stage{ position:relative; min-height:440px; }
.truth-card{
  position:relative; background:var(--surface); border:1px solid var(--surface-line);
  border-radius:var(--radius-lg); padding:34px 26px 26px; text-align:center;
  box-shadow: 0 18px 40px -14px var(--shadow-c);
  transition: transform .45s var(--ease), opacity .45s var(--ease);
}
.truth-card .ref{ font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 14px; }
.truth-card .verse{ font-family:var(--serif); font-style:italic; font-size:15.5px; line-height:1.55; color:var(--ink-dim); margin:0 0 22px; }
.truth-card .divider{ width:36px; height:2px; border-radius:2px; margin:0 auto 22px; }
.truth-card .truth{ font-family:var(--serif); font-weight:600; font-size:26px; line-height:1.32; margin:0; }
.truth-card .prayer{ font-family:var(--serif); font-size:17px; line-height:1.6; margin:0; }
.truth-card .side-label{ font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint); margin:0 0 16px; }
.truth-card.is-prayer .truth{ display:none; }
.truth-card:not(.is-prayer) .prayer-side{ display:none; }
.card-flip-hint{ display:flex; align-items:center; justify-content:center; gap:6px; margin:16px 0 0; font-size:12px; font-weight:600; color:var(--ink-faint); cursor:pointer; }
.card-flip-hint svg{ width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2.4; transition:transform .3s var(--ease); }
.truth-card.is-prayer + .card-flip-hint svg{ transform:rotate(180deg); }
.card-actions{ display:flex; align-items:center; justify-content:center; gap:14px; margin-top:18px; }
.card-actions button{ border:1px solid var(--surface-line); background:var(--surface); border-radius:999px; padding:10px 18px; font-size:13px; font-weight:700; color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:7px; }
.card-actions button svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2.3; }
.card-actions button.saved{ color:#fff; }
.card-nav{ display:flex; align-items:center; justify-content:space-between; padding:14px 4px 0; }
.card-nav button{ background:none; border:none; color:var(--ink-faint); cursor:pointer; padding:8px; }
.card-nav button svg{ width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:2.4; }
.card-nav button:disabled{ opacity:.25; cursor:default; }
.card-dots{ display:flex; gap:5px; }
.card-dots span{ width:5px; height:5px; border-radius:50%; background:var(--ink-faint); opacity:.4; }
.card-dots span.on{ opacity:1; }

/* ---------- Home header ---------- */
.home-head{ padding:2px 22px 8px; }
.home-head h1{ font-family:var(--serif); font-weight:700; font-size:26px; margin:2px 0 4px; }
.home-head p{ margin:0; color:var(--ink-dim); font-size:14px; }
.topic-pill-row{ display:flex; gap:8px; overflow-x:auto; padding:14px 22px 2px; scrollbar-width:none; }
.topic-pill-row::-webkit-scrollbar{ display:none; }
.topic-pill{ flex-shrink:0; border:1px solid var(--surface-line); background:var(--surface); border-radius:999px; padding:9px 16px; font-size:13px; font-weight:700; color:var(--ink-dim); cursor:pointer; white-space:nowrap; }
.topic-pill.active{ color:#fff; border-color:transparent; }

/* ---------- Browse ---------- */
.search-wrap{ padding:6px 22px 10px; position:relative; }
.search-wrap input{ width:100%; padding:13px 16px 13px 42px; border-radius:14px; border:1px solid var(--surface-line); background:var(--surface); color:var(--ink); font-size:15px; }
.search-wrap input::placeholder{ color:var(--ink-faint); }
.search-wrap svg{ position:absolute; left:38px; top:50%; transform:translateY(-50%); width:16px; height:16px; stroke:var(--ink-faint); fill:none; stroke-width:2.3; }
.cat-filter-row{ display:flex; gap:8px; overflow-x:auto; padding:0 22px 14px; scrollbar-width:none; }
.cat-filter-row::-webkit-scrollbar{ display:none; }
.cat-chip{ flex-shrink:0; border:none; border-radius:999px; padding:8px 15px; font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap; background:var(--surface); border:1px solid var(--surface-line); color:var(--ink-dim); }
.cat-chip.active{ color:#fff; border-color:transparent; }
.cat-group-label{ padding:18px 22px 6px; font-size:11.5px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); }
.topic-row{ display:flex; align-items:center; justify-content:space-between; margin:0 16px 8px; padding:14px 16px; border-radius:16px; background:var(--surface); border:1px solid var(--surface-line); cursor:pointer; }
.topic-row .tname{ font-family:var(--serif); font-weight:600; font-size:16.5px; }
.topic-row .tcount{ font-size:11.5px; color:var(--ink-faint); font-weight:700; }
.topic-row .tleft{ display:flex; align-items:center; gap:11px; }
.topic-row .tdot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.empty-state{ text-align:center; padding:60px 30px; color:var(--ink-faint); }
.empty-state svg{ width:34px; height:34px; stroke:currentColor; fill:none; stroke-width:1.6; margin-bottom:12px; }

/* ---------- Lists (saved / prayer) ---------- */
.list-head{ padding:20px 22px 6px; }
.list-head h1{ font-family:var(--serif); font-weight:700; font-size:24px; margin:0 0 4px; }
.list-head p{ margin:0; color:var(--ink-dim); font-size:13.5px; }
.entry-row{ margin:0 16px 10px; padding:16px 18px; border-radius:16px; background:var(--surface); border:1px solid var(--surface-line); }
.entry-row .eref{ font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px; }
.entry-row .etruth{ font-family:var(--serif); font-weight:600; font-size:16.5px; line-height:1.4; margin:0 0 6px; }
.entry-row .eprayer{ font-size:13.5px; color:var(--ink-dim); line-height:1.5; margin:0; }
.entry-row .erow-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:10px; }
.entry-row .erow-actions button{ background:none; border:none; color:var(--ink-faint); font-size:12px; font-weight:700; cursor:pointer; }

/* ---------- Settings ---------- */
.settings-section{ margin:0 16px 20px; padding:18px; border-radius:18px; background:var(--surface); border:1px solid var(--surface-line); }
.settings-section h3{ margin:0 0 14px; font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); }
.seg-row{ display:flex; gap:8px; }
.seg-row button{ flex:1; padding:11px 8px; border-radius:12px; border:1px solid var(--surface-line); background:var(--bg); color:var(--ink-dim); font-weight:700; font-size:13px; cursor:pointer; }
.seg-row button.active{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.cat-swatch-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
.cat-swatch{ display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:10px; background:var(--bg); font-size:12.5px; font-weight:700; }
.cat-swatch span.dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.roadmap-item{ font-size:13px; color:var(--ink-dim); line-height:1.5; margin:0 0 6px; padding-left:14px; position:relative; }
.roadmap-item::before{ content:"—"; position:absolute; left:0; color:var(--ink-faint); }

/* ---------- Onboarding ---------- */
.onb{ padding:60px 26px 40px; text-align:center; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
.onb .mark{ font-family:var(--serif); font-weight:600; font-size:13px; letter-spacing:.3em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:10px; }
.onb h1{ font-family:var(--serif); font-weight:700; font-size:34px; line-height:1.15; margin:0 0 12px; }
.onb p.sub{ color:var(--ink-dim); font-size:15px; line-height:1.5; margin:0 0 30px; }
.onb-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; text-align:left; flex:1; overflow-y:auto; margin-bottom:20px; }
.onb-topic{ padding:13px 14px; border-radius:14px; border:1.5px solid var(--surface-line); background:var(--surface); cursor:pointer; }
.onb-topic .tn{ font-family:var(--serif); font-weight:600; font-size:14.5px; display:block; margin-bottom:3px; }
.onb-topic .tc{ font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
.onb-topic.checked{ border-color:var(--ink); }
.onb-cta{ background:var(--ink); color:var(--bg); border:none; border-radius:16px; padding:17px; font-size:16px; font-weight:800; cursor:pointer; }
.onb-cta:disabled{ opacity:.4; }
.onb-skip{ margin-top:12px; background:none; border:none; color:var(--ink-faint); font-weight:700; font-size:13px; cursor:pointer; }

/* ---------- Tab bar ---------- */
.tabbar{ position:fixed; bottom:0; left:0; right:0; z-index:40; display:flex; justify-content:center; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
.tabbar-inner{ width:100%; max-width:460px; background:var(--surface); border:1px solid var(--surface-line); border-radius:26px; display:flex; padding:6px; box-shadow:0 12px 30px -12px var(--shadow-c); }
.tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:9px 2px 8px; background:none; border:none; border-radius:20px; cursor:pointer; color:var(--ink-faint); }
.tab svg{ width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:2.1; }
.tab span{ font-size:10px; font-weight:700; }
.tab.active{ background:var(--ink); color:var(--bg); }
body[data-onboarded="false"] .tabbar{ display:none; }

@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body data-theme="light" data-onboarded="false" data-text="base">
<div class="app" id="app"></div>
<script>
const CATEGORIES = [
  { key:'mind',    label:'Mind Battles' },
  { key:'heart',   label:'Heart Check' },
  { key:'worth',   label:'Identity & Worth' },
  { key:'sorrow',  label:'Deep Sorrow' },
  { key:'faith',   label:'Faith & Character' },
  { key:'joy',     label:'Joy & Peace' },
  { key:'purpose', label:'Purpose & Promise' },
];

const CARDS = [
  { free:true, id:1, topic:'Fear', cat:'mind', ref:'2 Timothy 1:7',
    verse:'For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind.',
    truth:'God has not given me a spirit of fear — He has given me power, love, and a sound mind.',
    prayer:'Lord, when fear tries to take over my thoughts, remind me that You have not given me a spirit of fear. Fill me with Your power, love, and a sound mind. Amen.' },
  { id:98, topic:'Fear', cat:'mind', ref:'Psalm 27:1',
    verse:'The LORD is my light and my salvation; whom shall I fear? the LORD is the strength of my life; of whom shall I be afraid?',
    truth:'Fear loses its power when I remember who’s standing beside me — the LORD is my light, so I don’t have to face the dark alone.',
    prayer:'Lord, You are my light and my salvation. When fear rises, remind me there is nothing left to be afraid of with You as my strength. Amen.' },
  { id:99, topic:'Fear', cat:'mind', ref:'Isaiah 41:10',
    verse:'Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee; yea, I will uphold thee with the right hand of my righteousness.',
    truth:'I’m never facing my fears alone — God promises to strengthen, help, and hold me up Himself.',
    prayer:'Father, thank You for promising to be with me. Strengthen me, help me, and hold me up when fear tries to take hold. Amen.' },
  { id:100, topic:'Fear', cat:'mind', ref:'Psalm 56:3',
    verse:'What time I am afraid, I will trust in thee.',
    truth:'Fear and trust can exist in the same moment — I don’t have to wait to feel brave before I choose to trust God.',
    prayer:'Lord, when fear comes, teach me to trust You right in the middle of it, not just after it passes. Amen.' },
  { id:101, topic:'Fear', cat:'mind', ref:'1 John 4:18',
    verse:'There is no fear in love; but perfect love casteth out fear: because fear hath torment. He that feareth is not made perfect in love.',
    truth:'The love God has for me is strong enough to push fear out — I don’t have to manage my fear alone, I can let His love drive it out.',
    prayer:'Father, let Your perfect love fill the places where fear has taken root, and drive out anything that torments me. Amen.' },
  { free:true, id:2, topic:'Anxiety', cat:'mind', ref:'Philippians 4:6-7',
    verse:'Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God.',
    truth:'I do not have to carry anxiety alone — I can bring every request to God with thanksgiving.',
    prayer:'Lord, I hand You what I am carrying today. Guard my heart and mind with Your peace. Amen.' },
  { id:102, topic:'Anxiety', cat:'mind', ref:'Matthew 6:27',
    verse:'Which of you by taking thought can add one cubit unto his stature?',
    truth:'All my anxious worrying has never actually added a single thing to my life — it’s time to hand it over instead of holding onto it.',
    prayer:'Lord, show me how pointless my worrying really is, and teach me to trade it for trust in You. Amen.' },
  { id:103, topic:'Anxiety', cat:'mind', ref:'1 Peter 5:7',
    verse:'Casting all your care upon him; for he careth for you.',
    truth:'I don’t have to carry my anxiety alone — God actually wants me to hand it to Him because He cares about what I’m carrying.',
    prayer:'Father, I’m casting my cares on You today. Thank You for caring about what weighs on me. Amen.' },
  { id:104, topic:'Anxiety', cat:'mind', ref:'Psalm 94:19',
    verse:'In the multitude of my thoughts within me thy comforts delight my soul.',
    truth:'Even when my mind is racing with anxious thoughts, God’s comfort can still reach me in the middle of it.',
    prayer:'Lord, when my thoughts multiply and anxiety grows loud, let Your comfort be louder still. Amen.' },
  { id:105, topic:'Anxiety', cat:'mind', ref:'Philippians 4:19',
    verse:'But my God shall supply all your need according to his riches in glory by Christ Jesus.',
    truth:'A lot of my anxiety comes from fearing I won’t have enough — but God has already promised to supply what I need.',
    prayer:'Father, calm my fear of not having enough. Help me trust that You will supply exactly what I need. Amen.' },
  { id:3, topic:'Worry', cat:'mind', ref:'Matthew 6:34',
    verse:'Take therefore no thought for the morrow: for the morrow shall take thought for the things of itself. Sufficient unto the day is the evil thereof.',
    truth:'God gives grace for today — I do not have to carry tomorrow before it arrives.',
    prayer:'Father, help me stay faithful today and trust You with tomorrow. Amen.' },
  { id:106, topic:'Worry', cat:'mind', ref:'Psalm 37:5',
    verse:'Commit thy way unto the LORD; trust also in him; and he shall bring it to pass.',
    truth:'Worry tries to convince me I have to make everything happen myself — but I can commit my way to God and trust Him to bring it to pass.',
    prayer:'Lord, I commit my way to You today. Where I’ve been worrying and striving, help me trust You to bring it to pass. Amen.' },
  { id:107, topic:'Worry', cat:'mind', ref:'Matthew 6:25',
    verse:'Therefore I say unto you, Take no thought for your life, what ye shall eat, or what ye shall drink; nor yet for your body, what ye shall put on. Is not the life more than meat, and the body than raiment?',
    truth:'Worry fixates on things that won’t outlast me — my life is worth more to God than the things I keep worrying over.',
    prayer:'Father, refocus my heart today. Help me stop fixating on things that won’t last and trust You with what matters most. Amen.' },
  { id:108, topic:'Worry', cat:'mind', ref:'Proverbs 12:25',
    verse:'Heaviness in the heart of man maketh it stoop: but a good word maketh it glad.',
    truth:'Worry weighs my heart down, but a good word — God’s word — can lift it right back up.',
    prayer:'Lord, when worry weighs on my heart, speak Your good word over me and lift what’s heavy. Amen.' },
  { id:109, topic:'Worry', cat:'mind', ref:'John 14:1',
    verse:'Let not your heart be troubled: ye believe in God, believe also in me.',
    truth:'Jesus doesn’t just tell me not to worry — He gives me somewhere to place my trust instead: Himself.',
    prayer:'Lord Jesus, keep my heart from being troubled. Help me believe in You in the middle of what worries me. Amen.' },
  { id:4, topic:'Confusion', cat:'mind', ref:'1 Corinthians 14:33',
    verse:'For God is not the author of confusion, but of peace, as in all churches of the saints.',
    truth:'God is not the author of confusion — where He leads, there is peace and clarity.',
    prayer:'Lord, when my mind feels scattered, bring Your peace and help me hear Your voice above the noise. Amen.' },
  { id:110, topic:'Confusion', cat:'mind', ref:'Isaiah 30:21',
    verse:'And thine ears shall hear a word behind thee, saying, This is the way, walk ye in it, when ye turn to the right hand, and when ye turn to the left.',
    truth:'When I don’t know which way to go, God promises to speak clearly enough that I’ll hear His voice showing me the way.',
    prayer:'Lord, in my confusion, let me hear Your voice clearly showing me which way to walk. Amen.' },
  { id:111, topic:'Confusion', cat:'mind', ref:'Psalm 25:4-5',
    verse:'Shew me thy ways, O LORD; teach me thy paths. Lead me in thy truth, and teach me: for thou art the God of my salvation; on thee do I wait all the day.',
    truth:'I don’t have to figure everything out myself — I can ask God to show me His ways when my own thinking gets tangled.',
    prayer:'Father, show me Your ways and teach me Your paths. I’m waiting on You to lead me through this confusion. Amen.' },
  { id:112, topic:'Confusion', cat:'mind', ref:'Proverbs 16:9',
    verse:'A man’s heart deviseth his way: but the LORD directeth his steps.',
    truth:'I can make my plans, but it’s God who actually directs my steps — that takes the pressure off having to have it all figured out.',
    prayer:'Lord, I release the pressure of having it all figured out. Direct my steps even when my own plans feel unclear. Amen.' },
  { id:113, topic:'Confusion', cat:'mind', ref:'1 Corinthians 1:25',
    verse:'Because the foolishness of God is wiser than men; and the weakness of God is stronger than men.',
    truth:'Even when my own understanding runs out, God’s wisdom never does — I can lean on Him instead of my own reasoning.',
    prayer:'Father, when my own understanding fails me, remind me Your wisdom never runs out. Amen.' },
  { id:5, topic:'Doubt', cat:'mind', ref:'James 1:6',
    verse:'But let him ask in faith, nothing wavering. For he that wavereth is like a wave of the sea driven with the wind and tossed.',
    truth:'Doubt does not disqualify me — I ask God to steady my faith when I waver.',
    prayer:'Lord, I believe; help my unbelief. Steady my heart when doubt rises. Amen.' },
  { id:114, topic:'Doubt', cat:'mind', ref:'Mark 9:24',
    verse:'And straightway the father of the child cried out, and said with tears, Lord, I believe; help thou mine unbelief.',
    truth:'I don’t have to have perfect faith before I come to God — I can bring my doubt honestly and ask Him to help me believe.',
    prayer:'Lord, I believe — help my unbelief. Meet me honestly in the middle of my doubt. Amen.' },
  { id:115, topic:'Doubt', cat:'mind', ref:'Matthew 14:31',
    verse:'And immediately Jesus stretched forth his hand, and caught him, and said unto him, O thou of little faith, wherefore didst thou doubt?',
    truth:'Even when Peter doubted and started to sink, Jesus was right there to catch him — doubt doesn’t put me out of God’s reach.',
    prayer:'Jesus, when I start to sink in doubt, reach out and catch me the way You caught Peter. Amen.' },
  { id:116, topic:'Doubt', cat:'mind', ref:'John 20:27',
    verse:'Then saith he to Thomas, Reach hither thy finger, and behold my hands; and reach hither thy hand, and thrust it into my side: and be not faithless, but believing.',
    truth:'Jesus didn’t shame Thomas for doubting — He met him with proof and patience, and He’ll meet me the same way.',
    prayer:'Lord, meet me in my doubt the way You met Thomas — with patience, not shame. Help me move from doubting to believing. Amen.' },
  { id:117, topic:'Doubt', cat:'mind', ref:'Romans 4:20-21',
    verse:'He staggered not at the promise of God through unbelief; but was strong in faith, giving glory to God; And being fully persuaded that, what he had promised, he was able to perform.',
    truth:'Abraham’s faith grew strong not because doubt never came, but because he kept choosing to believe God was able to keep His word.',
    prayer:'Father, grow my faith like Abraham’s. Help me stay fully persuaded that what You’ve promised, You are able to perform. Amen.' },

  { free:true, id:6, topic:'Anger', cat:'heart', ref:'Ephesians 4:26',
    verse:'Be ye angry, and sin not: let not the sun go down upon your wrath.',
    truth:'I can feel anger without letting it rule me — I choose to release it quickly.',
    prayer:'Father, when anger rises in me, help me pause before I react and let it go before it takes root. Amen.' },
  { id:154, topic:'Anger', cat:'heart', ref:'James 1:19-20',
    verse:'Wherefore, my beloved brethren, let every man be swift to hear, slow to speak, slow to wrath: For the wrath of man worketh not the righteousness of God.',
    truth:'Anger that moves fast rarely leads anywhere good — being slow to speak and slow to wrath protects me from wrath’s damage.',
    prayer:'Lord, make me swift to hear and slow to anger. Keep my wrath from working against Your righteousness in me. Amen.' },
  { id:155, topic:'Anger', cat:'heart', ref:'Proverbs 15:1',
    verse:'A soft answer turneth away wrath: but grievous words stir up anger.',
    truth:'The words I choose can either fuel a fire or put it out — a soft answer has more power than I usually give it credit for.',
    prayer:'Father, give me a soft answer instead of grievous words when anger rises around me. Amen.' },
  { id:156, topic:'Anger', cat:'heart', ref:'Ecclesiastes 7:9',
    verse:'Be not hasty in thy spirit to be angry: for anger resteth in the bosom of fools.',
    truth:'Letting anger settle in and make a home in me isn’t wisdom — it’s something I’m called to release, not nurse.',
    prayer:'Lord, don’t let anger rest and settle in my heart. Help me release it instead of holding on. Amen.' },
  { id:157, topic:'Anger', cat:'heart', ref:'Colossians 3:8',
    verse:'But now ye also put off all these; anger, wrath, malice, blasphemy, filthy communication out of your mouth.',
    truth:'Anger isn’t something I have to keep wearing — I can actually put it off like a garment that no longer fits who I am in Christ.',
    prayer:'Father, help me put off anger and wrath today, and put on who You’ve made me to be instead. Amen.' },
  { id:7, topic:'Bitterness', cat:'heart', ref:'Hebrews 12:15',
    verse:'Looking diligently lest any man fail of the grace of God; lest any root of bitterness springing up trouble you.',
    truth:'I choose to let go of bitterness before it takes root in my heart.',
    prayer:'Father, search my heart for any root of bitterness. Help me release it and receive Your grace instead. Amen.' },
  { id:158, topic:'Bitterness', cat:'heart', ref:'Ephesians 4:31-32',
    verse:'Let all bitterness, and wrath, and anger, and clamour, and evil speaking, be put away from you, with all malice: And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ’s sake hath forgiven you.',
    truth:'Bitterness and kindness can’t both stay in my heart — letting go of one makes room for the other.',
    prayer:'Lord, help me put away bitterness and put on kindness, forgiving others the way You’ve forgiven me. Amen.' },
  { id:159, topic:'Bitterness', cat:'heart', ref:'Acts 8:23',
    verse:'For I perceive that thou art in the gall of bitterness, and in the bond of iniquity.',
    truth:'Bitterness isn’t just an emotion — left unchecked it can become a bond that holds me captive, and I need God to break it.',
    prayer:'Father, break any bond of bitterness that has taken hold of me. Set me free from it. Amen.' },
  { id:160, topic:'Bitterness', cat:'heart', ref:'Romans 12:19',
    verse:'Dearly beloved, avenge not yourselves, but rather give place unto wrath: for it is written, Vengeance is mine; I will repay, saith the Lord.',
    truth:'A lot of my bitterness comes from wanting to settle the score myself — but I can let God carry what isn’t mine to repay.',
    prayer:'Lord, help me let go of the score I’ve been keeping. Vengeance is Yours, not mine to carry. Amen.' },
  { id:161, topic:'Bitterness', cat:'heart', ref:'Psalm 73:21-22',
    verse:'Thus my heart was grieved, and I was pricked in my reins. So foolish was I, and ignorant: I was as a beast before thee.',
    truth:'Asaph admitted his bitterness made him foolish and blind — naming it honestly was the first step out of it.',
    prayer:'Lord, show me where bitterness has made me foolish or blind. Help me see clearly again. Amen.' },
  { id:8, topic:'Pride', cat:'heart', ref:'Proverbs 16:18',
    verse:'Pride goeth before destruction, and an haughty spirit before a fall.',
    truth:'Humility protects me — I do not have to prove myself or hold onto pride.',
    prayer:'Lord, keep me humble. Teach me to depend on You rather than my own understanding. Amen.' },
  { id:162, topic:'Pride', cat:'heart', ref:'James 4:6',
    verse:'But he giveth more grace. Wherefore he saith, God resisteth the proud, but giveth grace unto the humble.',
    truth:'Pride actually works against me with God, while humility opens up more of His grace — humility is the better trade.',
    prayer:'Lord, humble my heart. I would rather have Your grace than hold onto my pride. Amen.' },
  { id:163, topic:'Pride', cat:'heart', ref:'Proverbs 11:2',
    verse:'When pride cometh, then cometh shame: but with the lowly is wisdom.',
    truth:'Pride and shame travel together more often than I’d like to admit — but wisdom is found with the lowly instead.',
    prayer:'Father, keep me from the pride that leads to shame. Teach me the wisdom that comes with a lowly heart. Amen.' },
  { id:164, topic:'Pride', cat:'heart', ref:'Philippians 2:3',
    verse:'Let nothing be done through strife or vainglory; but in lowliness of mind let each esteem other better than themselves.',
    truth:'Pride keeps score of who’s better — but I’m called to esteem others above myself, not above them.',
    prayer:'Lord, help me esteem others better than myself today, instead of competing for the higher place. Amen.' },
  { id:165, topic:'Pride', cat:'heart', ref:'Micah 6:8',
    verse:'He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?',
    truth:'God doesn’t ask for a grand performance from me — just justice, mercy, and a humble walk with Him.',
    prayer:'Lord, teach me to walk humbly with You today, letting go of what pride wants me to prove. Amen.' },
  { id:9, topic:'Comparison', cat:'heart', ref:'Galatians 6:4',
    verse:'But let every man prove his own work, and then shall he have rejoicing in himself alone, and not in another.',
    truth:'My worth is not measured against someone else\u2019s life — God gave me my own path to walk.',
    prayer:'Lord, free me from comparing myself to others. Help me be faithful with what You have given me. Amen.' },
  { id:166, topic:'Comparison', cat:'heart', ref:'2 Corinthians 10:12',
    verse:'For we dare not make ourselves of the number, or compare ourselves with some that commend themselves: but they measuring themselves by themselves, and comparing themselves among themselves, are not wise.',
    truth:'Measuring myself against other people was never a wise way to know who I am — God never asked me to play that game.',
    prayer:'Lord, keep me from measuring myself against others. Help me find my worth in You instead. Amen.' },
  { id:167, topic:'Comparison', cat:'heart', ref:'1 Samuel 16:7',
    verse:'But the LORD said unto Samuel, Look not on his countenance, or on the height of his stature; because I have refused him: for the LORD seeth not as man seeth; for man looketh on the outward appearance, but the LORD looketh on the heart.',
    truth:'What other people see and measure isn’t what God is looking at — He sees my heart, not the comparisons I make on the outside.',
    prayer:'Lord, thank You for looking at my heart, not the outward comparisons I get caught up in. Amen.' },
  { id:168, topic:'Comparison', cat:'heart', ref:'Jeremiah 1:5',
    verse:'Before I formed thee in the belly I knew thee; and before thou camest forth out of the womb I sanctified thee, and I ordained thee a prophet unto the nations.',
    truth:'God knew and set me apart before I ever had the chance to compare myself to anyone else — my place was never up for competition.',
    prayer:'Father, thank You for knowing and setting me apart before I could compare myself to anyone. Amen.' },
  { id:169, topic:'Comparison', cat:'heart', ref:'Romans 12:6',
    verse:'Having then gifts differing according to the grace that is given to us, whether prophecy, let us prophesy according to the proportion of faith.',
    truth:'The gifts God gave me are different from what He gave someone else on purpose — comparing them misses the point of why they were given.',
    prayer:'Lord, help me use the gifts You gave me instead of comparing them to someone else’s. Amen.' },

  { free:true, id:10, topic:'Guilt', cat:'worth', ref:'Romans 8:1',
    verse:'There is therefore now no condemnation to them which are in Christ Jesus.',
    truth:'I am not condemned — in Christ, my guilt has already been fully paid for.',
    prayer:'Jesus, thank You for taking my guilt at the cross. Help me stop carrying what You already carried. Amen.' },
  { id:214, topic:'Guilt', cat:'worth', ref:'Psalm 103:12',
    verse:'As far as the east is from the west, so far hath he removed our transgressions from us.',
    truth:'God doesn’t just forgive my guilt nearby — He removes it as far as east is from west, a distance that never meets.',
    prayer:'Lord, thank You for removing my sin as far as the east is from the west. Help me stop carrying what You’ve already taken away. Amen.' },
  { id:215, topic:'Guilt', cat:'worth', ref:'1 John 1:9',
    verse:'If we confess our sins, he is faithful and just to forgive us our sins, and to cleanse us from all unrighteousness.',
    truth:'Confession isn’t about earning forgiveness — it’s simply agreeing with what God is already faithful and ready to do.',
    prayer:'Father, I confess what’s weighing on me. Thank You for being faithful and just to forgive and cleanse me. Amen.' },
  { id:216, topic:'Guilt', cat:'worth', ref:'Micah 7:19',
    verse:'He will turn again, he will have compassion upon us; he will subdue our iniquities; and thou wilt cast all their sins into the depths of the sea.',
    truth:'God doesn’t just forgive my guilt — He casts it into the depths, gone and not meant to be dredged back up.',
    prayer:'Lord, thank You for casting my sins into the depths of the sea. Help me leave them there instead of fishing them back out. Amen.' },
  { id:217, topic:'Guilt', cat:'worth', ref:'Romans 8:33-34',
    verse:'Who shall lay any thing to the charge of God’s elect? It is God that justifieth. Who is he that condemneth? It is Christ that died, yea rather, that is risen again, who is even at the right hand of God, who also maketh intercession for us.',
    truth:'No accusation against me can actually stick when the one who justifies me is God Himself, and Christ is interceding on my behalf.',
    prayer:'Lord, thank You that no accusation can stand against me while Christ Himself intercedes for me. Amen.' },
  { id:11, topic:'Shame', cat:'worth', ref:'Romans 10:11',
    verse:'For the scripture saith, Whosoever believeth on him shall not be ashamed.',
    truth:'My past does not get the final word — in Christ, shame has no claim on me.',
    prayer:'Lord, You see all of me and You still call me Yours. Lift the shame I have been carrying. Amen.' },
  { id:218, topic:'Shame', cat:'worth', ref:'Isaiah 54:4',
    verse:'Fear not; for thou shalt not be ashamed: neither be thou confounded; for thou shalt not be put to shame: for thou shalt forget the shame of thy youth.',
    truth:'God doesn’t just cover my shame — He promises a day when I’ll actually forget it, not just manage it.',
    prayer:'Lord, help me trust Your promise that I won’t be put to shame. Heal even the shame of my past. Amen.' },
  { id:219, topic:'Shame', cat:'worth', ref:'Psalm 34:5',
    verse:'They looked unto him, and were lightened: and their faces were not ashamed.',
    truth:'Looking to God does something physical to shame — it lightens what was heavy and lifts what was hidden.',
    prayer:'Lord, I look to You today. Lighten what shame has weighed down in me. Amen.' },
  { id:220, topic:'Shame', cat:'worth', ref:'Hebrews 12:2',
    verse:'Looking unto Jesus the author and finisher of our faith; who for the joy that was set before him endured the cross, despising the shame, and is set down at the right hand of the throne of God.',
    truth:'Jesus endured shame Himself and despised it, not because it didn’t hurt but because He knew joy was on the other side of it.',
    prayer:'Jesus, thank You for enduring shame for me. Help me see the joy set before me the way You did. Amen.' },
  { id:221, topic:'Shame', cat:'worth', ref:'2 Timothy 1:12',
    verse:'For the which cause I also suffer these things: nevertheless I am not ashamed: for I know whom I have believed, and am persuaded that he is able to keep that which I have committed unto him against that day.',
    truth:'Not being ashamed isn’t about having nothing to be ashamed of — it’s about knowing the One I’ve trusted is able to keep me.',
    prayer:'Lord, help me say with confidence that I know whom I have believed, and that You are able to keep me. Amen.' },
  { id:12, topic:'Identity', cat:'worth', ref:'2 Corinthians 5:17',
    verse:'Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new.',
    truth:'In Christ I am a new creation — my past does not define who I am now.',
    prayer:'Father, thank You for making me new in Christ. Help me live like the old things have truly passed away. Amen.' },
  { id:222, topic:'Identity', cat:'worth', ref:'Galatians 2:20',
    verse:'I am crucified with Christ: nevertheless I live; yet not I, but Christ liveth in me: and the life which I now live in the flesh I live by the faith of the Son of God, who loved me, and gave himself for me.',
    truth:'My identity isn’t something I have to build from scratch — it’s Christ living in me, and that changes everything about who I am.',
    prayer:'Lord, thank You for living in me. Let my life reflect who You are, not just who I try to be. Amen.' },
  { id:223, topic:'Identity', cat:'worth', ref:'Ephesians 1:5',
    verse:'Having predestinated us unto the adoption of children by Jesus Christ to himself, according to the good pleasure of his will.',
    truth:'I’m not just tolerated by God — I’m adopted, chosen on purpose, according to what pleased Him.',
    prayer:'Father, thank You for adopting me as Your child. Help me live like someone who is truly wanted. Amen.' },
  { id:224, topic:'Identity', cat:'worth', ref:'John 1:12',
    verse:'But as many as received him, to them gave he power to become the sons of God, even to them that believe on his name.',
    truth:'Believing in Jesus doesn’t just change what I do — it changes who I actually am, a child of God with real standing.',
    prayer:'Lord, thank You for the power to become Your child. Let that truth shape how I see myself today. Amen.' },
  { id:225, topic:'Identity', cat:'worth', ref:'Colossians 3:3',
    verse:'For ye are dead, and your life is hid with Christ in God.',
    truth:'My real identity is hidden safely with Christ — nothing that happens to me on the surface can actually touch what’s hidden there.',
    prayer:'Father, thank You that my life is hidden safely with Christ. Let that security settle my identity today. Amen.' },

  { free:true, id:13, topic:'Loneliness', cat:'sorrow', ref:'Deuteronomy 31:6',
    verse:'For the LORD thy God, he it is that doth go with thee; he will not fail thee, nor forsake thee.',
    truth:'I am never alone — God Himself goes with me and stays with me.',
    prayer:'Father, in the moments I feel forgotten, remind me You are near. Be close to me today. Amen.' },
  { id:250, topic:'Loneliness', cat:'sorrow', ref:'Psalm 68:6',
    verse:'God setteth the solitary in families: he bringeth out those which are bound with chains: but the rebellious dwell in a dry land.',
    truth:'God specializes in placing the lonely into belonging — loneliness isn’t the end of my story, it’s something He actively works to change.',
    prayer:'Lord, You set the solitary in families. Bring me into the belonging I long for. Amen.' },
  { id:251, topic:'Loneliness', cat:'sorrow', ref:'Matthew 28:20',
    verse:'Teaching them to observe all things whatsoever I have commanded you: and, lo, I am with you always, even unto the end of the world. Amen.',
    truth:'Jesus’ promise to be with me always doesn’t come with an expiration date — even my loneliest moments are not moments without Him.',
    prayer:'Jesus, thank You for promising to be with me always. Remind me I am never truly alone. Amen.' },
  { id:252, topic:'Loneliness', cat:'sorrow', ref:'Psalm 25:16',
    verse:'Turn thee unto me, and have mercy upon me; for I am desolate and afflicted.',
    truth:'David brought his loneliness honestly to God instead of hiding it — I can do the same instead of pretending I’m fine.',
    prayer:'Lord, turn to me and have mercy. I bring You my loneliness honestly today. Amen.' },
  { id:253, topic:'Loneliness', cat:'sorrow', ref:'Hebrews 13:5',
    verse:'Let your conversation be without covetousness; and be content with such things as ye have: for he hath said, I will never leave thee, nor forsake thee.',
    truth:'God’s promise not to leave or forsake me is a direct answer to the fear loneliness feeds — He is the one presence that never walks away.',
    prayer:'Father, thank You for promising never to leave or forsake me. Be near in this lonely season. Amen.' },
  { id:14, topic:'Grief', cat:'sorrow', ref:'Psalm 34:18',
    verse:'The LORD is nigh unto them that are of a broken heart; and saveth such as be of a contrite spirit.',
    truth:'God is close to me in my grief — He has not left me to carry it alone.',
    prayer:'Lord, be near to me in this sorrow. Comfort my broken heart and remind me I am not alone. Amen.' },
  { id:254, topic:'Grief', cat:'sorrow', ref:'Matthew 5:4',
    verse:'Blessed are they that mourn: for they shall be comforted.',
    truth:'Grief isn’t a sign my faith is failing — Jesus called mourning itself a blessed place, because comfort meets me right there.',
    prayer:'Lord, thank You for calling those who mourn blessed. Meet me with Your comfort in this grief. Amen.' },
  { id:255, topic:'Grief', cat:'sorrow', ref:'John 11:35',
    verse:'Jesus wept.',
    truth:'Jesus wept at a grave even knowing He was about to raise Lazarus — grief and faith were never meant to cancel each other out.',
    prayer:'Jesus, thank You for weeping with those You love. Weep with me in my grief today. Amen.' },
  { id:256, topic:'Grief', cat:'sorrow', ref:'2 Corinthians 1:3-4',
    verse:'Blessed be God, even the Father of our Lord Jesus Christ, the Father of mercies, and the God of all comfort; Who comforteth us in all our tribulation, that we may be able to comfort them which are in any trouble, by the comfort wherewith we ourselves are comforted of God.',
    truth:'The comfort I receive in grief isn’t just for me — God intends to use it later to help someone else who is grieving too.',
    prayer:'Father, comfort me in my grief, and let that comfort become something I can one day offer to someone else. Amen.' },
  { id:257, topic:'Grief', cat:'sorrow', ref:'Revelation 21:4',
    verse:'And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away.',
    truth:'This grief, as real as it is, is not the final chapter — there is a day coming when God Himself wipes every tear away.',
    prayer:'Lord, thank You for the promise that You will wipe away every tear. Help me hold onto that hope in my grief. Amen.' },
  { id:15, topic:'Hopelessness', cat:'sorrow', ref:'Jeremiah 29:11',
    verse:'For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.',
    truth:'God has a future for me — my story is not over, even when it feels hopeless.',
    prayer:'Father, when I cannot see a way forward, remind me You have plans for my good. Renew my hope today. Amen.' },
  { id:258, topic:'Hopelessness', cat:'sorrow', ref:'Psalm 42:5',
    verse:'Why art thou cast down, O my soul? and why art thou disquieted in me? hope thou in God: for I shall yet praise him for the help of his countenance.',
    truth:'The psalmist talked to his own soul about hope instead of just letting his feelings have the final word — I can do the same.',
    prayer:'Lord, when my soul feels cast down, help me speak hope to myself the way the psalmist did. Amen.' },
  { id:259, topic:'Hopelessness', cat:'sorrow', ref:'Romans 5:3-5',
    verse:'And not only so, but we glory in tribulations also: knowing that tribulation worketh patience; And patience, experience; and experience, hope: And hope maketh not ashamed; because the love of God is shed abroad in our hearts by the Holy Ghost which is given unto us.',
    truth:'Even the hardest seasons are not wasted — God can actually use tribulation to grow the very hope that feels so far away right now.',
    prayer:'Father, grow hope in me even through this hard season. Let it not be wasted. Amen.' },
  { id:260, topic:'Hopelessness', cat:'sorrow', ref:'Psalm 71:14',
    verse:'But I will hope continually, and will yet praise thee more and more.',
    truth:'Hope doesn’t have to be a one-time decision — it’s something I can choose to return to continually, even after it slips.',
    prayer:'Lord, help me hope continually, even when hope feels hard to hold onto. Amen.' },
  { id:261, topic:'Hopelessness', cat:'sorrow', ref:'Job 14:7',
    verse:'For there is hope of a tree, if it be cut down, that it will sprout again, and that the tender branch thereof will not cease.',
    truth:'Even something that looks completely cut down can still sprout again — hopelessness doesn’t get the final say over what looks dead.',
    prayer:'Lord, where things in my life feel cut down, let them sprout again. Restore hope where I’ve given up. Amen.' },

  { free:true, id:16, topic:'Faith', cat:'faith', ref:'Hebrews 11:1',
    verse:'Now faith is the substance of things hoped for, the evidence of things not seen.',
    truth:'My faith is not wishful thinking — it is confident trust in a God who keeps His word.',
    prayer:'Lord, grow my faith today. Help me trust what You have promised even when I cannot yet see it. Amen.' },
  { id:286, topic:'Faith', cat:'faith', ref:'2 Corinthians 5:7',
    verse:'For we walk by faith, not by sight.',
    truth:'Faith means I don’t have to wait until I can see the outcome before I take the next step forward.',
    prayer:'Lord, help me walk by faith, not by sight, especially in what I can’t yet see resolved. Amen.' },
  { id:287, topic:'Faith', cat:'faith', ref:'Mark 11:22-24',
    verse:'And Jesus answering saith unto them, Have faith in God. What things soever ye desire, when ye pray, believe that ye receive them, and ye shall have them.',
    truth:'Jesus ties prayer directly to faith — believing isn’t separate from asking, it’s part of how I ask.',
    prayer:'Lord, grow my faith as I pray. Help me believe, not just ask. Amen.' },
  { id:288, topic:'Faith', cat:'faith', ref:'Romans 1:17',
    verse:'For therein is the righteousness of God revealed from faith to faith: as it is written, The just shall live by faith.',
    truth:'Faith isn’t a one-time entry point into God’s family — it’s meant to be the ongoing way I live, from faith to faith.',
    prayer:'Father, let faith be the way I live continually, not just how I started. Amen.' },
  { id:289, topic:'Faith', cat:'faith', ref:'1 Peter 1:8-9',
    verse:'Whom having not seen, ye love; in whom, though now ye see him not, yet believing, ye rejoice with joy unspeakable and full of glory: Receiving the end of your faith, even the salvation of your souls.',
    truth:'Loving and believing in someone I haven’t seen isn’t a lesser kind of faith — it’s exactly the kind scripture calls full of glory.',
    prayer:'Lord, though I have not seen You, I believe and love You. Fill me with joy unspeakable in that faith. Amen.' },
  { id:17, topic:'Courage', cat:'faith', ref:'Joshua 1:9',
    verse:'Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.',
    truth:'I can be strong and courageous, because God goes with me wherever I go.',
    prayer:'Lord, give me courage today. Remind me that You are with me, so I do not need to fear. Amen.' },
  { id:290, topic:'Courage', cat:'faith', ref:'1 Corinthians 16:13',
    verse:'Watch ye, stand fast in the faith, quit you like men, be strong.',
    truth:'Courage isn’t the absence of fear — it’s standing fast and staying strong even while everything in me wants to waver.',
    prayer:'Lord, help me stand fast in faith and be strong, even when courage doesn’t come naturally. Amen.' },
  { id:291, topic:'Courage', cat:'faith', ref:'Acts 4:13',
    verse:'Now when they saw the boldness of Peter and John, and perceived that they were unlearned and ignorant men, they marvelled; and they took knowledge of them, that they had been with Jesus.',
    truth:'Peter and John’s boldness didn’t come from their training or credentials — it came from having spent time with Jesus.',
    prayer:'Lord, let my courage come from time spent with You, not from my own qualifications. Amen.' },
  { id:292, topic:'Courage', cat:'faith', ref:'1 Chronicles 28:20',
    verse:'Be strong and of good courage, and do it: fear not, nor be dismayed: for the LORD God, even my God, will be with thee; he will not fail thee, nor forsake thee.',
    truth:'Courage doesn’t mean doing it alone — it means moving forward knowing God is with me the whole way through.',
    prayer:'Lord, be with me as I move forward in courage. Thank You for promising not to fail or forsake me. Amen.' },
  { id:293, topic:'Courage', cat:'faith', ref:'Esther 4:16',
    verse:'So will I go in unto the king, which is not according to the law: and if I perish, I perish.',
    truth:'Esther’s courage wasn’t the absence of real risk — she chose to act anyway, trusting God with the outcome she couldn’t control.',
    prayer:'Lord, give me the kind of courage Esther had — to act even when the outcome is uncertain, trusting You with it. Amen.' },
  { id:18, topic:'Forgiveness', cat:'faith', ref:'Colossians 3:13',
    verse:'Forbearing one another, and forgiving one another, if any man have a quarrel against any: even as Christ forgave you, so also do ye.',
    truth:'I forgive because Christ first forgave me — not because the hurt did not matter.',
    prayer:'Lord, help me forgive as You have forgiven me. Free my heart from what I am holding onto. Amen.' },
  { id:294, topic:'Forgiveness', cat:'faith', ref:'Matthew 6:14-15',
    verse:'For if ye forgive men their trespasses, your heavenly Father will also forgive you: But if ye forgive not men their trespasses, neither will your Father forgive your trespasses.',
    truth:'Forgiving others isn’t optional decoration on my faith — Jesus ties it directly to how I experience being forgiven myself.',
    prayer:'Lord, help me forgive others the way I need and want to be forgiven. Amen.' },
  { id:295, topic:'Forgiveness', cat:'faith', ref:'Matthew 18:21-22',
    verse:'Then came Peter to him, and said, Lord, how oft shall my brother sin against me, and I forgive him? till seven times? Jesus saith unto him, I say not unto thee, Until seven times: but, Until seventy times seven.',
    truth:'Jesus didn’t put a practical cap on forgiveness — He made it clear this isn’t about counting, it’s about a posture I keep choosing.',
    prayer:'Lord, help me keep choosing forgiveness, not counting how many times I’ve already given it. Amen.' },
  { id:296, topic:'Forgiveness', cat:'faith', ref:'Luke 23:34',
    verse:'Then said Jesus, Father, forgive them; for they know not what they do.',
    truth:'Jesus forgave the very people crucifying Him, before they even asked — that’s the depth of forgiveness I’m being invited into.',
    prayer:'Jesus, help me forgive the way You did on the cross — even before it’s asked for. Amen.' },
  { id:297, topic:'Forgiveness', cat:'faith', ref:'Mark 11:25',
    verse:'And when ye stand praying, forgive, if ye have ought against any: that your Father also which is in heaven may forgive you your trespasses.',
    truth:'Forgiveness and prayer are connected here — unforgiveness can actually get in the way of my own relationship with God.',
    prayer:'Father, show me anyone I need to forgive before I come to You in prayer. Amen.' },

  { free:true, id:19, topic:'Peace', cat:'joy', ref:'John 14:27',
    verse:'Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid.',
    truth:'The peace Christ gives is not fragile like the world\u2019s — it holds steady no matter what I face.',
    prayer:'Jesus, thank You for a peace only You can give. Quiet my troubled heart today. Amen.' },
  { id:366, topic:'Peace', cat:'joy', ref:'Colossians 3:15',
    verse:'And let the peace of God rule in your hearts, to the which also ye are called in one body; and be ye thankful.',
    truth:'Peace isn’t just a feeling I wait for — it’s something I can actively let rule and referee my heart.',
    prayer:'Lord, let Your peace rule in my heart today, deciding what gets to stay and what needs to go. Amen.' },
  { id:367, topic:'Peace', cat:'joy', ref:'Numbers 6:24-26',
    verse:'The LORD bless thee, and keep thee: The LORD make his face shine upon thee, and be gracious unto thee: The LORD lift up his countenance upon thee, and give thee peace.',
    truth:'This blessing was spoken over God’s people intentionally — peace isn’t an accident, it’s something God means to give.',
    prayer:'Lord, lift up Your countenance upon me and give me Your peace today. Amen.' },
  { id:368, topic:'Peace', cat:'joy', ref:'Isaiah 9:6',
    verse:'For unto us a child is born, unto us a son is given: and the government shall be upon his shoulder: and his name shall be called Wonderful, Counsellor, The mighty God, The everlasting Father, The Prince of Peace.',
    truth:'Peace isn’t just something Jesus gives — it’s literally part of His name and character, woven into who He is.',
    prayer:'Prince of Peace, let Your very name settle what’s unsettled in me today. Amen.' },
  { id:369, topic:'Peace', cat:'joy', ref:'Psalm 4:8',
    verse:'I will both lay me down in peace, and sleep: for thou, LORD, only makest me dwell in safety.',
    truth:'Real peace shows up in ordinary places — like being able to actually rest at night because I trust who’s keeping watch.',
    prayer:'Lord, help me lay down in peace tonight, trusting You alone to keep me safe. Amen.' },
  { id:20, topic:'Gratitude', cat:'joy', ref:'1 Thessalonians 5:18',
    verse:'In every thing give thanks: for this is the will of God in Christ Jesus concerning you.',
    truth:'Gratitude is not pretending everything is fine — it is choosing to thank God in the middle of it.',
    prayer:'Father, teach me to give thanks in every season, not just the easy ones. Amen.' },
  { id:370, topic:'Gratitude', cat:'joy', ref:'Psalm 100:4',
    verse:'Enter into his gates with thanksgiving, and into his courts with praise: be thankful unto him, and bless his name.',
    truth:'Gratitude isn’t just a feeling I have at the end — it’s actually the way I’m invited to enter into God’s presence in the first place.',
    prayer:'Lord, I enter Your gates with thanksgiving today. Help gratitude be my starting point, not an afterthought. Amen.' },
  { id:371, topic:'Gratitude', cat:'joy', ref:'Colossians 3:17',
    verse:'And whatsoever ye do in word or deed, do all in the name of the Lord Jesus, giving thanks to God and the Father by him.',
    truth:'Gratitude isn’t reserved for the big obvious blessings — it’s meant to color everything I say and do, even the ordinary parts.',
    prayer:'Father, help me give thanks in whatever I say or do today, not just in the highlights. Amen.' },
  { id:372, topic:'Gratitude', cat:'joy', ref:'Psalm 107:1',
    verse:'O give thanks unto the LORD, for he is good: for his mercy endureth for ever.',
    truth:'My gratitude doesn’t depend on my circumstances changing — it can rest on who God is, which never changes.',
    prayer:'Lord, I give thanks for who You are, not just for what’s going well. Your mercy endures forever. Amen.' },
  { id:373, topic:'Gratitude', cat:'joy', ref:'Ephesians 5:20',
    verse:'Giving thanks always for all things unto God and the Father in the name of our Lord Jesus Christ.',
    truth:'Giving thanks for all things is a high bar — but it’s a practice, not a feeling I have to fake, and it changes how I see my circumstances.',
    prayer:'Father, teach me to give thanks in all things, trusting You even in what I don’t yet understand. Amen.' },

  { free:true, id:21, topic:'Hope', cat:'purpose', ref:'Romans 15:13',
    verse:'Now the God of hope fill you with all joy and peace in believing, that ye may abound in hope, through the power of the Holy Ghost.',
    truth:'God is the source of my hope — He can fill me with joy and peace even now.',
    prayer:'Lord, fill me with hope today. Let Your joy and peace overflow in me by Your Spirit. Amen.' },
  { id:402, topic:'Hope', cat:'purpose', ref:'Hebrews 6:19',
    verse:'Which hope we have as an anchor of the soul, both sure and stedfast.',
    truth:'Hope isn’t a vague wish — it’s described as an anchor, something sure and steady enough to hold me in place.',
    prayer:'Lord, let hope be an anchor for my soul, steady even when everything around me moves. Amen.' },
  { id:403, topic:'Hope', cat:'purpose', ref:'Psalm 39:7',
    verse:'And now, Lord, what wait I for? my hope is in thee.',
    truth:'When I run out of other things to wait for or place my hope in, God remains the one place hope actually holds.',
    prayer:'Lord, my hope is in You. When everything else fails, let You be enough. Amen.' },
  { id:404, topic:'Hope', cat:'purpose', ref:'Titus 2:13',
    verse:'Looking for that blessed hope, and the glorious appearing of the great God and our Saviour Jesus Christ.',
    truth:'My hope isn’t only for this life — it reaches forward to something eternal, which changes how heavy today’s troubles feel.',
    prayer:'Lord, help me look for the blessed hope ahead, letting it lighten what I carry today. Amen.' },
  { id:405, topic:'Hope', cat:'purpose', ref:'Lamentations 3:24',
    verse:'The LORD is my portion, saith my soul; therefore will I hope in him.',
    truth:'Hope isn’t separate from who God is to me — because He is my portion, hoping in Him is the natural response.',
    prayer:'Lord, You are my portion. Because of that, I will hope in You. Amen.' },
  { id:22, topic:'Purpose', cat:'purpose', ref:'Ephesians 2:10',
    verse:'For we are his workmanship, created in Christ Jesus unto good works, which God hath before ordained that we should walk in them.',
    truth:'I am not an accident — God made me on purpose, for a purpose.',
    prayer:'Lord, show me the good works You have prepared for me. Help me walk in the purpose You have given me. Amen.' },
  { id:406, topic:'Purpose', cat:'purpose', ref:'Romans 8:28',
    verse:'And we know that all things work together for good to them that love God, to them who are the called according to his purpose.',
    truth:'Even the parts of my story that don’t make sense yet are being worked into a purpose bigger than what I can see right now.',
    prayer:'Lord, thank You that all things work together for good according to Your purpose. Help me trust that even now. Amen.' },
  { id:407, topic:'Purpose', cat:'purpose', ref:'Esther 4:14',
    verse:'And who knoweth whether thou art come to the kingdom for such a time as this?',
    truth:'The specific place and season I’m in isn’t random — it might be exactly the moment I was positioned for.',
    prayer:'Lord, show me the purpose in this specific time and place You’ve put me in. Amen.' },
  { id:408, topic:'Purpose', cat:'purpose', ref:'2 Timothy 1:9',
    verse:'Who hath saved us, and called us with an holy calling, not according to our works, but according to his own purpose and grace.',
    truth:'My calling wasn’t earned by my performance — it was given according to God’s own purpose and grace, settled before I did anything.',
    prayer:'Father, thank You for calling me according to Your purpose and grace, not my performance. Amen.' },
  { id:409, topic:'Purpose', cat:'purpose', ref:'Colossians 1:16',
    verse:'For by him were all things created, that are in heaven, and that are in earth, visible and invisible: all things were created by him, and for him.',
    truth:'I wasn’t created as an afterthought — everything, including me, was made by Christ and for Him, which gives my life real purpose.',
    prayer:'Lord, thank You for creating me for You. Let that truth anchor my sense of purpose today. Amen.' },

  { id:23, topic:'Stress', cat:'mind', ref:'Psalm 55:22',
    verse:'Cast thy burden upon the LORD, and he shall sustain thee: he shall never suffer the righteous to be moved.',
    truth:'I don\u2019t have to carry this alone — God sustains me when I hand Him what\u2019s weighing me down.',
    prayer:'Lord, I\u2019m casting this stress on You today. Thank You for sustaining me and not letting me be shaken. Amen.' },
  { id:118, topic:'Stress', cat:'mind', ref:'Psalm 46:1',
    verse:'God is our refuge and strength, a very present help in trouble.',
    truth:'Stress tries to convince me I’m facing everything alone, but God is present help — not distant, but here in the middle of it.',
    prayer:'Lord, be my refuge and strength today. Meet me as a very present help in this stress. Amen.' },
  { id:119, topic:'Stress', cat:'mind', ref:'2 Corinthians 12:9',
    verse:'And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I rather glory in my infirmities, that the power of Christ may rest upon me.',
    truth:'I don’t need to have enough strength on my own — God’s grace is sufficient even when stress leaves me running on empty.',
    prayer:'Father, Your grace is sufficient for me. Let Your strength show up in the places where mine runs out. Amen.' },
  { id:120, topic:'Stress', cat:'mind', ref:'Psalm 23:2-3',
    verse:'He maketh me to lie down in green pastures: he leadeth me beside the still waters. He restoreth my soul.',
    truth:'Even in a stressful season, the Good Shepherd still knows how to lead me somewhere restful and restore what’s been worn down.',
    prayer:'Lord, lead me beside still waters today. Restore my soul in the middle of this stressful season. Amen.' },
  { id:121, topic:'Stress', cat:'mind', ref:'Exodus 33:14',
    verse:'And he said, My presence shall go with thee, and I will give thee rest.',
    truth:'God doesn’t just promise rest somewhere out there — He promises His own presence will go with me right where I am.',
    prayer:'Father, let Your presence go with me today, and give me rest in the middle of what stresses me. Amen.' },
  { id:24, topic:'Overwhelmed', cat:'mind', ref:'Psalm 61:2',
    verse:'From the end of the earth will I cry unto thee, when my heart is overwhelmed: lead me to the rock that is higher than I.',
    truth:'When I feel overwhelmed, God is the steady rock higher than my circumstances.',
    prayer:'Father, my heart feels overwhelmed today. Lead me to the rock that\u2019s higher than what I\u2019m facing. Amen.' },
  { id:122, topic:'Overwhelmed', cat:'mind', ref:'2 Corinthians 4:8-9',
    verse:'We are troubled on every side, yet not distressed; we are perplexed, but not in despair; Persecuted, but not forsaken; cast down, but not destroyed.',
    truth:'Feeling overwhelmed doesn’t mean I’m being destroyed — I can be pressed on every side and still not be crushed, because God holds on to me.',
    prayer:'Lord, when I feel pressed on every side, remind me I am not forsaken or destroyed. Hold on to me. Amen.' },
  { id:123, topic:'Overwhelmed', cat:'mind', ref:'Psalm 142:3',
    verse:'When my spirit was overwhelmed within me, then thou knewest my path.',
    truth:'Even when I feel overwhelmed and can’t see my own way forward, God already knows the path I’m on.',
    prayer:'Lord, when my spirit is overwhelmed, thank You for knowing my path even when I can’t see it myself. Amen.' },
  { id:124, topic:'Overwhelmed', cat:'mind', ref:'Isaiah 43:2',
    verse:'When thou passest through the waters, I will be with thee; and through the rivers, they shall not overflow thee: when thou walkest through the fire, thou shalt not be burned; neither shall the flame kindle upon thee.',
    truth:'God doesn’t promise to keep the overwhelming waters away — He promises to be with me in them so they don’t overtake me.',
    prayer:'Father, when I feel like I’m going under, remind me You are with me in the waters, and they will not overflow me. Amen.' },
  { id:125, topic:'Overwhelmed', cat:'mind', ref:'2 Corinthians 1:8-9',
    verse:'For we would not, brethren, have you ignorant of our trouble which came to us in Asia, that we were pressed out of measure, above strength, insomuch that we despaired even of life: But we had the sentence of death in ourselves, that we should not trust in ourselves, but in God which raiseth the dead.',
    truth:'Even Paul was pressed beyond his own strength — and that was exactly the place God taught him to stop trusting himself and trust God instead.',
    prayer:'Lord, when I’m pressed beyond my own strength, teach me what Paul learned — to stop trusting myself and trust fully in You. Amen.' },
  { id:25, topic:'Thoughts', cat:'mind', ref:'2 Corinthians 10:5',
    verse:'Casting down imaginations, and every high thing that exalteth itself against the knowledge of God, and bringing into captivity every thought to the obedience of Christ.',
    truth:'I don\u2019t have to believe every thought I have — I can take it captive and measure it against truth.',
    prayer:'Lord, help me take my thoughts captive today. Where they don\u2019t line up with Your truth, replace them. Amen.' },
  { id:126, topic:'Thoughts', cat:'mind', ref:'Philippians 4:8',
    verse:'Finally, brethren, whatsoever things are true, whatsoever things are honest, whatsoever things are just, whatsoever things are pure, whatsoever things are lovely, whatsoever things are of good report; if there be any virtue, and if there be any praise, think on these things.',
    truth:'I get to choose what I dwell on — filling my mind with what’s true and good crowds out what isn’t.',
    prayer:'Lord, help me fix my thoughts on what is true, pure, and lovely today. Amen.' },
  { id:127, topic:'Thoughts', cat:'mind', ref:'Colossians 3:2',
    verse:'Set your affection on things above, not on things on the earth.',
    truth:'Where I set my mind shapes everything else — setting it on things above changes how I see what’s right in front of me.',
    prayer:'Father, set my mind on things above today, not just on what’s directly in front of me. Amen.' },
  { id:128, topic:'Thoughts', cat:'mind', ref:'Proverbs 23:7',
    verse:'For as he thinketh in his heart, so is he.',
    truth:'My thoughts aren’t neutral — they actually shape who I become, so it matters what I let take root in my mind.',
    prayer:'Lord, guard my heart and mind. Let what I think on shape me into who You’ve called me to be. Amen.' },
  { id:129, topic:'Thoughts', cat:'mind', ref:'Psalm 139:23',
    verse:'Search me, O God, and know my heart: try me, and know my thoughts.',
    truth:'I don’t have to sort out every thought on my own — I can invite God to search my mind and show me what’s really there.',
    prayer:'Search me, O God, and know my heart. Try me, and know my thoughts today. Amen.' },

  { id:26, topic:'Envy', cat:'heart', ref:'Proverbs 14:30',
    verse:'A sound heart is the life of the flesh: but envy the rottenness of the bones.',
    truth:'Envy eats away at me from the inside — I choose a heart at peace instead.',
    prayer:'Lord, root out any envy in my heart. Give me a heart of peace that isn\u2019t eaten up by what others have. Amen.' },
  { id:170, topic:'Envy', cat:'heart', ref:'James 3:16',
    verse:'For where envying and strife is, there is confusion and every evil work.',
    truth:'Envy doesn’t just sit quietly in my heart — left alone it opens the door to confusion and worse things I don’t want in my life.',
    prayer:'Lord, close the door envy opens in my heart. Protect me from where it leads. Amen.' },
  { id:171, topic:'Envy', cat:'heart', ref:'Galatians 5:26',
    verse:'Let us not be desirous of vain glory, provoking one another, envying one another.',
    truth:'Envy pits me against the very people I’m called to walk alongside — it turns companions into competitors.',
    prayer:'Father, keep me from envying those around me. Help me walk alongside them instead of competing with them. Amen.' },
  { id:172, topic:'Envy', cat:'heart', ref:'Psalm 37:1',
    verse:'Fret not thyself because of evildoers, neither be thou envious against the workers of iniquity.',
    truth:'Envy over someone else’s success — even ill-gotten — isn’t worth the peace it costs me.',
    prayer:'Lord, keep me from fretting over what others have. Guard my peace from envy’s pull. Amen.' },
  { id:173, topic:'Envy', cat:'heart', ref:'Titus 3:3',
    verse:'For we ourselves also were sometimes foolish, disobedient, deceived, serving divers lusts and pleasures, living in malice and envy, hateful, and hating one another.',
    truth:'Envy was part of who I used to be before grace found me — I don’t have to go back to living there.',
    prayer:'Father, thank You for the grace that rescued me from envy and malice. Keep me from returning to it. Amen.' },
  { id:27, topic:'Jealousy', cat:'heart', ref:'1 Corinthians 13:4',
    verse:'Charity suffereth long, and is kind; charity envieth not; charity vaunteth not itself, is not puffed up.',
    truth:'Real love doesn\u2019t keep score or compare — I can love without jealousy getting in the way.',
    prayer:'Father, teach me to love without jealousy. Help me celebrate others instead of comparing myself to them. Amen.' },
  { id:174, topic:'Jealousy', cat:'heart', ref:'Proverbs 27:4',
    verse:'Wrath is cruel, and anger is outrageous; but who is able to stand before envy?',
    truth:'Jealousy can be harder to fight than anger itself — I need God’s help to stand against it, not just my own willpower.',
    prayer:'Lord, I can’t stand against jealousy on my own. Help me fight it with Your strength, not mine. Amen.' },
  { id:175, topic:'Jealousy', cat:'heart', ref:'1 Corinthians 3:3',
    verse:'For ye are yet carnal: for whereas there is among you envying, and strife, and divisions, are ye not carnal, and walk as men?',
    truth:'Jealousy is a sign I’m leaning on my old nature instead of who I am in Christ — it’s worth noticing when it shows up.',
    prayer:'Lord, when jealousy rises in me, show me where I’m leaning on my old nature instead of on You. Amen.' },
  { id:176, topic:'Jealousy', cat:'heart', ref:'Job 5:2',
    verse:'For wrath killeth the foolish man, and envy slayeth the silly one.',
    truth:'Jealousy doesn’t just hurt the people around me — it does real damage to me if I let it take root.',
    prayer:'Father, protect me from the damage jealousy can do in my own heart. Amen.' },
  { id:177, topic:'Jealousy', cat:'heart', ref:'Genesis 37:11',
    verse:'And his brethren envied him; but his father observed the saying.',
    truth:'Joseph’s brothers let jealousy grow until it nearly destroyed their family — I don’t want to let it grow that far in mine.',
    prayer:'Lord, don’t let jealousy grow unchecked in my relationships the way it did for Joseph’s brothers. Amen.' },
  { id:28, topic:'Control', cat:'heart', ref:'Proverbs 3:5-6',
    verse:'Trust in the LORD with all thine heart; and lean not unto thine own understanding. In all thy ways acknowledge him, and he shall direct thy paths.',
    truth:'I don\u2019t have to control everything — I can trust God with what I can\u2019t manage.',
    prayer:'Lord, I release my grip on trying to control everything. Help me trust You with what\u2019s outside my hands. Amen.' },
  { id:178, topic:'Control', cat:'heart', ref:'Psalm 46:10',
    verse:'Be still, and know that I am God: I will be exalted among the heathen, I will be exalted in the earth.',
    truth:'Being still doesn’t come naturally when I want to control the outcome — but it’s in stillness that I remember God is God and I am not.',
    prayer:'Lord, help me be still and remember You are God. Loosen my grip on what I’m trying to control. Amen.' },
  { id:179, topic:'Control', cat:'heart', ref:'1 Peter 5:6-7',
    verse:'Humble yourselves therefore under the mighty hand of God, that he may exalt you in due time: Casting all your care upon him; for he careth for you.',
    truth:'Letting go of control isn’t the same as giving up — it’s humbling myself under God’s hand and trusting His timing instead of mine.',
    prayer:'Father, I humble myself under Your hand today. Take the cares I’ve been trying to control. Amen.' },
  { id:180, topic:'Control', cat:'heart', ref:'James 4:13-15',
    verse:'Go to now, ye that say, To day or to morrow we will go into such a city, and continue there a year, and buy and sell, and get gain: Whereas ye know not what shall be on the morrow. For what is your life? It is even a vapour, that appeareth for a little time, and then vanisheth away. For that ye ought to say, If the Lord will, we shall live, and do this, or that.',
    truth:'I make plans as if I control tomorrow, but my life is a vapor — holding my plans loosely, with ‘if the Lord will,’ is actually freeing.',
    prayer:'Lord, help me hold my plans loosely. Teach me to say ‘if the Lord will’ instead of assuming I’m in control. Amen.' },
  { id:181, topic:'Control', cat:'heart', ref:'Proverbs 19:21',
    verse:'There are many devices in a man’s heart; nevertheless the counsel of the LORD, that shall stand.',
    truth:'I can make all the plans I want, but it’s God’s counsel that actually stands — trying to control everything was never going to work anyway.',
    prayer:'Father, let Your counsel stand over my plans today. Free me from trying to control what’s already in Your hands. Amen.' },

  { id:29, topic:'Condemnation', cat:'worth', ref:'John 3:17',
    verse:'For God sent not his Son into the world to condemn the world; but that the world through him might be saved.',
    truth:'God didn\u2019t send Jesus to condemn me — He sent Him to save me.',
    prayer:'Father, thank You that Jesus didn\u2019t come to condemn me but to save me. Help me stop condemning myself too. Amen.' },
  { id:226, topic:'Condemnation', cat:'worth', ref:'John 5:24',
    verse:'Verily, verily, I say unto you, He that heareth my word, and believeth on him that sent me, hath everlasting life, and shall not come into condemnation; but is passed from death unto life.',
    truth:'I’ve already passed from death into life — condemnation isn’t a place I still live, even when guilt tries to pull me back.',
    prayer:'Lord, thank You that I have passed from death to life. Keep me from living as though condemnation still has a claim on me. Amen.' },
  { id:227, topic:'Condemnation', cat:'worth', ref:'John 8:10-11',
    verse:'When Jesus had lifted up himself, and saw none but the woman, he said unto her, Woman, where are those thine accusers? hath no man condemned thee? She said, No man, Lord. And Jesus said unto her, Neither do I condemn thee: go, and sin no more.',
    truth:'Jesus didn’t excuse what the woman had done, but He also didn’t condemn her — He sent her forward instead of leaving her stuck in shame.',
    prayer:'Lord, thank You that You don’t condemn me. Help me walk forward in freedom instead of staying stuck in guilt. Amen.' },
  { id:228, topic:'Condemnation', cat:'worth', ref:'Romans 5:1',
    verse:'Therefore being justified by faith, we have peace with God through our Lord Jesus Christ.',
    truth:'Justification isn’t a feeling I have to work up — it’s a legal reality that gives me actual peace with God.',
    prayer:'Father, thank You for justifying me by faith. Let that truth give me real peace, not just a feeling I chase. Amen.' },
  { id:229, topic:'Condemnation', cat:'worth', ref:'1 John 3:20',
    verse:'For if our heart condemn us, God is greater than our heart, and knoweth all things.',
    truth:'My own heart can condemn me more harshly than God does — but He is greater than my self-condemnation and knows the whole truth.',
    prayer:'Lord, when my own heart condemns me, remind me You are greater than my heart and know all things. Amen.' },
  { id:30, topic:'Rejection', cat:'worth', ref:'Isaiah 41:9-10',
    verse:'I have chosen thee, and not cast thee away. Fear thou not; for I am with thee.',
    truth:'God has chosen me, not cast me away — rejection from others doesn\u2019t change that.',
    prayer:'Lord, when I feel rejected, remind me that You have chosen me and will never cast me away. Amen.' },
  { id:230, topic:'Rejection', cat:'worth', ref:'John 6:37',
    verse:'All that the Father giveth me shall come to me; and him that cometh to me I will in no wise cast out.',
    truth:'Jesus made a direct promise that whoever comes to Him will never be cast out — rejection isn’t something I have to fear from Him.',
    prayer:'Lord, thank You for promising never to cast me out. Heal the places where rejection has made me afraid to come close. Amen.' },
  { id:231, topic:'Rejection', cat:'worth', ref:'Romans 8:38-39',
    verse:'For I am persuaded, that neither death, nor life, nor angels, nor principalities, nor powers, nor things present, nor things to come, Nor height, nor depth, nor any other creature, shall be able to separate us from the love of God, which is in Christ Jesus our Lord.',
    truth:'Nothing on this list — not even my own worst experiences — has the power to separate me from God’s love.',
    prayer:'Father, thank You that nothing can separate me from Your love. Let that truth outweigh the rejection I’ve felt from others. Amen.' },
