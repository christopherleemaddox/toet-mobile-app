  { id:232, topic:'Rejection', cat:'worth', ref:'Isaiah 49:15-16',
    verse:'Can a woman forget her sucking child, that she should not have compassion on the son of her womb? yea, they may forget, yet will I not forget thee. Behold, I have graven thee upon the palms of my hands.',
    truth:'Even if the people who were supposed to love me forget or fail, God has engraved me on His own hands — He hasn’t forgotten me.',
    prayer:'Lord, thank You for engraving me on Your hands. Even when people have forgotten or failed me, You have not. Amen.' },
  { id:233, topic:'Rejection', cat:'worth', ref:'Ephesians 1:4',
    verse:'According as he hath chosen us in him before the foundation of the world, that we should be holy and without blame before him in love.',
    truth:'God chose me before the world even existed — rejection from people can’t undo a choice that old and that settled.',
    prayer:'Father, thank You for choosing me before the foundation of the world. Let that settle what rejection has shaken. Amen.' },
  { id:31, topic:'Insecurity', cat:'worth', ref:'Psalm 139:14',
    verse:'I will praise thee; for I am fearfully and wonderfully made: marvellous are thy works; and that my soul knoweth right well.',
    truth:'I am fearfully and wonderfully made — my worth isn\u2019t up for debate.',
    prayer:'Father, thank You for making me fearfully and wonderfully. Help me see myself the way You see me. Amen.' },
  { id:234, topic:'Insecurity', cat:'worth', ref:'Philippians 1:6',
    verse:'Being confident of this very thing, that he which hath begun a good work in you will perform it until the day of Jesus Christ.',
    truth:'I don’t have to feel finished or fully put together — God is still at work in me, and He’s committed to finishing what He started.',
    prayer:'Lord, thank You for being faithful to finish the work You started in me. Help me trust the process, not just the outcome. Amen.' },
  { id:235, topic:'Insecurity', cat:'worth', ref:'2 Corinthians 3:5',
    verse:'Not that we are sufficient of ourselves to think any thing as of ourselves; but our sufficiency is of God.',
    truth:'My insecurity often comes from measuring my own sufficiency — but my sufficiency was never supposed to come from me in the first place.',
    prayer:'Father, thank You that my sufficiency comes from You, not from myself. Free me from trying to be enough on my own. Amen.' },
  { id:236, topic:'Insecurity', cat:'worth', ref:'Ephesians 3:12',
    verse:'In whom we have boldness and access with confidence by the faith of him.',
    truth:'The confidence I’m looking for isn’t something I have to manufacture — it’s already available to me through faith in Christ.',
    prayer:'Lord, give me boldness and confidence, not from myself, but through faith in You. Amen.' },
  { id:237, topic:'Insecurity', cat:'worth', ref:'Psalm 71:5-6',
    verse:'For thou art my hope, O Lord GOD: thou art my trust from my youth. By thee have I been holden up from the womb: thou art he that took me out of my mother’s bowels: my praise shall be continually of thee.',
    truth:'God has been holding me up since before I could do anything to earn it — my security was never meant to rest on my own performance.',
    prayer:'Lord, You have held me up since before I was born. Let my security rest in You, not in my own performance. Amen.' },
  { id:32, topic:'Self-Worth', cat:'worth', ref:'1 Peter 2:9',
    verse:'But ye are a chosen generation, a royal priesthood, an holy nation, a peculiar people.',
    truth:'I am chosen and treasured by God — that\u2019s the truth about who I am, not how I feel about myself.',
    prayer:'Lord, when I think less of myself than I should, remind me I am Yours — chosen and valued. Amen.' },
  { id:238, topic:'Self-Worth', cat:'worth', ref:'Psalm 8:4-5',
    verse:'What is man, that thou art mindful of him? and the son of man, that thou visitest him? For thou hast made him a little lower than the angels, and hast crowned him with glory and honour.',
    truth:'God didn’t just make me — He crowned me with glory and honor, a value I didn’t have to earn to receive.',
    prayer:'Lord, thank You for crowning me with glory and honor. Help me see myself the way You see me. Amen.' },
  { id:239, topic:'Self-Worth', cat:'worth', ref:'Genesis 1:27',
    verse:'So God created man in his own image, in the image of God created he him; male and female created he them.',
    truth:'My worth isn’t up for debate — it was settled the moment I was made in the image of God Himself.',
    prayer:'Father, thank You for making me in Your image. Let that truth settle any question I have about my worth. Amen.' },
  { id:240, topic:'Self-Worth', cat:'worth', ref:'Luke 12:6-7',
    verse:'Are not five sparrows sold for two farthings, and not one of them is forgotten before God? But even the very hairs of your head are all numbered. Fear not therefore: ye are of more value than many sparrows.',
    truth:'If God keeps track of something as small as a sparrow or the hairs on my head, my worth to Him is far more secure than I usually treat it.',
    prayer:'Lord, thank You for valuing me more than many sparrows. Help me trust how closely You pay attention to me. Amen.' },
  { id:241, topic:'Self-Worth', cat:'worth', ref:'1 Corinthians 6:19-20',
    verse:'What? know ye not that your body is the temple of the Holy Ghost which is in you, which ye have of God, and ye are not your own? For ye are bought with a price: therefore glorify God in your body, and in your spirit, which are God’s.',
    truth:'I was bought with a price — my worth was purchased at a cost, not left to chance or other people’s opinions.',
    prayer:'Father, thank You for buying me at such a price. Help me live like someone who knows their true worth. Amen.' },

  { id:33, topic:'Sadness', cat:'sorrow', ref:'Psalm 30:5',
    verse:'Weeping may endure for a night, but joy cometh in the morning.',
    truth:'This sadness isn\u2019t forever — joy is still coming.',
    prayer:'Lord, be near me in this sadness. Thank You that joy comes, even when this night feels long. Amen.' },
  { id:262, topic:'Sadness', cat:'sorrow', ref:'Psalm 34:17',
    verse:'The righteous cry, and the LORD heareth, and delivereth them out of all their troubles.',
    truth:'My sadness doesn’t go unheard — God actually listens when I cry out, and He is at work delivering me out of it.',
    prayer:'Lord, hear my cry today. Deliver me out of this sadness in Your time. Amen.' },
  { id:263, topic:'Sadness', cat:'sorrow', ref:'John 16:22',
    verse:'And ye now therefore have sorrow: but I will see you again, and your heart shall rejoice, and your joy no man taketh from you.',
    truth:'Jesus told His disciples their sorrow was real but not permanent — the joy coming after it is something no one can take away.',
    prayer:'Jesus, thank You that my sorrow is not the end of the story. I look forward to the joy You promise. Amen.' },
  { id:264, topic:'Sadness', cat:'sorrow', ref:'Psalm 30:11',
    verse:'Thou hast turned for me my mourning into dancing: thou hast put off my sackcloth, and girded me with gladness.',
    truth:'God has a track record of turning mourning into dancing — that’s not just something He did once, it’s who He is.',
    prayer:'Lord, turn my mourning into dancing the way You have done before. I trust You to do it again. Amen.' },
  { id:265, topic:'Sadness', cat:'sorrow', ref:'Psalm 6:6-9',
    verse:'I am weary with my groaning; all the night make I my bed to swim; I water my couch with my tears. The LORD hath heard my supplication; the LORD will receive my prayer.',
    truth:'David’s tears were real and heavy, and yet he still trusted that the LORD heard him — sadness and trust can coexist.',
    prayer:'Lord, You hear my tears even when they feel endless. Thank You for receiving my prayer in the middle of my sadness. Amen.' },
  { id:34, topic:'Trouble', cat:'sorrow', ref:'John 16:33',
    verse:'These things I have spoken unto you, that in me ye might have peace. In the world ye shall have tribulation: but be of good cheer; I have overcome the world.',
    truth:'Trouble doesn\u2019t get the final word — Jesus has already overcome it.',
    prayer:'Jesus, thank You that You\u2019ve already overcome this world\u2019s trouble. Give me peace even in the middle of it. Amen.' },
  { id:266, topic:'Trouble', cat:'sorrow', ref:'Psalm 34:19',
    verse:'Many are the afflictions of the righteous: but the LORD delivereth him out of them all.',
    truth:'Trouble isn’t proof that something’s wrong with my faith — even the righteous face many afflictions, and God delivers out of every one.',
    prayer:'Lord, thank You for delivering me out of trouble, even when it feels like there’s more than I can count. Amen.' },
  { id:267, topic:'Trouble', cat:'sorrow', ref:'Psalm 46:1-2',
    verse:'God is our refuge and strength, a very present help in trouble. Therefore will not we fear, though the earth be removed, and though the mountains be carried into the midst of the sea.',
    truth:'Trouble can shake everything around me, but it can’t shake the refuge I have in God — He stays steady when nothing else does.',
    prayer:'Father, be my refuge in this trouble. Steady me even when everything around me feels shaken. Amen.' },
  { id:268, topic:'Trouble', cat:'sorrow', ref:'2 Corinthians 4:17',
    verse:'For our light affliction, which is but for a moment, worketh for us a far more exceeding and eternal weight of glory.',
    truth:'This trouble, however heavy it feels right now, is actually working toward something eternal that will far outweigh it.',
    prayer:'Lord, help me see this trouble through the lens of eternity, trusting it’s working toward something far greater. Amen.' },
  { id:269, topic:'Trouble', cat:'sorrow', ref:'Nahum 1:7',
    verse:'The LORD is good, a strong hold in the day of trouble; and he knoweth them that trust in him.',
    truth:'God doesn’t just know about my trouble from a distance — He knows me personally, as someone who trusts Him.',
    prayer:'Lord, thank You for being my stronghold in trouble. Thank You for knowing me personally. Amen.' },

  { id:35, topic:'Patience', cat:'faith', ref:'James 1:4',
    verse:'But let patience have her perfect work, that ye may be perfect and entire, wanting nothing.',
    truth:'Patience is doing something good in me, even when waiting is hard.',
    prayer:'Lord, help me let patience finish its work in me instead of rushing past it. Amen.' },
  { id:298, topic:'Patience', cat:'faith', ref:'Romans 8:25',
    verse:'But if we hope for that we see not, then do we with patience wait for it.',
    truth:'Patience isn’t passive waiting — it’s hope actively holding on for what I can’t yet see.',
    prayer:'Lord, grow patience in me as I hope for what I can’t yet see. Amen.' },
  { id:299, topic:'Patience', cat:'faith', ref:'Hebrews 10:36',
    verse:'For ye have need of patience, that, after ye have done the will of God, ye might receive the promise.',
    truth:'Patience isn’t separate from obedience — sometimes doing God’s will means waiting well for what comes after.',
    prayer:'Lord, give me patience to keep doing Your will while I wait for what You’ve promised. Amen.' },
  { id:300, topic:'Patience', cat:'faith', ref:'Ecclesiastes 7:8',
    verse:'Better is the end of a thing than the beginning thereof: and the patient in spirit is better than the proud in spirit.',
    truth:'Patience is actually a form of humility — it trusts the ending will be better than rushing to the finish myself.',
    prayer:'Father, make me patient in spirit rather than proud and rushing. Amen.' },
  { id:301, topic:'Patience', cat:'faith', ref:'James 5:7-8',
    verse:'Be patient therefore, brethren, unto the coming of the Lord. Behold, the husbandman waiteth for the precious fruit of the earth, and hath long patience for it, until he receive the early and latter rain.',
    truth:'A farmer doesn’t rush the harvest — patience trusts the process even when the fruit isn’t visible yet.',
    prayer:'Lord, teach me to wait like the farmer waits for the harvest, trusting the process even when I can’t see fruit yet. Amen.' },
  { id:36, topic:'Strength', cat:'faith', ref:'Philippians 4:13',
    verse:'I can do all things through Christ which strengtheneth me.',
    truth:'My strength isn\u2019t self-made — it comes from Christ in me.',
    prayer:'Lord, be my strength today. Help me do what I can\u2019t do on my own. Amen.' },
  { id:302, topic:'Strength', cat:'faith', ref:'Psalm 28:7',
    verse:'The LORD is my strength and my shield; my heart trusted in him, and I am helped: therefore my heart greatly rejoiceth; and with my song will I praise him.',
    truth:'God isn’t just a source of strength I visit occasionally — He is my strength, close enough that my heart can trust and rejoice in Him.',
    prayer:'Lord, You are my strength and my shield. Let my heart trust and rejoice in You today. Amen.' },
  { id:303, topic:'Strength', cat:'faith', ref:'Ephesians 6:10',
    verse:'Finally, my brethren, be strong in the Lord, and in the power of his might.',
    truth:'The strength I need isn’t found in trying harder on my own — it’s found in the Lord, in the power that belongs to Him.',
    prayer:'Father, make me strong in You and in the power of Your might, not in my own effort. Amen.' },
  { id:304, topic:'Strength', cat:'faith', ref:'Psalm 18:32',
    verse:'It is God that girdeth me with strength, and maketh my way perfect.',
    truth:'The strength I need for today isn’t self-generated — God actively equips me with exactly what the path ahead requires.',
    prayer:'Lord, gird me with strength today. Make my way clear as You equip me for it. Amen.' },
  { id:305, topic:'Strength', cat:'faith', ref:'2 Samuel 22:33',
    verse:'God is my strength and power: and he maketh my way perfect.',
    truth:'Strength and direction come from the same source — I don’t have to figure out my path and find strength separately.',
    prayer:'Father, be my strength and my power today, and make my way clear as I trust You. Amen.' },
  { id:37, topic:'Endurance', cat:'faith', ref:'James 1:12',
    verse:'Blessed is the man that endureth temptation: for when he is tried, he shall receive the crown of life.',
    truth:'What I\u2019m enduring now isn\u2019t wasted — God sees it and it\u2019s leading somewhere good.',
    prayer:'Father, give me strength to endure. Thank You that You see what I\u2019m walking through and it isn\u2019t wasted. Amen.' },
  { id:306, topic:'Endurance', cat:'faith', ref:'2 Timothy 2:3',
    verse:'Thou therefore endure hardness, as a good soldier of Jesus Christ.',
    truth:'Enduring hardship isn’t a sign something’s gone wrong — it’s actually part of what it looks like to serve faithfully.',
    prayer:'Lord, help me endure hardness like a good soldier, staying faithful even when it’s hard. Amen.' },
  { id:307, topic:'Endurance', cat:'faith', ref:'1 Corinthians 9:24-25',
    verse:'Know ye not that they which run in a race run all, but one receiveth the prize? So run, that ye may obtain. And every man that striveth for the mastery is temperate in all things: now they do it to obtain a corruptible crown; but we an incorruptible.',
    truth:'The discipline it takes to endure isn’t wasted effort — I’m running for something that actually lasts, not something that fades.',
    prayer:'Lord, help me run with endurance for what lasts, not just what feels good right now. Amen.' },
  { id:308, topic:'Endurance', cat:'faith', ref:'James 5:11',
    verse:'Behold, we count them happy which endure. Ye have heard of the patience of Job, and have seen the end of the Lord; that the Lord is very pitiful, and of tender mercy.',
    truth:'Job’s story reminds me that endurance doesn’t go unnoticed by God — His mercy is present even in the middle of the long wait.',
    prayer:'Lord, let me endure with the patience of Job, trusting Your tender mercy is present even now. Amen.' },
  { id:309, topic:'Endurance', cat:'faith', ref:'Romans 8:18',
    verse:'For I reckon that the sufferings of this present time are not worthy to be compared with the glory which shall be revealed in us.',
    truth:'Whatever I’m enduring now, however heavy, isn’t the final measure of my life — it’s small compared to what’s still coming.',
    prayer:'Father, help me hold what I’m enduring now in light of the glory that’s still to come. Amen.' },

  { id:38, topic:'Joy', cat:'joy', ref:'Nehemiah 8:10',
    verse:'The joy of the LORD is your strength.',
    truth:'My joy isn\u2019t dependent on my circumstances — it comes from the Lord and it\u2019s my strength.',
    prayer:'Lord, thank You that Your joy is my strength today, no matter what I\u2019m facing. Amen.' },
  { id:374, topic:'Joy', cat:'joy', ref:'Psalm 16:11',
    verse:'Thou wilt shew me the path of life: in thy presence is fulness of joy; at thy right hand there are pleasures for evermore.',
    truth:'Joy isn’t found in chasing the right circumstances — it’s found in God’s presence, which is available to me right now.',
    prayer:'Lord, lead me in the path of life. Let me find fullness of joy in Your presence today. Amen.' },
  { id:375, topic:'Joy', cat:'joy', ref:'John 15:11',
    verse:'These things have I spoken unto you, that my joy might remain in you, and that your joy might be full.',
    truth:'The joy Jesus offers isn’t a partial version — He wants it to remain in me and actually be full, not just occasional.',
    prayer:'Jesus, let Your joy remain in me and be full, not just a fleeting feeling. Amen.' },
  { id:376, topic:'Joy', cat:'joy', ref:'James 1:2',
    verse:'My brethren, count it all joy when ye fall into divers temptations.',
    truth:'Joy isn’t only for the easy seasons — James connects it directly to trials, which changes what I think joy is supposed to look like.',
    prayer:'Lord, help me count it joy even in hard seasons, trusting You’re working through them. Amen.' },
  { id:377, topic:'Joy', cat:'joy', ref:'Habakkuk 3:17-18',
    verse:'Although the fig tree shall not blossom, neither shall fruit be in the vines; yet I will rejoice in the LORD, I will joy in the God of my salvation.',
    truth:'Habakkuk’s joy wasn’t tied to his circumstances improving — he chose it even while everything around him was failing.',
    prayer:'Lord, let me rejoice in You even when circumstances don’t improve. You are my joy, not my situation. Amen.' },
  { id:39, topic:'Love', cat:'joy', ref:'1 John 4:19',
    verse:'We love him, because he first loved us.',
    truth:'I am loved first, before I did anything to earn it — that\u2019s where my ability to love comes from.',
    prayer:'Father, thank You for loving me first. Help that love overflow into how I treat others today. Amen.' },
  { id:378, topic:'Love', cat:'joy', ref:'John 15:12',
    verse:'This is my commandment, That ye love one another, as I have loved you.',
    truth:'The standard for how I love others isn’t my own comfort level — it’s the way Jesus has already loved me.',
    prayer:'Jesus, help me love others the way You have loved me, not just the way that’s comfortable for me. Amen.' },
  { id:379, topic:'Love', cat:'joy', ref:'1 Corinthians 13:4-7',
    verse:'Charity suffereth long, and is kind; charity envieth not; charity vaunteth not itself, is not puffed up. Beareth all things, believeth all things, hopeth all things, endureth all things.',
    truth:'Love described this way isn’t a feeling I fall into — it’s patient, kind action that keeps choosing to endure and believe the best.',
    prayer:'Lord, grow this kind of patient, enduring love in me — not just a feeling, but a choice I keep making. Amen.' },
  { id:380, topic:'Love', cat:'joy', ref:'Romans 5:8',
    verse:'But God commendeth his love toward us, in that, while we were yet sinners, Christ died for us.',
    truth:'God didn’t wait for me to clean up before loving me — His love reached me exactly where I was, at my worst.',
    prayer:'Father, thank You for loving me while I was still a sinner. Help me love others the same way. Amen.' },
  { id:381, topic:'Love', cat:'joy', ref:'1 John 4:7-8',
    verse:'Beloved, let us love one another: for love is of God; and every one that loveth is born of God, and knoweth God. He that loveth not knoweth not God; for God is love.',
    truth:'Loving others isn’t separate from knowing God — it’s actually one of the clearest signs that I genuinely know Him.',
    prayer:'Lord, let my love for others be evidence that I truly know You. Amen.' },
  { id:40, topic:'Kindness', cat:'joy', ref:'Ephesians 4:32',
    verse:'And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ\u2019s sake hath forgiven you.',
    truth:'I can be kind because I\u2019ve already been shown kindness I didn\u2019t earn.',
    prayer:'Lord, make me kind and tenderhearted today, the way You\u2019ve been kind to me. Amen.' },
  { id:382, topic:'Kindness', cat:'joy', ref:'Proverbs 19:17',
    verse:'He that hath pity upon the poor lendeth unto the LORD; and that which he hath given will he pay him again.',
    truth:'Kindness toward people in need isn’t wasted or forgotten — God treats it as something lent directly to Him.',
    prayer:'Lord, help me be kind to those in need, trusting You see and remember every act of kindness. Amen.' },
  { id:383, topic:'Kindness', cat:'joy', ref:'Titus 3:4-5',
    verse:'But after that the kindness and love of God our Saviour toward man appeared, Not by works of righteousness which we have done, but according to his mercy he saved us.',
    truth:'God’s kindness toward me wasn’t a reward for good behavior — it appeared and reached me before I had done anything to deserve it.',
    prayer:'Father, thank You for Your kindness that reached me before I earned it. Let me extend that same kindness to others. Amen.' },
  { id:384, topic:'Kindness', cat:'joy', ref:'Proverbs 11:17',
    verse:'The merciful man doeth good to his own soul: but he that is cruel troubleth his own flesh.',
    truth:'Kindness isn’t just good for the person receiving it — it actually does something good in me too.',
    prayer:'Lord, help me see that showing kindness benefits my own soul, not just the person I’m being kind to. Amen.' },
  { id:385, topic:'Kindness', cat:'joy', ref:'Galatians 6:10',
    verse:'As we have therefore opportunity, let us do good unto all men, especially unto them who are of the household of faith.',
    truth:'Kindness works best when it’s ready for whatever opportunity shows up, not saved only for planned or convenient moments.',
    prayer:'Father, help me notice and take the opportunities to do good as they come, not just the planned ones. Amen.' },

  { id:41, topic:'Freedom', cat:'purpose', ref:'Galatians 5:1',
    verse:'Stand fast therefore in the liberty wherewith Christ hath made us free, and be not entangled again with the yoke of bondage.',
    truth:'Christ has already set me free — I don\u2019t have to go back to what used to hold me.',
    prayer:'Lord, thank You for the freedom You\u2019ve given me. Help me stand in it instead of returning to what held me captive. Amen.' },
  { id:410, topic:'Freedom', cat:'purpose', ref:'John 8:36',
    verse:'If the Son therefore shall make you free, ye shall be free indeed.',
    truth:'The freedom Jesus gives isn’t partial or temporary — it’s real freedom, the kind that actually holds up.',
    prayer:'Jesus, thank You for making me free indeed. Help me live like someone who is truly free. Amen.' },
  { id:411, topic:'Freedom', cat:'purpose', ref:'2 Corinthians 3:17',
    verse:'Now the Lord is that Spirit: and where the Spirit of the Lord is, there is liberty.',
    truth:'Freedom isn’t something I find on my own — it shows up wherever the Spirit of the Lord actually is.',
    prayer:'Lord, let Your Spirit’s presence bring real liberty into my life today. Amen.' },
  { id:412, topic:'Freedom', cat:'purpose', ref:'Romans 6:18',
    verse:'Being then made free from sin, ye became the servants of righteousness.',
    truth:'Freedom isn’t the same as having no master — it’s trading a destructive one for a good one, righteousness instead of sin.',
    prayer:'Father, thank You for freeing me from sin. Help me serve righteousness instead. Amen.' },
  { id:413, topic:'Freedom', cat:'purpose', ref:'Romans 8:2',
    verse:'For the law of the Spirit of life in Christ Jesus hath made me free from the law of sin and death.',
    truth:'The freedom I have isn’t fragile or up for debate — it’s a law-level reality, the Spirit’s life overriding sin and death’s claim on me.',
    prayer:'Lord, thank You that the law of the Spirit of life has set me free from sin and death. Amen.' },
  { id:42, topic:'Victory', cat:'purpose', ref:'1 Corinthians 15:57',
    verse:'But thanks be to God, which giveth us the victory through our Lord Jesus Christ.',
    truth:'The victory is already mine through Christ — I\u2019m not fighting to win, I\u2019m fighting from a place of already having won.',
    prayer:'Father, thank You for the victory You\u2019ve already given me through Jesus. Help me walk in it today. Amen.' },
  { id:414, topic:'Victory', cat:'purpose', ref:'1 John 5:4',
    verse:'For whatsoever is born of God overcometh the world: and this is the victory that overcometh the world, even our faith.',
    truth:'The victory I need over the world isn’t something I have to manufacture through effort — it comes through faith, something already given to me.',
    prayer:'Lord, let my faith be the victory that overcomes the world today. Amen.' },
  { id:415, topic:'Victory', cat:'purpose', ref:'Romans 8:37',
    verse:'Nay, in all these things we are more than conquerors through him that loved us.',
    truth:'I’m not just barely surviving whatever I’m facing — through Christ’s love, I’m actually described as more than a conqueror.',
    prayer:'Father, thank You for making me more than a conqueror through Your love. Help me live like it’s true. Amen.' },
  { id:416, topic:'Victory', cat:'purpose', ref:'Exodus 14:14',
    verse:'The LORD shall fight for you, and ye shall hold your peace.',
    truth:'Some victories aren’t won by my own effort at all — sometimes the most faithful thing I can do is be still and let God fight.',
    prayer:'Lord, fight for me today. Help me hold my peace and trust You with the battle. Amen.' },
  { id:417, topic:'Victory', cat:'purpose', ref:'Revelation 21:7',
    verse:'He that overcometh shall inherit all things; and I will be his God, and he shall be my son.',
    truth:'The victory God promises isn’t just surviving to the end — it comes with an inheritance and a relationship that lasts forever.',
    prayer:'Lord, thank You for the promise that overcoming leads to inheriting all things as Your child. Amen.' },
  { id:43, topic:'Guidance', cat:'purpose', ref:'Psalm 32:8',
    verse:'I will instruct thee and teach thee in the way which thou shalt go: I will guide thee with mine eye.',
    truth:'God isn\u2019t leaving me to figure this out alone — He\u2019s guiding me, step by step.',
    prayer:'Lord, guide me today. Show me the way I should go and help me follow closely. Amen.' },
  { id:418, topic:'Guidance', cat:'purpose', ref:'Psalm 37:23',
    verse:'The steps of a good man are ordered by the LORD: and he delighteth in his way.',
    truth:'God isn’t just watching my steps from a distance — He’s actually ordering them, and He delights in the direction of my life.',
    prayer:'Lord, order my steps today. Thank You for delighting in the way You’re leading me. Amen.' },
  { id:419, topic:'Guidance', cat:'purpose', ref:'Psalm 73:24',
    verse:'Thou shalt guide me with thy counsel, and afterward receive me to glory.',
    truth:'God’s guidance isn’t just for this life — it’s leading somewhere, toward glory, not just toward the next decision.',
    prayer:'Father, guide me with Your counsel, trusting it leads all the way to glory. Amen.' },
  { id:420, topic:'Guidance', cat:'purpose', ref:'John 16:13',
    verse:'Howbeit when he, the Spirit of truth, is come, he will guide you into all truth.',
    truth:'I’m not left to figure out truth on my own — the Spirit is specifically given to guide me into it.',
    prayer:'Holy Spirit, guide me into truth today. I don’t want to navigate this alone. Amen.' },
  { id:421, topic:'Guidance', cat:'purpose', ref:'Isaiah 58:11',
    verse:'And the LORD shall guide thee continually, and satisfy thy soul in drought, and make fat thy bones: and thou shalt be like a watered garden.',
    truth:'God’s guidance isn’t occasional check-ins — it’s continual, even reaching into the driest seasons of my life.',
    prayer:'Lord, guide me continually, even in dry seasons. Satisfy my soul like a watered garden. Amen.' },

  { id:44, topic:'Temptation', cat:'faith', ref:'James 4:7-8',
    verse:'Submit yourselves therefore to God. Resist the devil, and he will flee from you. Draw nigh to God, and he will draw nigh to you. Cleanse your hands, ye sinners; and purify your hearts, ye double minded.',
    truth:'When I resist the enemy and draw near to God, He draws near to me \u2014 this isn\u2019t a fight I have to win alone.',
    prayer:'Lord, help me resist the enemy today and draw near to You. Cleanse my hands and purify my heart as I do. Amen.' },
  { id:310, topic:'Temptation', cat:'faith', ref:'1 Corinthians 10:13',
    verse:'There hath no temptation taken you but such as is common to man: but God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation also make a way to escape, that ye may be able to bear it.',
    truth:'Temptation isn’t a sign I’m uniquely weak — it’s common to everyone, and God always provides a way out, even when I can’t see it yet.',
    prayer:'Lord, thank You for being faithful to provide a way of escape. Help me look for it instead of giving in. Amen.' },
  { id:311, topic:'Temptation', cat:'faith', ref:'Matthew 26:41',
    verse:'Watch and pray, that ye enter not into temptation: the spirit indeed is willing, but the flesh is weak.',
    truth:'My spirit can genuinely want to do right even while my flesh struggles — watching and praying bridges that gap.',
    prayer:'Lord, help me watch and pray so I don’t enter into temptation, even when my flesh feels weak. Amen.' },
  { id:312, topic:'Temptation', cat:'faith', ref:'Hebrews 4:15',
    verse:'For we have not an high priest which cannot be touched with the feeling of our infirmities; but was in all points tempted like as we are, yet without sin.',
    truth:'Jesus knows exactly what temptation feels like from the inside — He’s not distant from my struggle, He understands it firsthand.',
    prayer:'Jesus, thank You for understanding my temptation firsthand. Help me lean on You in the middle of it. Amen.' },
  { id:313, topic:'Temptation', cat:'faith', ref:'Psalm 119:11',
    verse:'Thy word have I hid in mine heart, that I might not sin against thee.',
    truth:'Filling my heart with God’s word ahead of time is preparation for the moment temptation actually shows up.',
    prayer:'Lord, help me hide Your word in my heart now, so I’m ready when temptation comes. Amen.' },

  { id:45, topic:'Purity', cat:'faith', ref:'Matthew 5:8',
    verse:'Blessed are the pure in heart: for they shall see God.',
    truth:'A pure heart isn\u2019t about being perfect \u2014 it\u2019s about wanting to see God more than anything else.',
    prayer:'Lord, purify my heart. Help me want You more than anything this world offers. Amen.' },
  { id:314, topic:'Purity', cat:'faith', ref:'Psalm 51:10',
    verse:'Create in me a clean heart, O God; and renew a right spirit within me.',
    truth:'Purity isn’t something I can manufacture through effort alone — it’s something I ask God to create in me.',
    prayer:'Lord, create in me a clean heart and renew a right spirit within me. Amen.' },
  { id:315, topic:'Purity', cat:'faith', ref:'1 Timothy 4:12',
    verse:'Let no man despise thy youth; but be thou an example of the believers, in word, in conversation, in charity, in spirit, in faith, in purity.',
    truth:'Purity is meant to show up in ordinary, visible places — how I speak, how I love, how I carry myself — not just in private.',
    prayer:'Father, help my purity show up in how I speak and act, not just in what I avoid privately. Amen.' },
  { id:316, topic:'Purity', cat:'faith', ref:'Titus 1:15',
    verse:'Unto the pure all things are pure: but unto them that are defiled and unbelieving is nothing pure; but even their mind and conscience is defiled.',
    truth:'Purity shapes how I see everything else — a clean heart changes the lens I look at the world through.',
    prayer:'Lord, purify my heart so it changes how I see everything else around me. Amen.' },
  { id:317, topic:'Purity', cat:'faith', ref:'2 Corinthians 7:1',
    verse:'Having therefore these promises, dearly beloved, let us cleanse ourselves from all filthiness of the flesh and spirit, perfecting holiness in the fear of God.',
    truth:'Cleansing myself isn’t a one-time event — it’s an ongoing process of perfecting holiness as I keep walking with God.',
    prayer:'Father, help me keep cleansing myself from anything that defiles, growing in holiness as I walk with You. Amen.' },
  { id:46, topic:'Lust', cat:'faith', ref:'2 Timothy 2:22',
    verse:'Flee also youthful lusts: but follow righteousness, faith, charity, peace, with them that call on the Lord out of a pure heart.',
    truth:'I don\u2019t have to fight this alone \u2014 running toward God is how I run from what tempts me.',
    prayer:'Lord, give me strength to flee what pulls me away from You. Fill me with a pure heart instead. Amen.' },
  { id:93, topic:'Lust', cat:'faith', ref:'Job 31:1',
    verse:'I made a covenant with mine eyes; why then should I think upon a maid?',
    truth:'Job made a covenant with his own eyes before temptation ever showed up \u2014 I can decide in advance what I will and won\u2019t look at.',
    prayer:'Lord, help me guard my eyes before I even need to. Make that covenant with me today. Amen.' },
  { id:94, topic:'Lust', cat:'faith', ref:'1 Corinthians 6:18-19',
    verse:'Flee fornication. Every sin that a man doeth is without the body; but he that committeth fornication sinneth against his own body. What? know ye not that your body is the temple of the Holy Ghost which is in you, which ye have of God, and ye are not your own?',
    truth:'My body isn\u2019t just mine to do with as I please \u2014 it\u2019s a home the Holy Spirit actually lives in.',
    prayer:'Lord, remind me whose temple this is. Help me treat my body as sacred, not disposable. Amen.' },
  { id:95, topic:'Lust', cat:'faith', ref:'Romans 12:2',
    verse:'And be not conformed to this world: but be ye transformed by the renewing of your mind, that ye may prove what is that good, and acceptable, and perfect, will of God.',
    truth:'Willpower alone can\u2019t out-fight what my mind keeps feeding on \u2014 real change starts with what I let renew my thinking.',
    prayer:'Lord, renew my mind today. Replace what I\u2019ve been feeding on with what You\u2019d have me think instead. Amen.' },
  { id:96, topic:'Lust', cat:'faith', ref:'Galatians 5:16',
    verse:'This I say then, Walk in the Spirit, and ye shall not fulfil the lust of the flesh.',
    truth:'Fighting temptation isn\u2019t just about saying no \u2014 it\u2019s about actually walking somewhere else, toward the Spirit instead.',
    prayer:'Lord, teach me to walk in step with Your Spirit today. Give me somewhere better to put my attention. Amen.' },
  { id:97, topic:'Lust', cat:'faith', ref:'1 Peter 2:11',
    verse:'Dearly beloved, I beseech you as strangers and pilgrims, abstain from fleshly lusts, which war against the soul.',
    truth:'This isn\u2019t a small habit to manage \u2014 Peter calls it a war, and wars are worth fighting with everything I have.',
    prayer:'Lord, I don\u2019t want to underestimate this fight. Give me the seriousness and the strength to abstain. Amen.' },
  { id:47, topic:'Unbelief', cat:'mind', ref:'Hebrews 3:12',
    verse:'Take heed, brethren, lest there be in any of you an evil heart of unbelief, in departing from the living God.',
    truth:'An unbelieving heart doesn\u2019t happen overnight \u2014 I have to guard mine daily, staying close to God.',
    prayer:'Lord, guard my heart from drifting away from You. Keep my faith alive and awake. Amen.' },
  { id:130, topic:'Unbelief', cat:'mind', ref:'Hebrews 11:6',
    verse:'But without faith it is impossible to please him: for he that cometh to God must believe that he is, and that he is a rewarder of them that diligently seek him.',
    truth:'Faith isn’t optional decoration on my relationship with God — it’s the very thing that lets me actually connect with Him.',
    prayer:'Lord, grow my faith. Help me believe not just that You exist, but that You reward those who seek You. Amen.' },
  { id:131, topic:'Unbelief', cat:'mind', ref:'John 20:29',
    verse:'Jesus saith unto him, Thomas, because thou hast seen me, thou hast believed: blessed are they that have not seen, and yet have believed.',
    truth:'I’m blessed even without seeing — believing isn’t about having proof in hand, it’s about trusting God’s character.',
    prayer:'Jesus, I haven’t seen You, but I choose to believe. Thank You for calling that faith blessed. Amen.' },
  { id:132, topic:'Unbelief', cat:'mind', ref:'Matthew 17:20',
    verse:'If ye have faith as a grain of mustard seed, ye shall say unto this mountain, Remove hence to yonder place; and it shall remove; and nothing shall be impossible unto you.',
    truth:'I don’t need a mountain of faith to see God move — even a small, mustard-seed-sized faith is enough for Him to work with.',
    prayer:'Lord, even if my faith feels small like a mustard seed, use it. Nothing is impossible for You. Amen.' },
  { id:133, topic:'Unbelief', cat:'mind', ref:'Romans 10:17',
    verse:'So then faith cometh by hearing, and hearing by the word of God.',
    truth:'Unbelief doesn’t have to stay where it is — faith actually grows the more I fill my ears and heart with God’s word.',
    prayer:'Father, grow my faith as I hear Your word. Replace my unbelief with a faith that keeps growing. Amen.' },
  { id:48, topic:'Fear of Man', cat:'mind', ref:'Proverbs 29:25',
    verse:'The fear of man bringeth a snare: but whoso putteth his trust in the LORD shall be safe.',
    truth:'Living to please people is a trap \u2014 living to trust God is safety.',
    prayer:'Lord, free me from caring more about what people think than what You think. Help me trust You instead. Amen.' },
  { id:134, topic:'Fear of Man', cat:'mind', ref:'Psalm 118:6',
    verse:'The LORD is on my side; I will not fear: what can man do unto me?',
    truth:'When God is on my side, the opinions and reactions of people lose the power they seemed to have over me.',
    prayer:'Lord, remind me You are on my side. Free me from the fear of what people think or might do. Amen.' },
  { id:135, topic:'Fear of Man', cat:'mind', ref:'John 12:42-43',
    verse:'Nevertheless among the chief rulers also many believed on him; but because of the Pharisees they did not confess him, lest they should be put out of the synagogue: For they loved the praise of men more than the praise of God.',
    truth:'Loving the praise of people more than the praise of God will always cost me — I get to choose which one I’m chasing.',
    prayer:'Father, I don’t want to love the praise of people more than Yours. Help me care more about pleasing You. Amen.' },
  { id:136, topic:'Fear of Man', cat:'mind', ref:'Isaiah 51:12',
    verse:'I, even I, am he that comforteth you: who art thou, that thou shouldest be afraid of a man that shall die, and of the son of man which shall be made as grass?',
    truth:'The people I’m afraid of disappointing are just as human and temporary as I am — but the God who comforts me is not.',
    prayer:'Lord, remind me that people are temporary, but You are the one who truly comforts and matters. Amen.' },
  { id:137, topic:'Fear of Man', cat:'mind', ref:'Colossians 3:23',
    verse:'And whatsoever ye do, do it heartily, as to the Lord, and not unto men.',
    truth:'When I do things for the Lord instead of for people’s approval, I’m freed from needing everyone to be pleased with me.',
    prayer:'Father, help me work and live for You, not for the approval of people. Amen.' },
  { id:49, topic:'People Pleasing', cat:'heart', ref:'Galatians 1:10',
    verse:'For do I now persuade men, or God? or do I seek to please men? for if I yet pleased men, I should not be the servant of Christ.',
    truth:'I don\u2019t answer to everyone\u2019s approval \u2014 I answer to God, and that\u2019s enough.',
    prayer:'Lord, help me seek Your approval above everyone else\u2019s. Free me from the need to please people. Amen.' },
  { id:182, topic:'People Pleasing', cat:'heart', ref:'John 5:44',
    verse:'How can ye believe, which receive honour one of another, and seek not the honour that cometh from God only?',
    truth:'Chasing the approval of people can actually get in the way of believing and trusting God the way I’m meant to.',
    prayer:'Lord, I don’t want to chase the honor people give more than the honor that comes from You. Amen.' },
  { id:183, topic:'People Pleasing', cat:'heart', ref:'1 Thessalonians 2:4',
    verse:'But as we were allowed of God to be put in trust with the gospel, even so we speak; not as pleasing men, but God, which trieth our hearts.',
    truth:'God is the one who examines my heart, not the people I keep trying to please — that changes whose approval actually matters.',
    prayer:'Father, help me live to please You, the one who tries my heart, not the people around me. Amen.' },
  { id:184, topic:'People Pleasing', cat:'heart', ref:'Ephesians 6:6',
    verse:'Not with eyeservice, as menpleasers; but as the servants of Christ, doing the will of God from the heart.',
    truth:'Serving out of genuine love for God looks different than performing for people who happen to be watching — I want the first, not the second.',
    prayer:'Lord, let me serve from my heart for You, not just when people are watching. Amen.' },
  { id:185, topic:'People Pleasing', cat:'heart', ref:'Matthew 6:1',
    verse:'Take heed that ye do not your alms before men, to be seen of them: otherwise ye have no reward of your Father which is in heaven.',
    truth:'When I do good things just to be seen and praised, I trade away a reward that would have meant far more.',
    prayer:'Father, let what I do be for Your eyes, not for being seen and praised by people. Amen.' },
  { id:50, topic:'Humility', cat:'faith', ref:'James 4:10',
    verse:'Humble yourselves in the sight of the Lord, and he shall lift you up.',
    truth:'Humbling myself isn\u2019t weakness \u2014 it\u2019s the posture God lifts up.',
    prayer:'Lord, teach me humility. Help me lower myself so You can lift me up in Your time. Amen.' },
  { id:318, topic:'Humility', cat:'faith', ref:'Philippians 2:5-7',
    verse:'Let this mind be in you, which was also in Christ Jesus: Who, being in the form of God, thought it not robbery to be equal with God: But made himself of no reputation, and took upon him the form of a servant.',
    truth:'Christ’s humility wasn’t about having a low opinion of Himself — it was choosing to set aside His status for the sake of others.',
    prayer:'Lord, give me the mind of Christ, willing to set aside status for the sake of others. Amen.' },
  { id:319, topic:'Humility', cat:'faith', ref:'Proverbs 22:4',
    verse:'By humility and the fear of the LORD are riches, and honour, and life.',
    truth:'Humility isn’t a loss — scripture actually ties it to riches, honor, and life, not to being overlooked or diminished.',
    prayer:'Father, grow humility in me, trusting it leads to what truly matters, not to being overlooked. Amen.' },
  { id:320, topic:'Humility', cat:'faith', ref:'1 Peter 5:5',
    verse:'Likewise, ye younger, submit yourselves unto the elder. Yea, all of you be subject one to another, and be clothed with humility: for God resisteth the proud, but giveth grace to the humble.',
    truth:'Humility is something I put on deliberately, like clothing — a daily choice, not just a personality trait I either have or don’t.',
    prayer:'Lord, clothe me with humility today. Help me choose it deliberately, not wait for it to come naturally. Amen.' },
  { id:321, topic:'Humility', cat:'faith', ref:'Luke 14:11',
    verse:'For whosoever exalteth himself shall be abased; and he that humbleth himself shall be exalted.',
    truth:'Trying to elevate myself tends to backfire, but humbling myself is exactly what God says leads to being lifted up.',
    prayer:'Father, help me humble myself, trusting that You are the one who lifts up in Your own time. Amen.' },
  { id:51, topic:'Trust', cat:'faith', ref:'Isaiah 26:3',
    verse:'Thou wilt keep him in perfect peace, whose mind is stayed on thee: because he trusteth in thee.',
    truth:'My mind doesn\u2019t have to spin when it\u2019s fixed on God \u2014 that\u2019s where real peace lives.',
    prayer:'Lord, keep my mind fixed on You. I trust You with what I can\u2019t control. Amen.' },
  { id:322, topic:'Trust', cat:'faith', ref:'Psalm 20:7',
    verse:'Some trust in chariots, and some in horses: but we will remember the name of the LORD our God.',
    truth:'Where I place my trust is a choice — I can lean on things that look strong but fail, or on the name that never does.',
    prayer:'Lord, help me trust in Your name rather than in things that look strong but ultimately fail. Amen.' },
  { id:323, topic:'Trust', cat:'faith', ref:'Psalm 9:10',
    verse:'And they that know thy name will put their trust in thee: for thou, LORD, hast not forsaken them that seek thee.',
    truth:'Trusting God grows the more I actually know Him — it’s not a blind leap, it’s built on His track record.',
    prayer:'Lord, as I come to know Your name more, grow my trust in You. Amen.' },
  { id:324, topic:'Trust', cat:'faith', ref:'Proverbs 16:20',
    verse:'He that handleth a matter wisely shall find good: and whoso trusteth in the LORD, happy is he.',
    truth:'Trusting God isn’t just spiritually right — scripture directly ties it to actually being happy.',
    prayer:'Lord, help me trust You not just because it’s right, but because You genuinely want good for me. Amen.' },
  { id:325, topic:'Trust', cat:'faith', ref:'2 Chronicles 20:20',
    verse:'Believe in the LORD your God, so shall ye be established; believe his prophets, so shall ye prosper.',
    truth:'Trust isn’t just a feeling — it’s something that actually establishes and steadies me when I choose to stand on it.',
    prayer:'Lord, help me believe and trust You in a way that establishes and steadies my life. Amen.' },
  { id:52, topic:'Wisdom', cat:'purpose', ref:'James 1:5',
    verse:'If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him.',
    truth:'I don\u2019t have to figure everything out myself \u2014 God gives wisdom generously when I ask.',
    prayer:'Lord, give me wisdom for what I\u2019m facing. Thank You for giving generously without holding back. Amen.' },
  { id:422, topic:'Wisdom', cat:'purpose', ref:'Proverbs 2:6',
    verse:'For the LORD giveth wisdom: out of his mouth cometh knowledge and understanding.',
    truth:'Wisdom isn’t something I accumulate purely through my own experience — it actually comes from God, given, not just earned.',
    prayer:'Lord, You are the giver of wisdom. I ask for it, trusting it comes from You. Amen.' },
  { id:423, topic:'Wisdom', cat:'purpose', ref:'Proverbs 9:10',
    verse:'The fear of the LORD is the beginning of wisdom: and the knowledge of the holy is understanding.',
    truth:'Real wisdom starts with a right posture toward God, not just with gathering more information.',
    prayer:'Father, let the fear of the LORD be the starting point of my wisdom, not just information I collect. Amen.' },
  { id:424, topic:'Wisdom', cat:'purpose', ref:'Colossians 2:3',
    verse:'In whom are hid all the treasures of wisdom and knowledge.',
    truth:'I don’t have to search everywhere for wisdom — it’s hidden in Christ, and knowing Him is how I find it.',
    prayer:'Jesus, thank You for holding all the treasures of wisdom. Help me seek them in knowing You. Amen.' },
  { id:425, topic:'Wisdom', cat:'purpose', ref:'James 3:17',
    verse:'But the wisdom that is from above is first pure, then peaceable, gentle, and easy to be intreated, full of mercy and good fruits.',
    truth:'True wisdom shows up in character, not just cleverness — it’s marked by purity, peace, and mercy, not by being right.',
    prayer:'Lord, give me wisdom that is pure and peaceable, not just clever. Amen.' },
  { id:53, topic:'Discernment', cat:'purpose', ref:'1 Kings 3:9',
    verse:'Give therefore thy servant an understanding heart to judge thy people, that I may discern between good and bad.',
    truth:'God isn\u2019t looking for me to be the smartest in the room \u2014 just willing to ask Him to help me see clearly.',
    prayer:'Lord, give me an understanding heart. Help me discern what\u2019s right from what only looks right. Amen.' },
  { id:426, topic:'Discernment', cat:'purpose', ref:'Hebrews 5:14',
    verse:'But strong meat belongeth to them that are of full age, even those who by reason of use have their senses exercised to discern both good and evil.',
    truth:'Discernment isn’t automatic — it’s a sense that grows stronger through practice, not something I either have or don’t.',
    prayer:'Lord, help me exercise discernment through practice, growing sharper at telling good from evil. Amen.' },
  { id:427, topic:'Discernment', cat:'purpose', ref:'Philippians 1:9-10',
    verse:'And this I pray, that your love may abound yet more and more in knowledge and in all judgment; That ye may approve things that are excellent.',
    truth:'Discernment and love aren’t separate — real discernment grows out of love that’s paying attention, not detached analysis.',
    prayer:'Father, let my discernment grow out of love, helping me approve what is excellent. Amen.' },
  { id:428, topic:'Discernment', cat:'purpose', ref:'1 John 4:1',
    verse:'Beloved, believe not every spirit, but try the spirits whether they are of God: because many false prophets are gone out into the world.',
    truth:'I’m not meant to believe everything I hear — testing what’s true is actually part of faithful discernment, not distrust.',
    prayer:'Lord, help me test what I hear instead of believing everything automatically. Amen.' },
  { id:429, topic:'Discernment', cat:'purpose', ref:'Proverbs 14:15',
    verse:'The simple believeth every word: but the prudent man looketh well to his going.',
    truth:'Discernment means slowing down enough to actually look at where a path leads before I commit to walking it.',
    prayer:'Lord, make me prudent, looking well to my going instead of rushing ahead simply. Amen.' },
  { id:54, topic:'Obedience', cat:'faith', ref:'1 Samuel 15:22',
    verse:'Behold, to obey is better than sacrifice, and to hearken than the fat of rams.',
    truth:'Obedience matters more to God than any gesture I could offer instead of it.',
    prayer:'Lord, help me obey You, not just perform for You. Teach me to listen and follow. Amen.' },
  { id:326, topic:'Obedience', cat:'faith', ref:'John 14:15',
    verse:'If ye love me, keep my commandments.',
    truth:'Obedience isn’t a separate requirement from love — it’s actually how love for Jesus naturally shows up.',
    prayer:'Lord, let my obedience flow from love for You, not from obligation. Amen.' },
  { id:327, topic:'Obedience', cat:'faith', ref:'John 14:21',
    verse:'He that hath my commandments, and keepeth them, he it is that loveth me: and he that loveth me shall be loved of my Father, and I will manifest myself to him.',
    truth:'Obedience opens the door to experiencing more of Jesus, not less — it’s not restriction, it’s access.',
    prayer:'Jesus, as I obey You, manifest Yourself to me more. Amen.' },
  { id:328, topic:'Obedience', cat:'faith', ref:'1 John 5:3',
    verse:'For this is the love of God, that we keep his commandments: and his commandments are not grievous.',
    truth:'God’s commands aren’t meant to be a heavy burden — they’re actually an expression of love, not grievous weight.',
    prayer:'Father, help me see Your commandments as love, not burden. Amen.' },
  { id:329, topic:'Obedience', cat:'faith', ref:'James 1:22',
    verse:'But be ye doers of the word, and not hearers only, deceiving your own selves.',
    truth:'Hearing truth without acting on it can quietly deceive me into thinking I’ve done something I haven’t.',
    prayer:'Lord, make me a doer of Your word, not just a hearer. Amen.' },
  { id:55, topic:'Generosity', cat:'joy', ref:'2 Corinthians 9:7',
    verse:'Every man according as he purposeth in his heart, so let him give; not grudgingly, or of necessity: for God loveth a cheerful giver.',
    truth:'What I give matters less than the heart behind it \u2014 God loves when I give freely, not out of guilt.',
    prayer:'Lord, make me a cheerful giver. Free my heart from holding too tightly to what You\u2019ve given me. Amen.' },
  { id:386, topic:'Generosity', cat:'joy', ref:'Luke 6:38',
    verse:'Give, and it shall be given unto you; good measure, pressed down, and shaken together, and running over, shall men give into your bosom.',
    truth:'Generosity isn’t a one-way transaction that leaves me emptier — scripture describes it coming back overflowing.',
    prayer:'Lord, help me give generously, trusting Your promise of good measure in return. Amen.' },
  { id:387, topic:'Generosity', cat:'joy', ref:'Proverbs 11:24-25',
    verse:'There is that scattereth, and yet increaseth; and there is that withholdeth more than is meet, but it tendeth to poverty. The liberal soul shall be made fat: and he that watereth shall be watered also himself.',
    truth:'Holding tightly to what I have doesn’t actually protect me the way I think it does — generosity, strangely, is what leads to increase.',
    prayer:'Father, free me from holding too tightly to what I have. Help me be generous, trusting You with the outcome. Amen.' },
  { id:388, topic:'Generosity', cat:'joy', ref:'Acts 20:35',
    verse:'It is more blessed to give than to receive.',
    truth:'Giving isn’t just a duty — Jesus Himself said it’s the more blessed side of the exchange, not the harder or lesser one.',
    prayer:'Lord, help me experience the blessing of giving, not just see it as an obligation. Amen.' },
  { id:389, topic:'Generosity', cat:'joy', ref:'2 Corinthians 8:9',
    verse:'For ye know the grace of our Lord Jesus Christ, that, though he was rich, yet for your sakes he became poor, that ye through his poverty might be rich.',
    truth:'Jesus’ own generosity is the model — He gave up everything so that I could gain everything that matters.',
    prayer:'Jesus, thank You for becoming poor so I could become rich in You. Let that shape how I give. Amen.' },
  { id:56, topic:'Worship', cat:'joy', ref:'Psalm 95:6',
    verse:'O come, let us worship and bow down: let us kneel before the LORD our maker.',
    truth:'Worship isn\u2019t a performance \u2014 it\u2019s simply bowing before the One who made me.',
    prayer:'Lord, I come to worship You. Help me kneel before You with a sincere heart. Amen.' },
  { id:390, topic:'Worship', cat:'joy', ref:'John 4:23-24',
    verse:'But the hour cometh, and now is, when the true worshippers shall worship the Father in spirit and in truth: for the Father seeketh such to worship him.',
    truth:'God isn’t passively waiting to be worshiped — He’s actively seeking worshipers who engage Him honestly, in spirit and truth.',
    prayer:'Father, let me worship You in spirit and truth, not just in form. Amen.' },
  { id:391, topic:'Worship', cat:'joy', ref:'Psalm 150:6',
    verse:'Let every thing that hath breath praise the LORD. Praise ye the LORD.',
    truth:'Worship isn’t reserved for special occasions or talented singers — it’s meant for everything that simply has breath, including me.',
    prayer:'Lord, let everything in me that has breath praise You today. Amen.' },
  { id:392, topic:'Worship', cat:'joy', ref:'Hebrews 13:15',
    verse:'By him therefore let us offer the sacrifice of praise to God continually, that is, the fruit of our lips giving thanks to his name.',
    truth:'Worship isn’t limited to a single setting or moment — it’s meant to be continual, an ongoing offering, not an occasional event.',
    prayer:'Lord, let my praise be continual, not just something I offer once a week. Amen.' },
  { id:393, topic:'Worship', cat:'joy', ref:'Psalm 34:1',
    verse:'I will bless the LORD at all times: his praise shall continually be in my mouth.',
    truth:'Blessing God ‘at all times’ includes the hard times, not just the easy ones — worship isn’t conditional on my circumstances.',
    prayer:'Lord, help me bless You at all times, even in seasons that don’t feel worth praising through. Amen.' },
  { id:57, topic:'Eternal Perspective', cat:'purpose', ref:'2 Corinthians 4:18',
    verse:'While we look not at the things which are seen, but at the things which are not seen: for the things which are seen are temporal; but the things which are not seen are eternal.',
    truth:'What I\u2019m going through won\u2019t last forever \u2014 what matters most is what I can\u2019t yet see.',
    prayer:'Lord, help me fix my eyes on what\u2019s eternal, not just what\u2019s right in front of me today. Amen.' },
  { id:430, topic:'Eternal Perspective', cat:'purpose', ref:'Matthew 6:19-20',
    verse:'Lay not up for yourselves treasures upon earth, where moth and rust doth corrupt, and where thieves break through and steal: But lay up for yourselves treasures in heaven.',
    truth:'What I invest my energy and resources in now says something about which kingdom I’m actually living for.',
    prayer:'Lord, help me lay up treasure in heaven, not just here on earth. Amen.' },
  { id:431, topic:'Eternal Perspective', cat:'purpose', ref:'Philippians 3:20',
    verse:'For our conversation is in heaven; from whence also we look for the Saviour, the Lord Jesus Christ.',
    truth:'My citizenship isn’t ultimately here — remembering that changes how tightly I hold onto what happens on this side of eternity.',
    prayer:'Father, remind me my citizenship is in heaven. Loosen my grip on what’s only temporary. Amen.' },
  { id:432, topic:'Eternal Perspective', cat:'purpose', ref:'2 Corinthians 5:1',
    verse:'For we know that if our earthly house of this tabernacle were dissolved, we have a building of God, an house not made with hands, eternal in the heavens.',
    truth:'This life, as real as it is, is not my permanent home — there’s a building of God waiting that this world’s changes can’t touch.',
    prayer:'Lord, thank You for the eternal home waiting for me. Let that hope steady me here. Amen.' },
  { id:433, topic:'Eternal Perspective', cat:'purpose', ref:'Ecclesiastes 3:11',
    verse:'He hath made every thing beautiful in his time: also he hath set the world in their heart, so that no man can find out the work that God doeth from the beginning to the end.',
    truth:'The sense that this world isn’t quite enough isn’t a flaw in me — God put eternity in my heart on purpose.',
    prayer:'Lord, thank You for placing eternity in my heart. Help me live in light of it. Amen.' },
  { id:58, topic:'God\u2019s Promises', cat:'purpose', ref:'2 Corinthians 1:20',
    verse:'For all the promises of God in him are yea, and in him Amen, unto the glory of God by us.',
    truth:'Every promise God has made is a yes \u2014 I can build my life on that.',
    prayer:'Lord, thank You for Your promises. Help me trust them even when I can\u2019t see how they\u2019ll come true. Amen.' },
  { id:434, topic:'God’s Promises', cat:'purpose', ref:'Numbers 23:19',
    verse:'God is not a man, that he should lie; neither the son of man, that he should repent: hath he said, and shall he not do it? or hath he spoken, and shall he not make it good?',
    truth:'God’s promises aren’t like human promises that can be broken under pressure — He is not a man who lies or changes His mind.',
    prayer:'Lord, thank You for being a God who cannot lie. I trust every promise You’ve made. Amen.' },
  { id:435, topic:'God’s Promises', cat:'purpose', ref:'Joshua 21:45',
    verse:'There failed not ought of any good thing which the LORD had spoken unto the house of Israel; all came to pass.',
    truth:'God has an established track record — not one good promise He made to His people failed to come true.',
    prayer:'Father, thank You for Your track record of keeping every promise. Grow my confidence in what You’ve spoken. Amen.' },
  { id:436, topic:'God’s Promises', cat:'purpose', ref:'2 Peter 1:4',
    verse:'Whereby are given unto us exceeding great and precious promises: that by these ye might be partakers of the divine nature.',
    truth:'God’s promises aren’t just comforting words — they’re the means by which I actually get to share in His own nature.',
    prayer:'Lord, thank You for Your great and precious promises. Let them shape me to be more like You. Amen.' },
  { id:437, topic:'God’s Promises', cat:'purpose', ref:'Isaiah 55:11',
    verse:'So shall my word be that goeth forth out of my mouth: it shall not return unto me void, but it shall accomplish that which I please, and it shall prosper in the thing whereto I sent it.',
    truth:'God’s word doesn’t go out and quietly fail — it accomplishes exactly what He intends, every time.',
    prayer:'Lord, thank You that Your word never returns void. I trust it to accomplish what You intend in my life. Amen.' },
  { id:59, topic:'Mercy', cat:'worth', ref:'Psalm 103:8',
    verse:'The LORD is merciful and gracious, slow to anger, and plenteous in mercy.',
    truth:'God isn\u2019t quick to be angry with me \u2014 He\u2019s quick to be merciful.',
    prayer:'Lord, thank You for Your mercy. Help me extend that same mercy to others today. Amen.' },
  { id:242, topic:'Mercy', cat:'worth', ref:'Titus 3:5',
    verse:'Not by works of righteousness which we have done, but according to his mercy he saved us, by the washing of regeneration, and renewing of the Holy Ghost.',
    truth:'I wasn’t saved because I earned it — mercy did what my own effort never could have done.',
    prayer:'Lord, thank You for saving me by mercy, not by my own works. Keep me grateful, not self-reliant. Amen.' },
  { id:243, topic:'Mercy', cat:'worth', ref:'Micah 7:18',
    verse:'Who is a God like unto thee, that pardoneth iniquity, and passeth by the transgression of the remnant of his heritage? he retaineth not his anger for ever, because he delighteth in mercy.',
    truth:'God doesn’t just tolerate showing me mercy — He actually delights in it, which changes how I picture Him extending it.',
    prayer:'Lord, thank You for delighting in mercy rather than reluctantly giving it. Help me delight in showing it to others too. Amen.' },
  { id:244, topic:'Mercy', cat:'worth', ref:'Hebrews 4:16',
    verse:'Let us therefore come boldly unto the throne of grace, that we may obtain mercy, and find grace to help in time of need.',
    truth:'I don’t have to approach God timidly hoping for mercy — I’m invited to come boldly, because mercy is exactly what’s waiting there.',
    prayer:'Father, help me come boldly to Your throne of grace, trusting mercy is what I’ll find there. Amen.' },
  { id:245, topic:'Mercy', cat:'worth', ref:'Luke 6:36',
    verse:'Be ye therefore merciful, as your Father also is merciful.',
    truth:'The mercy I’ve received isn’t meant to stop with me — it’s meant to be extended outward, the way my Father extends it to me.',
    prayer:'Lord, help me be as merciful to others as You have been to me. Amen.' },
  { id:60, topic:'Grace', cat:'worth', ref:'Ephesians 2:8',
    verse:'For by grace are ye saved through faith; and that not of yourselves: it is the gift of God.',
    truth:'I didn\u2019t earn my salvation and I never could \u2014 it\u2019s a gift, freely given.',
    prayer:'Lord, thank You for Your grace. Help me rest in what You\u2019ve done instead of striving to earn it. Amen.' },
  { id:246, topic:'Grace', cat:'worth', ref:'Romans 5:20',
    verse:'Moreover the law entered, that the offence might abound. But where sin abounded, grace did much more abound.',
    truth:'No matter how much sin or failure I bring to the table, grace has already outmatched it — it isn’t a close contest.',
    prayer:'Lord, thank You that Your grace abounds even more than my failure. Let that truth silence my shame. Amen.' },
  { id:247, topic:'Grace', cat:'worth', ref:'2 Corinthians 9:8',
    verse:'And God is able to make all grace abound toward you; that ye, always having all sufficiency in all things, may abound to every good work.',
    truth:'Grace isn’t a limited resource I have to ration — God is able to make it abound so I have all I need for every good work.',
    prayer:'Father, let Your grace abound toward me so I have all sufficiency for what You’ve called me to do. Amen.' },
  { id:248, topic:'Grace', cat:'worth', ref:'Titus 2:11-12',
    verse:'For the grace of God that bringeth salvation hath appeared to all men, Teaching us that, denying ungodliness and worldly lusts, we should live soberly, righteously, and godly, in this present world.',
    truth:'Grace doesn’t just save me — it actively teaches and trains me toward a different way of living, not just a different verdict.',
    prayer:'Lord, let Your grace teach me to live soberly and rightly today, not just cover what I’ve already done. Amen.' },
  { id:249, topic:'Grace', cat:'worth', ref:'1 Corinthians 15:10',
    verse:'But by the grace of God I am what I am: and his grace which was bestowed upon me was not in vain.',
    truth:'Whatever I’ve become isn’t ultimately my own doing — it’s grace that made me who I am, and that grace hasn’t been wasted.',
    prayer:'Father, by Your grace I am what I am. Let that grace not be in vain in my life. Amen.' },
  { id:61, topic:'Contentment', cat:'joy', ref:'Philippians 4:11',
    verse:'I have learned, in whatsoever state I am, therewith to be content.',
    truth:'Contentment isn\u2019t about having everything I want \u2014 it\u2019s something I learn no matter my circumstances.',
    prayer:'Lord, teach me to be content right where I am. Quiet the part of me that always wants more. Amen.' },
  { id:394, topic:'Contentment', cat:'joy', ref:'1 Timothy 6:6',
    verse:'But godliness with contentment is great gain.',
    truth:'Contentment isn’t settling for less — paired with godliness, scripture actually calls it great gain.',
    prayer:'Lord, grow contentment in me, trusting it’s gain, not loss. Amen.' },
  { id:395, topic:'Contentment', cat:'joy', ref:'1 Timothy 6:8',
    verse:'And having food and raiment let us be therewith content.',
    truth:'Contentment can start incredibly simply — with the basics I already have, before I look at everything I don’t.',
    prayer:'Father, help me be content with what I have today, instead of always looking at what I lack. Amen.' },
  { id:396, topic:'Contentment', cat:'joy', ref:'Proverbs 30:8-9',
    verse:'Give me neither poverty nor riches; feed me with food convenient for me: Lest I be full, and deny thee, and say, Who is the LORD? or lest I be poor, and steal, and take the name of my God in vain.',
    truth:'This prayer for ‘just enough’ shows contentment isn’t about extremes in either direction — it’s about staying close to God regardless.',
    prayer:'Lord, give me just what I need, and keep my heart close to You whether I have plenty or little. Amen.' },
  { id:397, topic:'Contentment', cat:'joy', ref:'Psalm 23:1',
    verse:'The LORD is my shepherd; I shall not want.',
    truth:'Contentment isn’t about having everything — it’s trusting the Shepherd enough to believe I actually won’t lack what matters.',
    prayer:'Lord, You are my shepherd. Help me trust that I truly shall not want. Amen.' },
  { id:62, topic:'Unity', cat:'heart', ref:'Psalm 133:1',
    verse:'Behold, how good and how pleasant it is for brethren to dwell together in unity!',
    truth:'There\u2019s something good and beautiful when we choose to stay together instead of drifting apart.',
    prayer:'Lord, help me pursue unity with those around me. Show me how to build bridges, not walls. Amen.' },
  { id:186, topic:'Unity', cat:'heart', ref:'Ephesians 4:3',
    verse:'Endeavouring to keep the unity of the Spirit in the bond of peace.',
    truth:'Unity doesn’t just happen — it takes real effort to keep it, held together by peace rather than by everyone agreeing on everything.',
    prayer:'Lord, help me endeavor to keep unity and peace with those around me, even when it takes effort. Amen.' },
  { id:187, topic:'Unity', cat:'heart', ref:'Romans 12:16',
    verse:'Be of the same mind one toward another. Mind not high things, but condescend to men of low estate. Be not wise in your own conceits.',
    truth:'Real unity means I don’t have to be right or important in every room — it means valuing people over my own status.',
    prayer:'Father, keep me from being wise in my own conceits. Help me value others over my own status and opinions. Amen.' },
  { id:188, topic:'Unity', cat:'heart', ref:'John 17:21',
    verse:'That they all may be one; as thou, Father, art in me, and I in thee, that they also may be one in us: that the world may believe that thou hast sent me.',
    truth:'Jesus prayed for our unity Himself — it’s not a nice extra, it’s something He cared enough about to pray for before He went to the cross.',
    prayer:'Jesus, You prayed for us to be one. Help me be an answer to that prayer, not an obstacle to it. Amen.' },
  { id:189, topic:'Unity', cat:'heart', ref:'1 Corinthians 12:25-26',
    verse:'That there should be no schism in the body; but that the members should have the same care one for another. And whether one member suffer, all the members suffer with it; or one member be honoured, all the members rejoice with it.',
    truth:'I’m connected to the people around me more than I usually act like it — their pain and joy are meant to matter to me too.',
    prayer:'Lord, help me care for others’ pain and joy as if it were my own. Knit us together as one body. Amen.' },
  { id:63, topic:'Rest', cat:'joy', ref:'Matthew 11:28',
    verse:'Come unto me, all ye that labour and are heavy laden, and I will give you rest.',
    truth:'I don\u2019t have to carry this alone \u2014 Jesus offers real rest to anyone who\u2019s tired.',
    prayer:'Lord, I\u2019m tired. Thank You for offering me rest. Help me actually receive it instead of pushing through. Amen.' },
  { id:398, topic:'Rest', cat:'joy', ref:'Psalm 127:2',
    verse:'It is vain for you to rise up early, to sit up late, to eat the bread of sorrows: for so he giveth his beloved sleep.',
    truth:'Striving without rest is called vain here — God gives rest to those He loves, not as a luxury but as a gift.',
    prayer:'Lord, help me receive rest as Your gift, not something I have to strive to earn. Amen.' },
  { id:399, topic:'Rest', cat:'joy', ref:'Hebrews 4:9-10',
    verse:'There remaineth therefore a rest to the people of God. For he that is entered into his rest, he also hath ceased from his own works, as God did from his.',
    truth:'Real rest means ceasing from my own works, trusting God’s finished work instead of my endless striving.',
    prayer:'Father, help me enter Your rest, ceasing from my own striving the way You rested from Yours. Amen.' },
  { id:400, topic:'Rest', cat:'joy', ref:'Exodus 20:8-10',
    verse:'Remember the sabbath day, to keep it holy. Six days shalt thou labour, and do all thy work: But the seventh day is the sabbath of the LORD thy God.',
    truth:'Rest isn’t a modern invention or a sign of weakness — it was built into creation’s rhythm from the very beginning.',
    prayer:'Lord, help me honor rest as part of the rhythm You built into life from the beginning. Amen.' },
  { id:401, topic:'Rest', cat:'joy', ref:'Isaiah 30:15',
    verse:'For thus saith the Lord GOD, the Holy One of Israel; In returning and rest shall ye be saved; in quietness and in confidence shall be your strength.',
    truth:'Strength doesn’t always come from doing more — sometimes it comes from returning, resting, and staying quietly confident.',
    prayer:'Lord, teach me that my strength can come from rest and quiet confidence, not just constant effort. Amen.' },
  { id:64, topic:'Renewal', cat:'purpose', ref:'Isaiah 40:31',
    verse:'But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint.',
    truth:'When my strength runs out, God\u2019s doesn\u2019t \u2014 waiting on Him is how I\u2019m renewed.',
    prayer:'Lord, renew my strength today. Help me wait on You instead of running on empty. Amen.' },
  { id:438, topic:'Renewal', cat:'purpose', ref:'Ephesians 4:23',
    verse:'And be renewed in the spirit of your mind.',
    truth:'Renewal isn’t just about my circumstances changing — it starts in the spirit of my mind, how I actually think.',
    prayer:'Lord, renew the spirit of my mind today. Change how I think, not just what happens around me. Amen.' },
  { id:439, topic:'Renewal', cat:'purpose', ref:'Isaiah 43:19',
    verse:'Behold, I will do a new thing; now it shall spring forth; shall ye not know it? I will even make a way in the wilderness, and rivers in the desert.',
    truth:'God isn’t limited to repeating what He’s already done — He’s actively doing new things, even making a way where I see only wilderness.',
    prayer:'Lord, do a new thing in my life. Make a way where I only see wilderness right now. Amen.' },
  { id:440, topic:'Renewal', cat:'purpose', ref:'Psalm 103:5',
    verse:'Who satisfieth thy mouth with good things; so that thy youth is renewed like the eagle’s.',
    truth:'Renewal isn’t just spiritual language — God actually satisfies and refreshes in ways that touch my whole life, like strength coming back.',
    prayer:'Lord, satisfy me with good things and renew my strength like the eagle’s today. Amen.' },
  { id:441, topic:'Renewal', cat:'purpose', ref:'Revelation 21:5',
    verse:'And he that sat upon the throne said, Behold, I make all things new.',
    truth:'Renewal isn’t a partial fix — God’s ultimate plan is to make all things new, and that includes whatever feels worn out in me.',
    prayer:'Lord, thank You for the promise to make all things new. I trust that promise includes me. Amen.' },
  { id:65, topic:'Protection', cat:'purpose', ref:'Psalm 91:1',
    verse:'He that dwelleth in the secret place of the most High shall abide under the shadow of the Almighty.',
    truth:'I can rest in the shadow of the Almighty \u2014 that\u2019s the safest place I could ever be.',
    prayer:'Lord, thank You for being my shelter. Help me dwell close to You today. Amen.' },
  { id:442, topic:'Protection', cat:'purpose', ref:'Psalm 121:7-8',
    verse:'The LORD shall preserve thee from all evil: he shall preserve thy soul. The LORD shall preserve thy going out and thy coming in from this time forth, and even for evermore.',
    truth:'God’s protection isn’t limited to dramatic moments — it covers the ordinary comings and goings of my everyday life.',
    prayer:'Lord, preserve my going out and coming in today, in the ordinary moments as much as the big ones. Amen.' },
  { id:443, topic:'Protection', cat:'purpose', ref:'Proverbs 18:10',
    verse:'The name of the LORD is a strong tower: the righteous runneth into it, and is safe.',
    truth:'Safety isn’t something I have to create for myself — I can actually run somewhere real, into the strength of God’s own name.',
    prayer:'Lord, You are my strong tower. I run to You today and trust I am safe. Amen.' },
  { id:444, topic:'Protection', cat:'purpose', ref:'2 Thessalonians 3:3',
    verse:'But the Lord is faithful, who shall stablish you, and keep you from evil.',
    truth:'God’s protection isn’t unpredictable — it flows from His faithfulness, something steady I can count on.',
    prayer:'Father, thank You for being faithful to establish and keep me from evil. Amen.' },
  { id:445, topic:'Protection', cat:'purpose', ref:'Psalm 34:7',
    verse:'The angel of the LORD encampeth round about them that fear him, and delivereth them.',
    truth:'I may not always see it, but there’s real protection surrounding me — God’s care isn’t just a metaphor, it’s active and present.',
    prayer:'Lord, thank You for encamping around me, even when I can’t see it. Amen.' },
  { id:66, topic:'Healing', cat:'sorrow', ref:'Psalm 147:3',
    verse:'He healeth the broken in heart, and bindeth up their wounds.',
    truth:'God doesn\u2019t overlook a broken heart \u2014 He\u2019s near to bind it up.',
    prayer:'Lord, heal what\u2019s broken in me. Thank You for being close to the brokenhearted. Amen.' },
  { id:270, topic:'Healing', cat:'sorrow', ref:'Jeremiah 30:17',
    verse:'For I will restore health unto thee, and I will heal thee of thy wounds, saith the LORD.',
    truth:'Healing isn’t a maybe with God — it’s a direct promise He’s made, spoken over wounds I might think are permanent.',
    prayer:'Lord, thank You for promising to restore health and heal my wounds. I trust Your promise over what I feel. Amen.' },
  { id:271, topic:'Healing', cat:'sorrow', ref:'Exodus 15:26',
    verse:'For I am the LORD that healeth thee.',
    truth:'Healing isn’t just something God does — it’s part of who He is, one of the very names He goes by.',
    prayer:'Lord, thank You for being the God who heals. I trust that name over my circumstances. Amen.' },
  { id:272, topic:'Healing', cat:'sorrow', ref:'James 5:15-16',
    verse:'And the prayer of faith shall save the sick, and the Lord shall raise him up. Confess your faults one to another, and pray one for another, that ye may be healed.',
    truth:'Healing often isn’t meant to happen alone — I’m invited to bring others into my prayer, not carry the process by myself.',
    prayer:'Lord, teach me not to carry healing alone. Bring people around me to pray with me and for me. Amen.' },
  { id:273, topic:'Healing', cat:'sorrow', ref:'Psalm 103:2-3',
    verse:'Bless the LORD, O my soul, and forget not all his benefits: Who forgiveth all thine iniquities; who healeth all thy diseases.',
    truth:'Forgiveness and healing are named together here — God cares about my whole self, not just the spiritual part of me.',
    prayer:'Lord, thank You for forgiving my sins and healing my diseases. I bless You for caring about all of me. Amen.' },

  { id:67, topic:'Self-Control', cat:'faith', ref:'Proverbs 25:28',
    verse:'He that hath no rule over his own spirit is like a city that is broken down, and without walls.',
    truth:'Without self-control, I\u2019m defenseless against my own impulses \u2014 but God helps me build real walls.',
    prayer:'Lord, help me rule my own spirit today. Strengthen my self-control where I\u2019m weak. Amen.' },
  { id:330, topic:'Self-Control', cat:'faith', ref:'1 Corinthians 9:27',
    verse:'But I keep under my body, and bring it into subjection: lest that by any means, when I have preached to others, I myself should be a castaway.',
    truth:'Self-control isn’t optional for me even after helping others grow — Paul disciplined his own body so his life matched his words.',
